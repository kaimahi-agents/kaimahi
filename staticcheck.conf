# staticcheck's configuration for both of this repository's Go modules.
#
# Run it exactly as CI does. The version matters and is not the released
# one — see the pin and the reason in .github/workflows/ci.yml:
#
#     go install honnef.co/go/tools/cmd/staticcheck@<the version CI pins>
#     staticcheck ./...          # root module
#     cd plane && staticcheck ./...
#
# This file sits at the repository root and applies to `plane/` too:
# staticcheck walks up from each package's directory until it finds a
# config, so the separate module inherits this one rather than needing a
# copy that could drift from it.
#
# ST1005 is the only check disabled, and it is a decision rather than a
# backlog.
#
# ST1005 requires an error string to be lowercase, unpunctuated and free of
# newlines — a rule written for errors that get wrapped by a caller and end
# up in the middle of somebody else's sentence. kmx's errors are not that.
# They are the last thing an operator reads before the run stops, and they
# are written as prose on purpose: a sentence saying what went wrong, then
# an indented line saying what to do about it. The repository's stated
# posture is that an error a person can act on beats an error that lints.
#
# The size of the decision, so nobody has to guess: 43 findings in the root
# module, all ST1005, counted with `staticcheck ./... | grep -c ST1005`
# against the commit that added this file. Turning the check on means
# rewriting all 43 into fragments, which changes user-visible text — and
# that is a product decision, not a lint fix, so it does not get made by
# leaving a linter on and letting somebody satisfy it one error at a time.
#
# "inherit" is staticcheck's own default set, so this file subtracts one
# check rather than silently replacing the defaults with `all`.
checks = ["inherit", "-ST1005"]
