name: release

# The tag is the source of truth. Everything below is derived from it: the
# version the binaries report, the notes, and whether this is a pre-release.
#
# Keyless, like the rest of this project's CI. The only credential is
# the GITHUB_TOKEN GitHub mints for the run, scoped to `contents: write`
# because creating a release IS a write to this repository's contents. No
# repository secret is added, and none is needed: nothing is pushed to a
# package registry, a container registry or a Homebrew tap.
on:
  push:
    tags: ["v*"]
  # The same build, published nowhere — how the release path is exercised
  # from a branch before a tag exists (and how a broken release job is
  # debugged without burning a version number).
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp for a dry run (a real tag is never needed)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      # Creating the release. Nothing else is written.
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          # The plane-tag check below needs the tags, and the build needs
          # clean VCS stamping — a shallow checkout gives both as long as
          # tags come with it.
          fetch-depth: 0
          persist-credentials: false

      - name: Decide what is being built
        id: what
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # `synthetic` marks the one case where the version was invented by
          # this job rather than chosen by a person: a manual dry run with no
          # version given. It exists so the notes step can tell "rehearse a
          # release" from "rehearse the machinery" — v0.0.0-dryrun.<sha> has
          # no changelog section and never will.
          synthetic=false
          if [ "$REF_TYPE" = tag ]; then
            version="$REF_NAME"
            dry_run=false
          elif [ -n "$INPUT_VERSION" ]; then
            version="$INPUT_VERSION"
            dry_run=true
          else
            version="v0.0.0-dryrun.${SHA:0:12}"
            dry_run=true
            synthetic=true
          fi
          # Semantic, pre-1.0, `v`-prefixed: what `go install …@<version>`
          # and the Go module proxy accept. A tag this pattern does not
          # match must not produce binaries claiming to be a version.
          if ! printf '%s' "$version" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "refusing to build '$version': not a semantic v<major>.<minor>.<patch>[-prerelease] version" >&2
            exit 1
          fi
          prerelease=false
          case "$version" in *-*) prerelease=true ;; esac
          echo "version=$version"     >> "$GITHUB_OUTPUT"
          echo "dry_run=$dry_run"     >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "synthetic=$synthetic" >> "$GITHUB_OUTPUT"
          echo "building $version (dry_run=$dry_run, prerelease=$prerelease, synthetic=$synthetic)"

      # The plane is a SEPARATE Go module (plane/), and Go resolves a nested
      # module's version from a `plane/`-prefixed tag. A kmx installed with
      # `go install …/cmd/kmx@v0.1.0` fetches the plane at v0.1.0 — which
      # resolves to the tag `plane/v0.1.0`. Without that tag, `kmx plane`
      # fails for every user of this release and there is no way to fix it
      # after the fact except a new version. Refuse to publish first.
      - name: The plane's module tag exists, at this same commit
        if: steps.what.outputs.dry_run == 'false'
        env:
          VERSION: ${{ steps.what.outputs.version }}
        run: |
          set -euo pipefail
          plane_tag="plane/$VERSION"
          if ! git rev-parse -q --verify "refs/tags/$plane_tag" >/dev/null; then
            echo "missing tag '$plane_tag'." >&2
            echo "  \`kmx plane\` on this release would run: go install .../plane/cmd/kaimahi-proxy@$VERSION" >&2
            echo "  which Go resolves through that tag. Tag the same commit and push it:" >&2
            echo "    git tag $plane_tag $VERSION && git push origin $plane_tag" >&2
            exit 1
          fi
          want=$(git rev-parse "$VERSION^{commit}")
          got=$(git rev-parse "$plane_tag^{commit}")
          if [ "$want" != "$got" ]; then
            echo "'$plane_tag' points at $got but '$VERSION' points at $want — the binary and the plane would be different code" >&2
            exit 1
          fi
          echo "$plane_tag -> $got, same commit as $VERSION"

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Notes come from CHANGELOG.md and the extraction fails when the
      # section is missing, so a version cannot be published undocumented.
      #
      # That refusal applies to every version a PERSON named — a tag, or a
      # dry run given an explicit version, which is how you rehearse a
      # release before cutting it. It cannot apply to a version this job
      # invented for a dry run: v0.0.0-dryrun.<sha> has no section, so
      # requiring one would make the "debug the release job without burning
      # a version number" path fail before it built anything. That case
      # reads the Unreleased section instead — the extractor still runs, and
      # nothing is published either way.
      - name: Release notes exist for this version
        env:
          VERSION: ${{ steps.what.outputs.version }}
          SYNTHETIC: ${{ steps.what.outputs.synthetic }}
          NOTES: ${{ runner.temp }}/release-notes.md
        run: |
          set -euo pipefail
          # OUTSIDE the checkout, deliberately. Writing this file into the
          # working tree is what made v0.1.0-rc.1 ship with
          # vcs.modified=true stamped into every binary.
          if [ "$SYNTHETIC" != true ]; then
            python3 scripts/release-notes.py "$VERSION" | tee "$NOTES"
          else
            # Branch on WHICH failure, not on "it failed" — the same
            # distinction the secret scan in ci.yml makes between grep's
            # "no match" and "the scanner did not run". Exit 3 (NO_SECTION)
            # is the only one a rehearsal may shrug off; anything else means
            # the script or the changelog is broken, which is precisely what
            # a dry run is for.
            set +e
            python3 scripts/release-notes.py Unreleased > "$NOTES" 2>"$RUNNER_TEMP/notes.err"
            rc=$?
            set -e
            cat "$RUNNER_TEMP/notes.err" >&2
            case "$rc" in
              0)
                echo "dry run: notes taken from the Unreleased section"
                cat "$NOTES"
                ;;
              3)
                # An empty Unreleased section is a real thing right after a
                # release is cut, and it must not fail a rehearsal.
                echo "Dry run of $VERSION. Not published." > "$NOTES"
                echo "dry run: no usable Unreleased section; using a placeholder"
                ;;
              *)
                echo "release-notes.py failed with exit $rc — the release job is broken, which is what this dry run is for" >&2
                exit "$rc"
                ;;
            esac
          fi
          test -s "$NOTES"

      # A release is a provenance claim. The tree it is built from must be
      # the tagged tree and nothing else — an untracked file here becomes
      # vcs.modified=true in every artifact.
      - name: The tree being released is clean
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            echo "refusing to build a release from a modified working tree" >&2
            exit 1
          fi
          echo "working tree clean at $(git rev-parse HEAD)"

      - name: Build the binaries
        env:
          VERSION: ${{ steps.what.outputs.version }}
        run: |
          set -euo pipefail
          # Built OUTSIDE the checkout, for the same reason the notes are:
          # nothing this job writes may end up in the tree it is stamping.
          mkdir -p "$RUNNER_TEMP/dist"
          # Platforms, and why exactly these: kmx drives a Linux container
          # runtime (kind), so the machine running it is a Linux host or a
          # Mac running one in a VM — amd64 and arm64 cover both, and are
          # the same four platforms the pinned kagent CLI publishes, which
          # kmx downloads for the SAME machine. Windows is served through
          # WSL, which is linux/amd64; a native windows/amd64 build would
          # be an untested claim, not a platform.
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            goos="${target%/*}"; goarch="${target#*/}"
            out="$RUNNER_TEMP/dist/kmx-$goos-$goarch"
            echo "building $out"
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
              go build -trimpath \
                -ldflags "-s -w -X github.com/kaimahi-agents/kaimahi/internal/kmx/version.Tag=$VERSION" \
                -o "$out" ./cmd/kmx
          done
          ls -l "$RUNNER_TEMP/dist"

      # The binary must say what it is. That is what version stamping is
      # for, and this runs on the actual artifact — the runner is
      # linux/amd64, so that is the one that can be executed here.
      - name: The released binary reports its own version
        env:
          VERSION: ${{ steps.what.outputs.version }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/dist/kmx-linux-amd64" version | tee "$RUNNER_TEMP/reported.txt"
          test "$(head -1 "$RUNNER_TEMP/reported.txt")" = "kmx $VERSION (release build)"
          # And the plane it would deploy is this same version. rc.1 shipped
          # a binary that reported its tag and then could not name a plane
          # revision at all; one assertion on the first line would not have
          # caught it.
          grep -q "built from $VERSION\$" "$RUNNER_TEMP/reported.txt"
          # Provenance, from the artifact itself.
          go version -m "$RUNNER_TEMP/dist/kmx-linux-amd64" | tee "$RUNNER_TEMP/buildinfo.txt"
          grep -q "vcs.revision=$GITHUB_SHA" "$RUNNER_TEMP/buildinfo.txt"
          if grep -q 'vcs.modified=true' "$RUNNER_TEMP/buildinfo.txt"; then
            echo "the released binary is stamped as built from a modified tree" >&2
            exit 1
          fi

      # Exercise the artifact with no checkout files in reach. The runner can
      # execute only the linux/amd64 member of the cross-platform release set.
      - name: The released binary carries the release workflow
        run: |
          set -euo pipefail
          empty=$(mktemp -d)
          cd "$empty"
          test -z "$(ls -A)"
          "$RUNNER_TEMP/dist/kmx-linux-amd64" workflow list | tee "$RUNNER_TEMP/workflows.txt"
          grep -q '^release ' "$RUNNER_TEMP/workflows.txt"
          "$RUNNER_TEMP/dist/kmx-linux-amd64" workflow show release \
            --set repo=example/example \
            --set version=v0.0.0-test \
            --set ado_org=example \
            --set ado_project=example \
            --set ado_builds=1 \
            --set notes_file=/dev/null \
            | tee "$RUNNER_TEMP/release-workflow.txt"
          grep -q 'runs: the bundled script release-publish.sh' "$RUNNER_TEMP/release-workflow.txt"

      - name: Checksums
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/dist"
          # Names only, no directory component: the file is meant to be
          # downloaded next to the binary and checked with
          # `sha256sum --ignore-missing -c checksums.txt`, which is what
          # docs/releases.md tells an adopter to run. (The kagent CLI's own
          # .sha256 files carry the BUILDER's path, and kmx has to parse
          # around it — internal/kmx/kagentcli. Do not repeat that here.)
          sha256sum kmx-* > checksums.txt
          cat checksums.txt
          # Prove the instruction in the docs actually works, here, before
          # anyone downloads anything.
          sha256sum --ignore-missing -c checksums.txt

      - name: Publish the release
        if: steps.what.outputs.dry_run == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.what.outputs.version }}
          PRERELEASE: ${{ steps.what.outputs.prerelease }}
        run: |
          set -euo pipefail
          flags=(--title "$VERSION" --notes-file "$RUNNER_TEMP/release-notes.md" --verify-tag)
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          gh release create "$VERSION" "${flags[@]}" \
            "$RUNNER_TEMP"/dist/kmx-* "$RUNNER_TEMP/dist/checksums.txt"

      # A dry run publishes nothing; the artifacts are how its output is
      # inspected (and how a clean machine can be handed the exact bytes a
      # release would have contained).
      - name: Upload the dry-run artifacts
        if: steps.what.outputs.dry_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: kmx-${{ steps.what.outputs.version }}
          path: ${{ runner.temp }}/dist/
          if-no-files-found: error
