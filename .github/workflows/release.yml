name: release

# The tag is the source of truth. Everything below is derived from it: the
# version the binaries report, the notes, and whether this is a pre-release.
#
# Keyless: GitHub's run token publishes assets, and GitHub OIDC certifies
# the ephemeral signing key for the checksum manifest. No
# repository secret is added, and none is needed: nothing is pushed to a
# package registry, a container registry or a Homebrew tap. The release carries
# the formula as an asset; a reviewed tap PR validates and publishes it.
on:
  push:
    tags: ["v*"]
  # The same build, published nowhere — how the release path is exercised
  # from a branch before a tag exists (and how a broken release job is
  # debugged without burning a version number).
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp for a dry run (a real tag is never needed)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  release-contracts:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build Go runtime fixture
        run: go build -o "$RUNNER_TEMP/kmx-host-fixture" ./cmd/kmx
      - name: Agent canvas, authoring and text fallback contracts
        env:
          KMX_HOST_BRIDGE_TEST_BINARY: ${{ runner.temp }}/kmx-host-fixture
        run: node --test plugins/tests/copilot/*.test.mjs
      - name: Package, WSL plugin and real MCP loop contracts
        run: python -m unittest discover -s plugins/copilot -p 'test_*.py' -v
      - name: Local previews on embedded Sessions (hermetic)
        run: go test ./internal/kmx/localpreview -count=1

  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.what.outputs.version }}
      dry_run: ${{ steps.what.outputs.dry_run }}
      prerelease: ${{ steps.what.outputs.prerelease }}
    permissions:
      contents: read
      # Obtain a GitHub OIDC certificate for keyless checksum signing.
      id-token: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          # GoReleaser needs tags and clean VCS stamping.
          fetch-depth: 0
          persist-credentials: false

      - name: Decide what is being built
        id: what
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          # `synthetic` marks the one case where the version was invented by
          # this job rather than chosen by a person: a manual dry run with no
          # version given. It exists so the notes step can tell "rehearse a
          # release" from "rehearse the machinery". Run ID and attempt make
          # the stamped binaries/checksums distinct even for the same commit;
          # repeated rehearsals must not re-sign an identical log payload.
          # Synthetic versions have no changelog section and never will.
          synthetic=false
          if [ "$EVENT_NAME" = push ] && [ "$REF_TYPE" = tag ]; then
            version="$REF_NAME"
            dry_run=false
          elif [ -n "$INPUT_VERSION" ]; then
            version="$INPUT_VERSION"
            dry_run=true
          else
            version="v0.0.0-dryrun.${SHA:0:12}.${RUN_ID}.${RUN_ATTEMPT}"
            dry_run=true
            synthetic=true
          fi
          # Semantic, pre-1.0, `v`-prefixed: what `go install …@<version>`
          # and the Go module proxy accept. A tag this pattern does not
          # match must not produce binaries claiming to be a version.
          if ! python3 scripts/homebrew-formula.py --check-version "$version"; then
            echo "refusing to build '$version': not a semantic v<major>.<minor>.<patch>[-prerelease] version" >&2
            exit 1
          fi
          prerelease=false
          case "$version" in *-*) prerelease=true ;; esac
          {
            echo "version=$version"
            echo "dry_run=$dry_run"
            echo "prerelease=$prerelease"
            echo "synthetic=$synthetic"
          } >> "$GITHUB_OUTPUT"
          echo "building $version (dry_run=$dry_run, prerelease=$prerelease, synthetic=$synthetic)"

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Notes come from CHANGELOG.md and the extraction fails when the
      # section is missing, so a version cannot be published undocumented.
      #
      # That refusal applies to every version a PERSON named — a tag, or a
      # dry run given an explicit version, which is how you rehearse a
      # release before cutting it. It cannot apply to a version this job
      # invented for a dry run: v0.0.0-dryrun.<sha>.<run>.<attempt> has no section, so
      # requiring one would make the "debug the release job without burning
      # a version number" path fail before it built anything. That case
      # reads the Unreleased section instead — the extractor still runs, and
      # nothing is published either way.
      - name: Release notes exist for this version
        env:
          VERSION: ${{ steps.what.outputs.version }}
          SYNTHETIC: ${{ steps.what.outputs.synthetic }}
          NOTES: ${{ runner.temp }}/release-notes.md
        run: |
          set -euo pipefail
          # OUTSIDE the checkout, deliberately. Writing this file into the
          # working tree is what made v0.1.0-rc.1 ship with
          # vcs.modified=true stamped into every binary.
          if [ "$SYNTHETIC" != true ]; then
            python3 scripts/release-notes.py "$VERSION" | tee "$NOTES"
          else
            # Branch on WHICH failure, not on "it failed" — the same
            # distinction the secret scan in ci.yml makes between grep's
            # "no match" and "the scanner did not run". Exit 3 (NO_SECTION)
            # is the only one a rehearsal may shrug off; anything else means
            # the script or the changelog is broken, which is precisely what
            # a dry run is for.
            set +e
            python3 scripts/release-notes.py Unreleased > "$NOTES" 2>"$RUNNER_TEMP/notes.err"
            rc=$?
            set -e
            cat "$RUNNER_TEMP/notes.err" >&2
            case "$rc" in
              0)
                echo "dry run: notes taken from the Unreleased section"
                cat "$NOTES"
                ;;
              3)
                # An empty Unreleased section is a real thing right after a
                # release is cut, and it must not fail a rehearsal.
                echo "Dry run of $VERSION. Not published." > "$NOTES"
                echo "dry run: no usable Unreleased section; using a placeholder"
                ;;
              *)
                echo "release-notes.py failed with exit $rc — the release job is broken, which is what this dry run is for" >&2
                exit "$rc"
                ;;
            esac
          fi
          test -s "$NOTES"
          printf '\nRuntime qualification: this release checks the inner loop; Orka and kagent are qualified nightly on main and on demand before runtime-related tags.\n' >> "$NOTES"

      # A release is a provenance claim. The tree it is built from must be
      # the tagged tree and nothing else — an untracked file here becomes
      # vcs.modified=true in every artifact.
      - name: The tree being released is clean
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            echo "refusing to build a release from a modified working tree" >&2
            exit 1
          fi
          echo "working tree clean at $(git rev-parse HEAD)"

      # Pinned through the Go module proxy and its checksum database — the
      # same provenance argument docs/releases.md makes for `go install`,
      # applied to the tool that builds this release rather than a
      # marketplace action.
      - name: Install GoReleaser
        run: go install github.com/goreleaser/goreleaser/v2@v2.18.2

      # dist/ is gitignored, so it stays out of `git status --porcelain`
      # while still living inside the checkout — GoReleaser must run from a
      # directory that is a git repo and a Go module, so it cannot be
      # relocated to $RUNNER_TEMP the way the old go-build loop was.
      #
      # Run once with publishing skipped, whether this is a dry run or the
      # real thing: every check below runs against this build, and nothing
      # is published (no GitHub release, no tap commit — the tap PR stays a
      # human's job either way, see .goreleaser.yaml) until they all pass.
      - name: Build the release with GoReleaser
        env:
          GORELEASER_CURRENT_TAG: ${{ steps.what.outputs.version }}
        run: goreleaser release --clean --skip=publish,validate

      # Platforms, and why exactly these: kmx drives a Linux container
      # runtime (kind), so the machine running it is a Linux host or a Mac
      # running one in a VM — amd64 and arm64 cover both, and are the same
      # four platforms the pinned cluster tools publish, which kmx downloads
      # for the SAME machine. Windows is served through WSL, which is
      # linux/amd64; a native windows/amd64 build would be an untested
      # claim, not a platform. .goreleaser.yaml's `builds` pins this set.
      - name: The four release binaries exist
        run: |
          set -euo pipefail
          for target in linux_amd64 linux_arm64 darwin_amd64 darwin_arm64; do
            matches=(dist/kmx_"$target"*/kmx)
            test "${#matches[@]}" -eq 1
            test -f "${matches[0]}"
          done

      # The binary must say what it is. That is what version stamping is
      # for, and this runs on the actual artifact — the runner is
      # linux/amd64, so that is the one that can be executed here.
      - name: The released binary reports its own version
        env:
          VERSION: ${{ steps.what.outputs.version }}
        run: |
          set -euo pipefail
          bin=$(echo dist/kmx_linux_amd64_*/kmx)
          "$bin" version | tee "$RUNNER_TEMP/reported.txt"
          test "$(head -1 "$RUNNER_TEMP/reported.txt")" = "kmx $VERSION (release build)"
          # Provenance, from the artifact itself.
          go version -m "$bin" | tee "$RUNNER_TEMP/buildinfo.txt"
          grep -q "vcs.revision=$GITHUB_SHA" "$RUNNER_TEMP/buildinfo.txt"
          if grep -q 'vcs.modified=true' "$RUNNER_TEMP/buildinfo.txt"; then
            echo "the released binary is stamped as built from a modified tree" >&2
            exit 1
          fi

      # dist/checksums.txt names assets the way they will be uploaded
      # (kmx-$os-$arch, no directory component) — .goreleaser.yaml's
      # `archives.name_template` sets that, matching what install.sh and
      # docs/releases.md's "by hand" section already expect.
      - name: Checksums match the built binaries
        env:
          VERSION: ${{ steps.what.outputs.version }}
        run: |
          set -euo pipefail
          cat dist/checksums.txt
          # The renderer's parser enforces exactly one entry for each of the
          # four expected assets, with no unknown names. Without this, the
          # loop below would vacuously accept an empty or incomplete manifest.
          python3 scripts/homebrew-formula.py "$VERSION" dist/checksums.txt >/dev/null
          while read -r want name; do
            suffix=$(printf '%s' "${name#kmx-}" | tr - _)
            matches=(dist/kmx_"$suffix"*/kmx)
            test "${#matches[@]}" -eq 1
            test -f "${matches[0]}"
            got=$(sha256sum "${matches[0]}" | cut -d' ' -f1)
            test "$want" = "$got" || { echo "checksum mismatch for $name" >&2; exit 1; }
          done < dist/checksums.txt

      # GoReleaser always emits an explicit `version "X.Y.Z"` line. Homebrew
      # infers stable versions from their release URLs and strict audit rejects
      # the redundant line, but prerelease URL inference is not reliable and
      # those formulas need the explicit version retained.
      - name: Homebrew formula renders
        env:
          VERSION: ${{ steps.what.outputs.version }}
          PRERELEASE: ${{ steps.what.outputs.prerelease }}
        run: |
          set -euo pipefail
          if [ "$PRERELEASE" = true ]; then
            grep -qx "  version \"${VERSION#v}\"" dist/homebrew/Formula/kmx.rb
          else
            perl -i -ne 'print unless /^  version "/' dist/homebrew/Formula/kmx.rb
            if grep -q '^  version "' dist/homebrew/Formula/kmx.rb; then
              echo "stable formula still has a redundant version" >&2
              exit 1
            fi
          fi
          ruby -c dist/homebrew/Formula/kmx.rb
          test -s dist/homebrew/Formula/kmx.rb

      # Exercise the emitted test block, not a duplicate version assertion.
      # This is a binary smoke test, not a replacement for tap-side brew test.
      - name: Generated Homebrew test passes against the built binary
        env:
          VERSION: ${{ steps.what.outputs.version }}
        run: |
          set -euo pipefail
          binaries=(dist/kmx_linux_amd64*/kmx)
          test "${#binaries[@]}" -eq 1
          test -x "${binaries[0]}"
          ruby - dist/homebrew/Formula/kmx.rb "${binaries[0]}" <<'RUBY'
          require "open3"
          require "pathname"
          formula, binary = ARGV
          source = File.read(formula)
          block = source.match(/^  test do\n(.*?)^  end\nend\s*\z/m)
          abort "generated formula has no terminal test block" unless block
          harness = Object.new
          harness.define_singleton_method(:bin) { Pathname.new(File.expand_path(binary)).dirname }
          harness.define_singleton_method(:version) { ENV.fetch("VERSION").delete_prefix("v") }
          harness.define_singleton_method(:shell_output) do |command|
            stdout, stderr, status = Open3.capture3(command)
            raise "#{command} failed: #{stderr}" unless status.success?
            stdout
          end
          harness.define_singleton_method(:assert_equal) do |expected, actual|
            raise "expected #{expected.inspect}, got #{actual.inspect}" unless expected == actual
          end
          harness.instance_eval(block[1], formula, source[0...block.begin(1)].count("\n") + 1)
          puts "generated Homebrew test passed"
          RUBY

      # Stage one flat directory with the exact names in checksums.txt. Both
      # dry runs and real releases consume this directory, so rehearsal
      # artifacts have the same usable layout as public release assets.
      - name: Stage the checked release artifacts
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/release-assets"
          rm -rf "$artifact_dir"
          mkdir -p "$artifact_dir"
          for name in kmx-linux-amd64 kmx-linux-arm64 kmx-darwin-amd64 kmx-darwin-arm64; do
            suffix=$(printf '%s' "${name#kmx-}" | tr - _)
            matches=(dist/kmx_"$suffix"*/kmx)
            test "${#matches[@]}" -eq 1
            cp "${matches[0]}" "$artifact_dir/$name"
            cmp "${matches[0]}" "$artifact_dir/$name"
          done
          cp dist/checksums.txt "$artifact_dir/checksums.txt"
          cp dist/homebrew/Formula/kmx.rb "$artifact_dir/kmx.rb"
          cmp dist/checksums.txt "$artifact_dir/checksums.txt"
          cmp dist/homebrew/Formula/kmx.rb "$artifact_dir/kmx.rb"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6

      # Sign the validated manifest, not unchecked files or moving URLs.
      # Dry runs exercise the same signing path but publish no release.
      - name: Sign the checked checksum manifest
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/release-assets"
          cosign sign-blob --yes \
            --bundle "$artifact_dir/checksums.txt.sigstore.json" \
            "$artifact_dir/checksums.txt"

      - name: Verify the checksum signature
        env:
          CERTIFICATE_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/release-assets"
          cosign verify-blob \
            --certificate-identity "$CERTIFICATE_IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --bundle "$artifact_dir/checksums.txt.sigstore.json" \
            "$artifact_dir/checksums.txt"

      # The binary inventory has just been signature-verified. Package those
      # exact staged bytes, never another build or a path in dist/.
      - name: Package and validate Copilot plugin archives
        env:
          VERSION: ${{ steps.what.outputs.version }}
        run: |
          set -euo pipefail
          python3 plugins/copilot/release.py \
            --assets "$RUNNER_TEMP/release-assets" \
            --version "$VERSION" --revision "$GITHUB_SHA"

      - name: Sign the checked plugin checksum manifest
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/release-assets"
          cosign sign-blob --yes \
            --bundle "$artifact_dir/plugin-checksums.txt.sigstore.json" \
            "$artifact_dir/plugin-checksums.txt"

      - name: Verify the plugin checksum signature
        env:
          CERTIFICATE_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/release-assets"
          cosign verify-blob \
            --certificate-identity "$CERTIFICATE_IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --bundle "$artifact_dir/plugin-checksums.txt.sigstore.json" \
            "$artifact_dir/plugin-checksums.txt"

      - name: Include checked plugin digests in release guidance
        run: |
          set -euo pipefail
          {
            printf '\n### Copilot plugin archives\n\n'
            printf 'Verify the archive SHA256 below before extraction or execution. Configure the selected root in both mcp.json and selected-root.json before installing; see plugins/copilot/README.md in the tagged source.\n\n```text\n'
            cat "$RUNNER_TEMP/release-assets/plugin-checksums.txt"
            printf '```\n'
          } >> "$RUNNER_TEMP/release-notes.md"

      # Native install checks consume these exact cross-built bytes before any
      # release can publish. Dry runs retain the same complete artifact layout.
      - name: Upload checked artifacts for native qualification
        uses: actions/upload-artifact@v4
        with:
          name: kmx-${{ steps.what.outputs.version }}
          path: |
            ${{ runner.temp }}/release-assets/
            ${{ runner.temp }}/release-notes.md
          if-no-files-found: error
          overwrite: true

  plugin-install:
    needs: release
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: kmx-${{ needs.release.outputs.version }}
          path: ${{ runner.temp }}/checked-release
      - name: Install pinned Copilot CLI without dependency scripts
        run: npm install --prefix "$RUNNER_TEMP/copilot" --ignore-scripts --no-save @github/copilot@1.0.102
      - name: Verify native archive and run real isolated install cycle
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -s)" in Darwin) os=darwin;; Linux) os=linux;; *) exit 1;; esac
          case "$(uname -m)" in arm64|aarch64) arch=arm64;; x86_64) arch=amd64;; *) exit 1;; esac
          export KMX_NATIVE_ARCHIVE="$RUNNER_TEMP/checked-release/release-assets/kmx-agent-builder-$os-$arch.tar.gz"
          export KMX_NATIVE_COPILOT="$RUNNER_TEMP/copilot/node_modules/.bin/copilot"
          python3 -m unittest discover -s plugins/copilot -p test_native_install.py -v

  publish:
    needs: [release, plugin-install, release-contracts]
    if: needs.release.outputs.dry_run == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: kmx-${{ needs.release.outputs.version }}
          path: ${{ runner.temp }}/checked-release
      # Publish only after Linux AND macOS executed the exact staged engine and
      # checked an install/uninstall/reinstall in a fresh host profile.
      - name: Publish the checked release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.release.outputs.version }}
          PRERELEASE: ${{ needs.release.outputs.prerelease }}
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/checked-release/release-assets"
          assets=(
            "$artifact_dir/kmx-linux-amd64"
            "$artifact_dir/kmx-linux-arm64"
            "$artifact_dir/kmx-darwin-amd64"
            "$artifact_dir/kmx-darwin-arm64"
            "$artifact_dir/checksums.txt"
            "$artifact_dir/checksums.txt.sigstore.json"
            "$artifact_dir/kmx.rb"
            "$artifact_dir/kmx-agent-builder-linux-amd64.tar.gz"
            "$artifact_dir/kmx-agent-builder-linux-arm64.tar.gz"
            "$artifact_dir/kmx-agent-builder-darwin-amd64.tar.gz"
            "$artifact_dir/kmx-agent-builder-darwin-arm64.tar.gz"
            "$artifact_dir/plugin-checksums.txt"
            "$artifact_dir/plugin-checksums.txt.sigstore.json"
          )
          for asset in "${assets[@]}"; do test -f "$asset"; done
          flags=(--title "$VERSION" --notes-file "$RUNNER_TEMP/checked-release/release-notes.md" --verify-tag)
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          gh release create "$VERSION" "${flags[@]}" "${assets[@]}"
