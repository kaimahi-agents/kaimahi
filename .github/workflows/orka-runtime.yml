name: Orka runtime qualification

on:
  workflow_call:
    outputs:
      qualified_sha:
        description: Exact commit qualified by the full live runtime proof
        value: ${{ jobs.qualify.outputs.qualified_sha }}

permissions:
  contents: read

jobs:
  qualify:
    permissions:
      contents: read
    outputs:
      qualified_sha: ${{ steps.provenance.outputs.sha }}
    runs-on: ubuntu-latest
    # Sequential AIKit cold pull/startup (8m), warmup (3m), and three cases within 660s
    # follow the unchanged Ollama proof; no evaluation retry is permitted.
    timeout-minutes: 45
    env:
      KIND_CLUSTER: kmx-orka
      KUBE_CTX: kind-kmx-orka
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
          ref: ${{ github.sha }}
      - name: Qualify the exact caller commit
        id: provenance
        env:
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$EVENT_SHA" =~ ^[0-9a-f]{40}$ ]]
          actual=$(git rev-parse HEAD)
          expected=$(git rev-parse "$EVENT_SHA^{commit}")
          test "$actual" = "$expected"
          printf 'sha=%s\n' "$actual" >> "$GITHUB_OUTPUT"
      - name: Install kind
        run: |
          curl -sSfLo kind https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64
          chmod +x kind && sudo mv kind /usr/local/bin/kind
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build kmx
        run: |
          mkdir -p bin
          go build -o bin/kmx ./cmd/kmx
          go build -o bin/orka-native-reference ./scripts/ci/orka-native-reference.go
      - name: Configure CI registry mirrors
        run: python3 "$GITHUB_WORKSPACE/scripts/ci/registry-mirrors.py" setup
      # Component steps only. `kmx orka install` is the command under test
      # here, and the next step runs it with its digest verification and its
      # Provider's readiness asserted — a bare `kmx local up` would have installed
      # Orka already, and that step would then be asserting about somebody
      # else's work. The other half of this shard's point is what the Orka
      # path does NOT install: no legacy namespace or harness wrapper.
      - name: Cluster, Ollama and the model — no legacy runtime
        run: |
          set -euo pipefail
          if kind get clusters | grep -qx kmx-orka; then
            echo 'refusing to reuse or delete an existing kind cluster'; exit 1
          fi
          bin/kmx local up --step cluster
          echo 'KMX_ORKA_RUNTIME_CREATED=1' >> "$GITHUB_ENV"
          python3 "$GITHUB_WORKSPACE/scripts/ci/registry-mirrors.py" nodes --cluster "$KIND_CLUSTER"
          bin/kmx local up --step ollama
          bin/kmx local up --step model
          # Fail closed on the premise. If a later edit made any of the three
          # steps above pull in the legacy runtime, every Orka claim below
          # would still pass while proving something else entirely.
          if kubectl --context kind-kmx-orka get namespace kagent >/dev/null 2>&1; then
            echo "the Orka shard created the legacy runtime's namespace; it is not proving an Orka-only path"
            exit 1
          fi
      - name: Orka — install the pinned release and its keyless Provider
        run: |
          set -euo pipefail
          bin/kmx orka install 2>&1 | tee orka-install.out
          # The digest pin is the point of the command, so require that it
          # was actually verified rather than that the command exited 0.
          grep -q 'Installer verified:' orka-install.out
          kubectl --context kind-kmx-orka -n orka-system rollout status deploy/orka-api-controller --timeout=300s
          # A Provider that is not Ready resolves no model, and an Agent
          # bound to it would fail later with a much less legible message.
          for _ in $(seq 1 60); do
            ready=$(kubectl --context kind-kmx-orka -n orka-system get providers.core.orka.ai local \
              -o jsonpath='{.status.ready}' 2>/dev/null || true)
            [ "$ready" = true ] && break
            sleep 5
          done
          test "${ready:-}" = true || {
            echo "Provider local never became Ready; a model call would be refused"
            exit 1
          }
      # `kmx orka install` provisions the Task result account. Prove the
      # installed grant is Task-get only; do not hand-create its resources.
      - name: Orka — verify the installed Task result account
        run: |
          set -euo pipefail
          kubectl --context kind-kmx-orka -n orka-system get serviceaccount orka-result-reader >/dev/null
          role=$(kubectl --context kind-kmx-orka -n orka-system get role orka-result-reader -o json)
          python3 - "$role" <<'PY'
          import json, sys
          rules = json.loads(sys.argv[1])["rules"]
          assert rules == [{"apiGroups": ["core.orka.ai"], "resources": ["tasks"], "verbs": ["get"]}], "unexpected result-reader grant"
          PY
          binding=$(kubectl --context kind-kmx-orka -n orka-system get rolebinding orka-result-reader -o json)
          python3 - "$binding" <<'PY'
          import json, sys
          binding = json.loads(sys.argv[1])
          assert binding["roleRef"]["kind"] == "Role" and binding["roleRef"]["name"] == "orka-result-reader", "unexpected bound role"
          assert binding["subjects"] == [{"kind": "ServiceAccount", "name": "orka-result-reader", "namespace": "orka-system"}], "unexpected result-reader subject"
          PY
      # Exercise the same installer called by console Prepare, not a raw
      # manifest substitute. The opt-in test pins a dedicated kind context.
      - name: Native Orka Tool — install through the shared Prepare method
        run: |
          set -euo pipefail
          KMX_LIVE_KIND_CONTEXT=kind-kmx-orka go test ./internal/kmx/app \
            -run '^TestLiveInstallQuickstartK8sTool$' -count=1
          sum=$(sha256sum scripts/orka-k8s-tool.py | cut -d' ' -f1)
          # Admitted by ORKA's own CRD, not merely by the API server: a Tool
          # this cluster's Orka would reject is not a native Orka Tool.
          url=$(kubectl --context kind-kmx-orka -n orka-system get tools.core.orka.ai k8s-get-resources \
            -o jsonpath='{.spec.http.url}')
          test "$url" = https://1.1.1.1/resources
          kubectl --context kind-kmx-orka -n orka-system get rolebinding kmx-k8s-tool-policy-reader -o json | python3 -c '
          import json, sys
          b = json.load(sys.stdin)
          assert b["subjects"] == [{"kind":"ServiceAccount","name":"orka-api-ai-worker","namespace":"orka-system"}], "wrong policy reader subject"
          assert b["roleRef"]["name"] == "kmx-k8s-tool-policy-reader", "wrong policy reader role"
          '
          # The chart worker needs this named policy for gateway approval
          # binding; it must not acquire general policy reads.
          test "$(kubectl --context kind-kmx-orka -n orka-system auth can-i get outboundaccesspolicies.core.orka.ai/kmx-k8s-tool-gateway --as=system:serviceaccount:orka-system:orka-api-ai-worker)" = yes
          test "$(kubectl --context kind-kmx-orka -n orka-system auth can-i get outboundaccesspolicies.core.orka.ai/unrelated --as=system:serviceaccount:orka-system:orka-api-ai-worker)" = no
          policy=$(kubectl --context kind-kmx-orka -n orka-system get tools.core.orka.ai k8s-get-resources \
            -o jsonpath='{.spec.http.outboundAccessPolicyRef.name}')
          test "$policy" = kmx-k8s-tool-gateway
          # The running pod is the committed code, stated rather than assumed.
          annotated=$(kubectl --context kind-kmx-orka -n orka-system get deploy kmx-k8s-tool \
            -o jsonpath='{.spec.template.metadata.annotations.kaimahi\.dev/tool-code}')
          test "$annotated" = "$sum"
          # Both resources must be ready for the generations read in this
          # loop; stale conditions from an earlier spec do not establish it.
          for resource_and_condition in \
            "outboundaccesspolicies.core.orka.ai/kmx-k8s-tool-gateway Accepted" \
            "tools.core.orka.ai/k8s-get-resources Available"; do
            read -r resource condition <<<"$resource_and_condition"
            current=
            for _ in $(seq 1 60); do
              object=$(kubectl --context kind-kmx-orka -n orka-system get "$resource" -o json)
              current=$(python3 -c '
          import json, sys
          obj, condition = json.load(sys.stdin), sys.argv[1]
          generation = obj["metadata"]["generation"]
          print(any(c.get("type") == condition and c.get("status") == "True"
                    and c.get("observedGeneration") == generation
                    for c in obj.get("status", {}).get("conditions", [])))
          ' "$condition" <<<"$object")
              [ "$current" = True ] && break
              sleep 2
            done
            test "$current" = True || { echo "$resource never reached $condition for the current generation"; exit 1; }
          done
      # The public URL is only a logical authority. A missing policy must
      # make the current Tool generation unavailable; it must never turn
      # example.com into the physical fallback destination.
      - name: Native Orka Tool — missing gateway fails closed
        run: |
          set -euo pipefail
          kubectl --context kind-kmx-orka -n orka-system patch tools.core.orka.ai k8s-get-resources \
            --type=merge -p '{"spec":{"http":{"outboundAccessPolicyRef":{"name":"missing-gateway"}}}}'
          generation=$(kubectl --context kind-kmx-orka -n orka-system get tools.core.orka.ai k8s-get-resources \
            -o jsonpath='{.metadata.generation}')
          failed=
          for _ in $(seq 1 60); do
            object=$(kubectl --context kind-kmx-orka -n orka-system get tools.core.orka.ai k8s-get-resources -o json)
            failed=$(python3 -c '
          import json, sys
          obj, generation = json.load(sys.stdin), int(sys.argv[1])
          unavailable = any(c.get("type") == "Available" and c.get("status") == "False"
                            and c.get("observedGeneration") == generation
                            for c in obj.get("status", {}).get("conditions", []))
          error = obj.get("status", {}).get("error", "")
          print(unavailable and "referenced outbound access policy \"missing-gateway\" not found" in error)
          ' "$generation" <<<"$object")
            [ "$failed" = True ] && break
            sleep 2
          done
          test "$failed" = True || { echo 'Tool did not reject the missing gateway'; exit 1; }
          # Restore the only policy kmx manages and require the restored
          # generation before any Task is allowed to use the Tool.
          kubectl --context kind-kmx-orka -n orka-system patch tools.core.orka.ai k8s-get-resources \
            --type=merge -p '{"spec":{"http":{"outboundAccessPolicyRef":{"name":"kmx-k8s-tool-gateway"}}}}'
          generation=$(kubectl --context kind-kmx-orka -n orka-system get tools.core.orka.ai k8s-get-resources \
            -o jsonpath='{.metadata.generation}')
          restored=
          for _ in $(seq 1 60); do
            status=$(kubectl --context kind-kmx-orka -n orka-system get tools.core.orka.ai k8s-get-resources \
              -o jsonpath='{.status.conditions[?(@.type=="Available")].status}:{.status.conditions[?(@.type=="Available")].observedGeneration}')
            [ "$status" = "True:$generation" ] && { restored=1; break; }
            sleep 2
          done
          test -n "$restored" || { echo 'Tool did not regain current-generation Available'; exit 1; }
      - name: Orka — fail closed on legacy runtime state
        run: |
          set -euo pipefail
          if kubectl --context kind-kmx-orka get namespace kagent >/dev/null 2>&1; then
            echo "the Orka shard created the legacy runtime's namespace"
            exit 1
          fi
          # The installed chart is the only release, with the harness-v2
          # controller and kmx ownership settings (not the old wrapper).
          releases=$(helm --kube-context kind-kmx-orka list --all-namespaces --short)
          test "$releases" = orka || { echo "unexpected Helm releases: $releases"; exit 1; }
          helm --kube-context kind-kmx-orka -n orka-system get values orka -o json | python3 -c '
          import json, sys
          v = json.load(sys.stdin)
          assert v["controller"]["mode"] == "harness-v2", v
          assert v["fullnameOverride"] == "orka-api", v
          assert v["labels"]["kmx.kaimahi.dev/installed"] == "true", v
          '
          if kubectl --context kind-kmx-orka -n orka-system get deploy orka-agent-harness-wrapper --ignore-not-found -o name | grep -q .; then
            echo "the harness wrapper was installed instead of harness-v2"; exit 1
          fi
      # The allowed half. An unguessable name is created first, so a listing
      # that contains it can only have come from a live read through the
      # tool — not from a fixture, a cache or a plausible reply.
      - name: Native Orka Tool — allowed ConfigMap listing is a live read
        run: |
          set -euo pipefail
          marker="probe-$(head -c 8 /dev/urandom | od -An -tx1 | tr -d ' \n')"
          kubectl --context kind-kmx-orka -n orka-system create configmap "$marker" --from-literal=probe=1 >/dev/null
          # --address pins IPv4: kubectl's default `localhost` can bind the
          # v6 side only while curl talks to 127.0.0.1. The forward's own
          # output is kept and printed on failure, and the trap stops it
          # outliving this step — a background kubectl is not reaped when a
          # step ends, and the port is reused below.
          kubectl --context kind-kmx-orka -n orka-system port-forward --address 127.0.0.1 \
            svc/kmx-k8s-tool 18080:8080 >tool-forward.log 2>&1 &
          pf=$!
          trap 'kill "$pf" 2>/dev/null || true' EXIT
          ready=
          for _ in $(seq 1 150); do
            if curl -fsS --max-time 2 -o /dev/null http://127.0.0.1:18080/healthz 2>/dev/null; then ready=1; break; fi
            sleep 0.2
          done
          test -n "$ready" || { echo 'the tool never answered on 127.0.0.1:18080'; exit 1; }
          curl -fsS --max-time 30 -X POST http://127.0.0.1:18080/resources \
            -H 'Content-Type: application/json' \
            -d '{"resource":"configmaps","namespace":"orka-system"}' -o tool-allowed.out
          python3 - "$marker" <<'EOF'
          import json, sys
          marker = sys.argv[1]
          body = json.load(open("tool-allowed.out"))
          names = [i["name"] for i in body["items"]]
          assert body["resource"] == "configmaps", "unexpected Tool resource"
          assert marker in names, "live ConfigMap marker absent from the read-only listing"
          # A projection, never contents: a ConfigMap's data must not come
          # back through a tool a model can call.
          assert all(set(i) <= {"name", "namespace", "phase", "readyReplicas",
                                "replicas", "succeeded", "failed"} for i in body["items"]), "Tool returned unexpected fields"
          print("live ConfigMap marker present in read-only listing")
          EOF
      # The denied half, asserted at BOTH boundaries, because either one
      # alone is a single point of silent failure: the server's own
      # validation (which a widened allowlist would remove) and the
      # cluster's RBAC (which a widened ClusterRole would remove).
      - name: Native Orka Tool — Secrets and pod mutation are refused
        run: |
          set -euo pipefail
          kubectl --context kind-kmx-orka -n orka-system port-forward --address 127.0.0.1 \
            svc/kmx-k8s-tool 18080:8080 >tool-forward-deny.log 2>&1 &
          pf=$!
          trap 'kill "$pf" 2>/dev/null || true' EXIT
          ready=
          for _ in $(seq 1 150); do
            if curl -fsS --max-time 2 -o /dev/null http://127.0.0.1:18080/healthz 2>/dev/null; then ready=1; break; fi
            sleep 0.2
          done
          test -n "$ready" || { echo 'the tool never answered'; exit 1; }
          for body in '{"resource":"secrets"}' '{"resource":"secrets","namespace":"orka-system"}' '{"resource":"pods","verb":"delete"}'; do
            code=$(curl -s -o deny.out -w '%{http_code}' --max-time 30 -X POST \
              http://127.0.0.1:18080/resources -H 'Content-Type: application/json' -d "$body")
            test "$code" = 400 || { echo "tool refused with unexpected HTTP $code"; exit 1; }
            grep -q 'Invalid resource request' deny.out
          done
          # And the authority the tool holds even if its validation were
          # bypassed. `! cmd` is exempt from errexit, so can-i's answer is
          # compared explicitly — each check aborts the step on a wrong one.
          sa=system:serviceaccount:orka-system:kmx-k8s-reader
          for denied in "get secrets" "list secrets" "create pods" "delete pods" \
                        "update pods" "patch pods" "patch configmaps"; do
            # Split the verb/resource pair for kubectl auth can-i.
            # shellcheck disable=SC2086
            got=$(kubectl --context kind-kmx-orka auth can-i $denied -n orka-system --as="$sa" || true)
            test "$got" = no || { echo "the tool account may $denied"; exit 1; }
          done
          # The positive control: a denial list that refused everything would
          # pass the seven checks above and prove nothing. Scoped to
          # orka-system to match the namespace the live request above hits.
          kubectl --context kind-kmx-orka auth can-i list configmaps -n orka-system --as="$sa"
      # The fixture requires a per-run Deployment from the Tool's response,
      # not a name in its source or prompt. Zero replicas create no image pulls.
      # Task evidence comes from Orka's authorized event API, never worker logs
      # or an answer printed to CI. This tests routing, not model selection.
      - name: Native Orka Tool — Task invokes read-only health Tool
        run: |
          set -euo pipefail
          health_marker="health-$(head -c 8 /dev/urandom | od -An -tx1 | tr -d ' \n')"
          kubectl --context kind-kmx-orka -n orka-system create deployment "$health_marker" \
            --image=registry.k8s.io/pause:3.10 --replicas=0 >/dev/null
          kubectl --context kind-kmx-orka -n orka-system create configmap orka-tool-model \
            --from-file=server.py=scripts/ci/orka-tool-model.py
          kubectl --context kind-kmx-orka apply -f scripts/ci/orka-tool-model.yaml
          kubectl --context kind-kmx-orka -n orka-system set env deployment/orka-tool-model \
            ORKA_HEALTH_DEPLOYMENT_MARKER="$health_marker" >/dev/null
          kubectl --context kind-kmx-orka -n orka-system rollout status deploy/orka-tool-model --timeout=180s
          python3 scripts/ci/orka-runtime-fixture.py kind-kmx-orka tool
          bin/kmx --context kind-kmx-orka run --agent orka-tool-proof --namespace orka-system \
            --prompt 'Check deployment health in orka-system using k8s-get-resources.' \
            >/dev/null 2>/dev/null || { echo 'health Task failed (answer and worker output suppressed)'; exit 1; }
          task=$(kubectl --context kind-kmx-orka -n orka-system get tasks.core.orka.ai -o json | \
            python3 -c 'import json,sys; items=json.load(sys.stdin)["items"]; matches=[i for i in items if i.get("spec",{}).get("agentRef",{}).get("name")=="orka-tool-proof"]; assert len(matches)==1, "expected one Task for health proof"; print(matches[0]["metadata"]["name"])')
          test "$(kubectl --context kind-kmx-orka -n orka-system get task "$task" -o jsonpath='{.status.phase}')" = Succeeded || { echo 'health Task did not succeed'; exit 1; }
          KMX_LIVE_KIND_CONTEXT=kind-kmx-orka KMX_LIVE_TASK_NAME="$task" \
            go test ./internal/kmx/app -run '^TestLiveInspectQuickstartToolEvents$' -count=1 -v
      # Provider → Agent → Task, and a REAL answer. The prompt is
      # deterministic and the comparison is exact: "a non-empty reply" would
      # also pass on an error string.
      - name: Orka — Agent and Task return an exact local-model answer
        run: |
          set -euo pipefail
          # Reuse the installer's Secret; never invent a Provider key here.
          python3 scripts/ci/orka-runtime-fixture.py kind-kmx-orka hello
          bin/kmx --context kind-kmx-orka run --agent orka-hello --namespace orka-system \
            --prompt 'Reply with exactly this text: Orka says hello.' > orka-answer.out
          test "$(cat orka-answer.out)" = 'Orka says hello.'
          # The Task really ran and really succeeded, read from the cluster
          # rather than from the command's own stdout.
          phase=$(kubectl --context kind-kmx-orka -n orka-system get tasks.core.orka.ai -o json | \
            python3 -c 'import json,sys; items=json.load(sys.stdin)["items"]; matches=[i for i in items if i.get("spec",{}).get("agentRef",{}).get("name")=="orka-hello"]; assert len(matches)==1, matches; print(matches[0].get("status",{}).get("phase",""))')
          test "$phase" = Succeeded
      - name: Native promotion — create only the dedicated destination cluster
        run: |
          set -euo pipefail
          clusters=$(kind get clusters)
          if grep -qx kmx-orka-promote <<<"$clusters"; then
            echo 'refusing to reuse or delete an existing promotion cluster'; exit 1
          fi
          # Failed creation is ambiguous: only acknowledged success owns cleanup.
          KIND_CLUSTER=kmx-orka-promote KUBE_CTX=kind-kmx-orka-promote bin/kmx local up --step cluster
          echo 'KMX_ORKA_PROMOTION_CREATED=1' >> "$GITHUB_ENV"
          python3 "$GITHUB_WORKSPACE/scripts/ci/registry-mirrors.py" nodes --cluster kmx-orka-promote
      - name: Native promotion — install pinned Orka without inference
        run: |
          set -euo pipefail
          umask 077
          bin/kmx --context kind-kmx-orka-promote orka install --provider - >"$RUNNER_TEMP/kmx-orka-promote-install.out" 2>&1
          grep -q 'Installer verified:' "$RUNNER_TEMP/kmx-orka-promote-install.out"
      - name: Native suite — qualify evaluation, exact transfer and CLI lift
        run: |
          echo 'KMX_NATIVE_STARTED=1' >> "$GITHUB_ENV"
          python3 scripts/ci/suite-native.py kind-kmx-orka kind-kmx-orka-promote "$RUNNER_TEMP/kmx-suite-native"
      - name: Pinned update preconditions — fresh RV and pair reservation
        run: |
          KMX_RELEASE_UPDATE_LIVE=1 KMX_LIVE_KIND_CONTEXT=kind-kmx-orka go test ./internal/kmx/app \
            -run '^TestRelease(UpdatePinnedRV|StatePinnedCAS)$' -count=1 -v
      - name: Upload only passing native metadata
        uses: actions/upload-artifact@v4
        with:
          name: native-suite-qualification
          path: |
            ${{ runner.temp }}/kmx-suite-native/artifacts/passing.json
            ${{ runner.temp }}/kmx-suite-native/artifacts/qualification.json
          if-no-files-found: error
      - name: Native qualification phase timings (no payloads)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-suite-timings
          path: ${{ runner.temp }}/native-suite-timings.json
          if-no-files-found: error
      - name: Native qualification failure — payload-free status
        if: failure()
        run: |
          if [ "${KMX_NATIVE_STARTED:-}" = 1 ]; then
            echo 'native qualification failed; private payloads and diagnostics withheld'
          fi
      - name: Cluster state on failure
        if: failure()
        run: |
          # Wide legacy diagnostics must never inspect the native scenario.
          if [ "${KMX_ORKA_RUNTIME_CREATED:-}" = 1 ] && [ "${KMX_NATIVE_STARTED:-}" != 1 ]; then
            kubectl --context kind-kmx-orka get pods -A || true
            kubectl --context kind-kmx-orka -n orka-system get providers.core.orka.ai,agents.core.orka.ai,tasks.core.orka.ai,tools.core.orka.ai -o wide || true
            for deployment in orka-api-controller kmx-k8s-tool; do
              kubectl --context kind-kmx-orka -n orka-system logs "deploy/$deployment" --tail=100 2>/dev/null | python3 -c '
          import sys
          lines = sys.stdin.read().lower().splitlines()
          print(sys.argv[1], "log summary: lines=", len(lines), "errors=", sum("error" in line for line in lines))
          ' "$deployment" || true
            done
            kubectl --context kind-kmx-orka -n orka-system get tasks.core.orka.ai -o json | python3 -c 'import json,sys; print("Task phases:", [t.get("status",{}).get("phase","unknown") for t in json.load(sys.stdin).get("items",[])])' || true
            kubectl --context kind-kmx-orka -n orka-system get tools.core.orka.ai k8s-get-resources -o json | python3 -c 'import json,sys; print("Tool conditions:",[(c.get("type"),c.get("status")) for c in json.load(sys.stdin).get("status",{}).get("conditions",[])])' || true
          fi
      - name: Report registry pull endpoint evidence
        if: always()
        run: python3 "$GITHUB_WORKSPACE/scripts/ci/registry-mirrors.py" report
      - name: down
        if: always()
        run: |
          if [ "${KMX_ORKA_PROMOTION_CREATED:-}" = 1 ]; then kind delete cluster --name kmx-orka-promote || true; fi
          if [ "${KMX_ORKA_RUNTIME_CREATED:-}" = 1 ]; then kind delete cluster --name kmx-orka; fi
