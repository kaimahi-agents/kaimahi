name: copilot-plugin

on:
  pull_request:
    paths:
      - 'plugins/copilot/**'
      - 'plugins/copilot-wsl/**'
      - 'cmd/kmx/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/copilot-plugin.yml'
      - '.github/workflows/release.yml'
  push:
    branches: [main]
    paths:
      - 'plugins/copilot/**'
      - 'plugins/copilot-wsl/**'
      - 'cmd/kmx/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/copilot-plugin.yml'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Agent canvas, authoring and text fallback contracts
        run: node --test plugins/copilot/com.github.copilot/extensions/agent-view/view.test.mjs plugins/copilot/com.github.copilot/extensions/agent-view/authoring.test.mjs plugins/copilot/com.github.copilot/extensions/agent-view/actions.test.mjs plugins/copilot/com.github.copilot/extensions/agent-view/open.test.mjs
      - name: Package contracts and real MCP loop (Windows packaging only)
        run: python -m unittest discover -s plugins/copilot -p 'test_*.py' -v
