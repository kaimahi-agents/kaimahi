name: copilot-plugin

on:
  pull_request:
    paths:
      - 'plugins/copilot/**'
      - 'cmd/kmx/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/copilot-plugin.yml'
      - '.github/workflows/release.yml'
      - 'TRY-IT.md'
  push:
    branches: [main]
    paths:
      - 'plugins/copilot/**'
      - 'cmd/kmx/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/copilot-plugin.yml'
      - '.github/workflows/release.yml'
      - 'TRY-IT.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read-only canvas and text fallback contracts
        run: node --test plugins/copilot/com.github.copilot/extensions/agent-view/view.test.mjs
      - name: Package contracts and real MCP loop (Windows packaging only)
        run: python -m unittest discover -s plugins/copilot -p 'test_*.py' -v

  try-it-install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned Copilot CLI without dependency scripts
        run: npm install --prefix "$RUNNER_TEMP/copilot" --ignore-scripts --no-save @github/copilot@1.0.102
      - name: Build native engine
        run: go build -o "$RUNNER_TEMP/kmx" ./cmd/kmx
      - name: Script dry run and isolated install, uninstall, reinstall
        env:
          KMX_TRY_IT_BINARY: ${{ runner.temp }}/kmx
          KMX_TRY_IT_COPILOT: ${{ runner.temp }}/copilot/node_modules/.bin/copilot
        run: python3 -m unittest discover -s plugins/copilot -p test_try_it.py -v
