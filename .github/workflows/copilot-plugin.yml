name: copilot-plugin

on:
  pull_request:
    paths:
      - 'plugins/copilot/**'
      - '.github/workflows/copilot-plugin.yml'
  push:
    branches: [main]
    paths:
      - 'plugins/copilot/**'
      - '.github/workflows/copilot-plugin.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-fixtures:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Package and launch native fake kmx; no Copilot/model/runtime
        run: python -m unittest discover -s plugins/copilot -p 'test_*.py' -v
