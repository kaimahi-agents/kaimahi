name: copilot-plugin

on:
  pull_request:
    paths:
      - 'plugins/copilot/**'
      - 'plugins/copilot-wsl/**'
      - 'plugins/tests/copilot/**'
      - 'cmd/kmx/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/copilot-plugin.yml'
      - '.github/workflows/release.yml'
  push:
    branches: [main]
    paths:
      - 'plugins/copilot/**'
      - 'plugins/copilot-wsl/**'
      - 'plugins/tests/copilot/**'
      - 'cmd/kmx/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/copilot-plugin.yml'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build Go runtime fixture
        if: runner.os != 'Windows'
        shell: bash
        run: go build -o "$RUNNER_TEMP/kmx-host-fixture" ./cmd/kmx
      - name: Agent canvas, authoring and text fallback contracts
        env:
          KMX_HOST_BRIDGE_TEST_BINARY: ${{ runner.os != 'Windows' && format('{0}/kmx-host-fixture', runner.temp) || '' }}
        run: node --test plugins/tests/copilot/*.test.mjs
      - name: Package contracts and real MCP loop (Windows packaging only)
        run: python -m unittest discover -s plugins/copilot -p 'test_*.py' -v

  macos-install:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # Deliberately qualify the published rc.2, not a locally built engine.
      - name: Install the release darwin binary and check its checksum
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/kaimahi-agents/kaimahi/v0.9.0-rc.2/install.sh | sudo sh -s -- --version=v0.9.0-rc.2 --bin-dir=/usr/local/bin
          kmx version
      - name: Install pinned Copilot CLI
        run: npm install --prefix "$RUNNER_TEMP/copilot" --ignore-scripts --no-save @github/copilot@1.0.102
      - name: Exercise the public install command (transport only before merge)
        env:
          COPILOT_HOME: ${{ runner.temp }}/public-plugin-profile
          COPILOT_CACHE_HOME: ${{ runner.temp }}/public-plugin-cache
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/copilot/node_modules/.bin:$PATH"
          copilot --no-auto-update plugin install kaimahi-agents/kaimahi:plugins/copilot
          copilot --no-auto-update plugin list
          # Main may still have the old identity while a PR tests its renamed copy.
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          manifests = list((pathlib.Path(os.environ["COPILOT_HOME"]) / "installed-plugins").rglob("plugin.json"))
          assert len(manifests) == 1, "expected one isolated public-source install"
          name = json.loads(manifests[0].read_text())["name"]
          assert name in ("kmx-agent-builder", "kmx-agent-builder-path"), name
          subprocess.run(["copilot", "--no-auto-update", "plugin", "uninstall", name], check=True)
          PY
      - name: Check cached assets and offline create, test, edit, rerun
        env:
          KMX_PLAIN_COPILOT: ${{ runner.temp }}/copilot/node_modules/.bin/copilot
          KMX_PLAIN_BINARY: /usr/local/bin/kmx
          # Before merge validate this PR's bytes. Main also validates the public source's contents.
          KMX_PLAIN_SOURCE: ${{ github.event_name == 'push' && 'kaimahi-agents/kaimahi:plugins/copilot' || format('{0}/plugins/copilot', github.workspace) }}
        run: python3 -m unittest discover -s plugins/copilot -p test_plain_install.py -v
      # No Copilot model or credentials: an authenticated app walk is a separate gate.
