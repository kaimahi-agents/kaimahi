name: copilot-plugin

on:
  pull_request:
    paths:
      - '.github/plugin/**'
      - 'plugins/copilot/**'
      - 'plugins/copilot-wsl/**'
      - 'plugins/tests/copilot/**'
      - 'cmd/kmx/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/copilot-plugin.yml'
      - '.github/workflows/release.yml'
  push:
    branches: [main]
    paths:
      - '.github/plugin/**'
      - 'plugins/copilot/**'
      - 'plugins/copilot-wsl/**'
      - 'plugins/tests/copilot/**'
      - 'cmd/kmx/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/copilot-plugin.yml'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  native-package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build Go runtime fixture
        if: runner.os != 'Windows'
        shell: bash
        run: go build -o "$RUNNER_TEMP/kmx-host-fixture" ./cmd/kmx
      - name: Agent canvas, authoring and text fallback contracts
        env:
          KMX_HOST_BRIDGE_TEST_BINARY: ${{ runner.os != 'Windows' && format('{0}/kmx-host-fixture', runner.temp) || '' }}
        run: node --test plugins/tests/copilot/*.test.mjs
      - name: Package contracts and real MCP loop (Windows packaging only)
        run: python -m unittest discover -s plugins/copilot -p 'test_*.py' -v

  macos-install:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # Pair both source-install checks with the binary named by the catalog.
      # Catalog C follows publication of S; this must not enter pre-publish contracts.
      - name: Check published catalog pair and install the darwin binary
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 plugins/copilot/marketplace.py --release
          version=$(python3 -c 'import json; print("v" + json.load(open(".github/plugin/marketplace.json"))["plugins"][0]["version"])')
          curl -fsSL "https://raw.githubusercontent.com/kaimahi-agents/kaimahi/$version/install.sh" | sudo sh -s -- --version="$version" --bin-dir=/usr/local/bin
          kmx version
      - name: Install pinned Copilot CLI
        run: npm install --prefix "$RUNNER_TEMP/copilot" --ignore-scripts --no-save @github/copilot@1.0.102
      - name: Check frozen marketplace installs, migration, refresh and update
        env:
          KMX_MARKETPLACE_COPILOT: ${{ runner.temp }}/copilot/node_modules/.bin/copilot
          # Use a remote Git catalog, not a local directory's live-loading semantics.
          # CLI 1.0.102 accepts branch/tag refs, not raw catalog commit SHAs.
          # Verify the fetched catalog head separately; entries still pin release S.
          KMX_MARKETPLACE_SOURCE: ${{ format('{0}#{1}', github.event.pull_request.head.repo.full_name || github.repository, github.head_ref || github.ref_name) }}
          KMX_MARKETPLACE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 -m unittest discover -s plugins/copilot -p test_marketplace.py -v
      - name: Check cached assets and offline create, test, edit, rerun
        env:
          KMX_PLAIN_COPILOT: ${{ runner.temp }}/copilot/node_modules/.bin/copilot
          KMX_PLAIN_BINARY: /usr/local/bin/kmx
          # Before merge validate this PR's bytes. Main also validates the public source's contents.
          KMX_PLAIN_SOURCE: ${{ github.event_name == 'push' && 'kaimahi-agents/kaimahi:plugins/copilot' || format('{0}/plugins/copilot', github.workspace) }}
        run: python3 -m unittest discover -s plugins/copilot -p test_plain_install.py -v
      # No Copilot model or credentials: an authenticated app walk is a separate gate.
