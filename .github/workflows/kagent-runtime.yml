name: Full kagent lift qualification

on:
  workflow_call:
    outputs:
      qualified_sha:
        description: Exact commit qualified by live A2A and full suite lift
        value: ${{ jobs.qualify.outputs.qualified_sha }}

permissions:
  contents: read

jobs:
  qualify:
    permissions:
      contents: read
    outputs:
      qualified_sha: ${{ steps.provenance.outputs.sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 2
          ref: ${{ github.sha }}
      - name: Qualify the exact caller commit
        id: provenance
        env:
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$EVENT_SHA" =~ ^[0-9a-f]{40}$ ]]
          actual=$(git rev-parse HEAD)
          expected=$(git rev-parse "$EVENT_SHA^{commit}")
          test "$actual" = "$expected"
          printf 'sha=%s\n' "$actual" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: Build kmx
        run: mkdir -p bin && go build -o bin/kmx ./cmd/kmx
      - name: Externally install pinned runtime and qualify native A2A plus suite lift
        run: bash scripts/ci/kagent-lift.sh
      - name: Payload-free qualification evidence (not a deployment receipt)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kagent-lift-qualification
          path: ${{ runner.temp }}/kmx-kagent-lift/qualification.json
          if-no-files-found: ignore
