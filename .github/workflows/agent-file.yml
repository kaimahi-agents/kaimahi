name: Agent-file parser

on:
  pull_request:
    paths:
      - 'internal/kmx/agentfile/**'
      - 'internal/kmx/mcp/**'
      - 'internal/kmx/runtime/**'
      - 'internal/kmx/secretshapes/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/agent-file.yml'
  push:
    branches: [main]
    paths:
      - 'internal/kmx/agentfile/**'
      - 'internal/kmx/mcp/**'
      - 'internal/kmx/runtime/**'
      - 'internal/kmx/secretshapes/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/agent-file.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  parser:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: Parser and rooted authoring (not Windows CLI qualification)
        run: go test -race ./internal/kmx/agentfile ./internal/kmx/mcp -count=1
