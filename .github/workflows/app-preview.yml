name: app-preview

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  macos-preview:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26.10"
      - name: Native macOS preview tests
        run: go test ./internal/kmx/app -count=1 -v -run 'TestDirectPreview(Copilot|LocalRoutesNeverAccessCopilot)'
