name: ci

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e-eval-loop:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Classify the change (docs-only short-circuit, fail closed)
        id: changes
        uses: ./.github/actions/classify-change
      - uses: actions/setup-go@v5
        if: steps.changes.outputs.docs_only != 'true'
        with:
          go-version-file: go.mod
      - name: Build kmx
        if: steps.changes.outputs.docs_only != 'true'
        run: go build -o bin/kmx ./cmd/kmx
      - name: Live AIKit evaluation and zero-call replay
        if: steps.changes.outputs.docs_only != 'true'
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/eval-loop-evidence
        run: bash scripts/ci/live-eval-loop.sh
      - name: Upload payload-free receipt and verify report
        if: always() && steps.changes.outputs.docs_only != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: eval-loop-evidence
          path: ${{ runner.temp }}/eval-loop-evidence/*.json
          if-no-files-found: warn
          retention-days: 7
      - name: Documentation-only summary
        id: docs-only-summary
        if: steps.changes.outputs.docs_only == 'true'
        run: echo "every changed file is documentation; no live evaluation run"
