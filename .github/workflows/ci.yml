name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 3 * * *'
  # The clone-free job below runs on main ONLY, because its premise is a
  # published revision. That made it the one job nobody could reproduce
  # before merging — it failed on four consecutive merges before anyone
  # looked. On demand it runs from any branch, so a fix can be proven
  # before it lands rather than after.
  workflow_dispatch:

# Least privilege for every job: checkout needs repository read, nothing
# needs more.
permissions:
  contents: read

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Classify script changes (fail closed)
        id: mutation_changes
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/classify-change
      - name: Required files present
        run: |
          test -f LICENSE
          test -f README.md
      - name: Brand assets validate
        run: python3 scripts/check-brand-assets.py
      - name: All YAML parses
        run: |
          python3 - <<'EOF'
          import pathlib, sys, yaml
          failed = False
          for p in pathlib.Path(".").rglob("*.y*ml"):
              if ".git" in p.parts:
                  continue
              try:
                  list(yaml.safe_load_all(p.read_text()))
              except Exception as e:
                  print(f"{p}: {e}")
                  failed = True
          sys.exit(1 if failed else 0)
          EOF
      # The scanner and manifest scaffolder share the credential shapes in
      # internal/kmx/secretshapes/shapes.json. Prove the scanner still catches
      # each shape before trusting its verdict on the tree.
      - name: Credential-shape scanner still catches every shape
        run: python3 scripts/check-secret-shapes.py --selftest
      - name: No credential shapes in tree
        run: python3 scripts/check-secret-shapes.py
      # docs/repository-map.md is the front door for "is this thing real?",
      # and it is the one document in this tree whose claims are almost all
      # mechanical: file counts, membership lists, who calls what. It was
      # accurate the day it was written; file moves can invalidate its rows.
      #
      # What is checked is counts, paths and callers. What is NOT is the
      # classification: whether a manifest is product or demonstration is a
      # judgement, and a checker enforcing one would freeze an opinion the
      # tree is allowed to change. What it does enforce is that a
      # classification EXISTS — a new file that no list names fails here
      # without this being told which answer is right.
      #
      # Keyless: `git ls-files` and the tree itself.
      - name: Repository-map checker self-test
        run: python3 scripts/check-repository-map.py --selftest
      - name: The repository map still describes this tree
        run: python3 scripts/check-repository-map.py
      # Explicit alternate-runtime v0.10.2 create is a closed support boundary, not a
      # restoration of the old runtime surface. The checker permits only its
      # reviewed production/test/docs files and vocabulary; installer assets,
      # moving pins, chat/list/status/lift/evaluate/console/quickstart, old up
      # steps and the AKS payload remain refused everywhere. Its self-test and
      # mutation suite prove the path/rule sets cannot quietly widen.
      - name: Alternate-runtime boundary scanner still catches every class
        run: python3 scripts/check-legacy-runtime.py --selftest
      - name: Alternate-runtime support stays inside exact-version create
        run: python3 scripts/check-legacy-runtime.py
      # And the checkers themselves: each one is copied, broken on purpose
      # in a named way, and required to notice. A self-test built from
      # fixture pairs proves a checker gets today's answer right; it does
      # not prove the checker would notice tomorrow's wrong answer, and
      # every gap this closes was found by editing a checker until it was
      # worthless and watching its own self-test stay green.
      - name: Registry mirror helper self-tests
        run: python3 scripts/test_registry_mirrors.py
      - name: Live eval gate and failure diagnostics self-tests
        run: |
          python3 scripts/test_eval_loop.py
          python3 scripts/test_eval_runner.py
      - name: Mutation runner and CI routing self-tests
        run: python3 scripts/test_check_mutations.py
      - name: Every checker notices being broken
        if: github.event_name != 'pull_request' || steps.mutation_changes.outputs.scripts_changed != 'false'
        run: python3 scripts/check-mutations.py
      # This repo is public and documents a managed-cluster path.
      # A subscription/tenant GUID, an AKS FQDN, or a real ACR login server
      # must never land in the tree — every Azure identifier is supplied by
      # the operator at run time. The same script is what the operator runs
      # locally while writing up an AKS run.
      # The scanner is itself a gate that can fail open (a regex that
      # matches nothing passes everything): prove it still catches each
      # identifier class before trusting its verdict on the tree.
      - name: Azure identifier scanner still catches every class
        run: bash scripts/check-no-azure-ids-test.sh
      - name: No Azure identifiers in tree
        run: bash scripts/check-no-azure-ids.sh
      # The docs are organised by capability. The checker covers every
      # link target that is not an absolute URL: inline links, HTML
      # `<img src>` and `<a href>` (including tags
      # whose attributes span several lines), and
      # reference links through their definitions. Each must resolve to a
      # file in the tree, and each #anchor on a Markdown target must match
      # a heading there. Fenced blocks and code spans are not links.
      - name: Doc-link checker self-test
        run: python3 scripts/check-doc-links.py --selftest
      - name: Doc links resolve
        run: python3 scripts/check-doc-links.py
      - name: README front door is ordered around working capability
        run: python3 scripts/check-readme-front-door.py
      - name: README front-door checker self-test
        run: python3 scripts/check-readme-front-door-test.py
      # The release job's notes come from CHANGELOG.md and it REFUSES
      # to publish a version with no section there. That refusal is the only
      # thing making "every release has notes" true, so the extractor is
      # tested here rather than discovered on a tag.
      - name: Release-notes extractor self-test
        run: python3 scripts/release-notes.py --selftest
      - name: Homebrew formula renderer self-test
        run: python3 scripts/homebrew-formula.py --selftest
      - name: The unreleased section exists, and the release job stays keyless
        run: |
          python3 - <<'EOF'
          import os, re, subprocess, sys, tempfile, yaml
          changelog = open("CHANGELOG.md").read()
          if not re.search(r"^## Unreleased$", changelog, re.M):
              print("CHANGELOG.md needs an '## Unreleased' section to write the next release into")
              sys.exit(1)
          wf = yaml.safe_load(open(".github/workflows/release.yml"))
          # This repository is public and fork-exposed, and CI carries
          # no repository secret. A release does not change that — the only
          # credential it may use is the token GitHub mints for the run.
          # `github.token` and `secrets.GITHUB_TOKEN` are that same token;
          # anything else named under secrets. would be a new one.
          used = set(re.findall(r"secrets\.([A-Za-z_][A-Za-z0-9_]*)", open(".github/workflows/release.yml").read()))
          if used - {"GITHUB_TOKEN"}:
              print(f"the release job uses repository secrets: {sorted(used - {'GITHUB_TOKEN'})}")
              sys.exit(1)
          # Least privilege, stated: the workflow reads, and only the job
          # that publishes may write contents.
          if wf.get("permissions") != {"contents": "read"}:
              print(f"release.yml must default to contents: read, got {wf.get('permissions')}")
              sys.exit(1)
          release_text = open(".github/workflows/release.yml").read()
          if "goreleaser release --clean --skip=publish,validate" not in release_text:
              print("release.yml must build the release through GoReleaser without publishing")
              sys.exit(1)
          if "dist/homebrew/Formula/kmx.rb" not in release_text:
              print("release.yml must attach the rendered Homebrew formula as a release asset")
              sys.exit(1)
          # Stable production URLs let Homebrew infer the version and strict
          # audit rejects restating it. Prerelease formulas retain an explicit
          # version because their URL inference is not reliable.
          if release_text.count('''perl -i -ne 'print unless /^  version "/' dist/homebrew/Formula/kmx.rb''') != 1:
              print("release.yml must strip the redundant `version` line from the one checked GoReleaser build")
              sys.exit(1)
          if 'grep -qx "  version \\"${VERSION#v}\\"" dist/homebrew/Formula/kmx.rb' not in release_text:
              print("release.yml must retain and verify GoReleaser's explicit version for prerelease formulas")
              sys.exit(1)
          if "gh release create" not in release_text:
              print("release.yml must publish the already-checked artifact set in one draft-to-public release operation")
              sys.exit(1)
          dry_run_artifact_path = "path: $" + "{{ runner.temp }}/release-assets/"
          if "Stage the checked release artifacts" not in release_text or dry_run_artifact_path not in release_text:
              print("release.yml must give dry runs the same flat checked assets used for publication")
              sys.exit(1)
          if 'scripts/homebrew-formula.py "$VERSION" dist/checksums.txt' not in release_text:
              print("release.yml must reject an incomplete or unexpected checksum manifest before publication")
              sys.exit(1)
          if re.search(r"goreleaser release(?! --clean --skip=publish,validate)", release_text):
              print("release.yml must not rebuild artifacts during publication")
              sys.exit(1)
          goreleaser_text = open(".goreleaser.yaml").read()
          goreleaser_cfg = yaml.safe_load(goreleaser_text)
          brew = goreleaser_cfg.get("brews", [{}])[0]
          if brew.get("skip_upload") is not True:
              print(".goreleaser.yaml must set brews[0].skip_upload: true — this job never pushes to the tap")
              sys.exit(1)
          if brew.get("repository", {}).get("name") != "homebrew-tap":
              print(".goreleaser.yaml must render the formula for kaimahi-agents/homebrew-tap")
              sys.exit(1)
          if "token" in brew.get("repository", {}):
              print(".goreleaser.yaml's brews.repository must not name a token — that would be a credential to push with")
              sys.exit(1)
          if 'if [ "$EVENT_NAME" = push ] && [ "$REF_TYPE" = tag ]; then' not in release_text:
              print("release.yml must publish only for tag pushes; manual dispatch is always a dry run")
              sys.exit(1)
          decide = next(step["run"] for step in wf["jobs"]["release"]["steps"] if step.get("id") == "what")
          cases = [
              ({"EVENT_NAME": "push", "REF_TYPE": "tag", "REF_NAME": "v0.3.0", "INPUT_VERSION": "", "SHA": "a" * 40},
               {"version": "v0.3.0", "dry_run": "false", "prerelease": "false", "synthetic": "false"}),
              ({"EVENT_NAME": "push", "REF_TYPE": "tag", "REF_NAME": "v0.3.0-rc.1", "INPUT_VERSION": "", "SHA": "d" * 40},
               {"version": "v0.3.0-rc.1", "dry_run": "false", "prerelease": "true", "synthetic": "false"}),
              ({"EVENT_NAME": "workflow_dispatch", "REF_TYPE": "branch", "REF_NAME": "main", "INPUT_VERSION": "v0.3.0", "SHA": "b" * 40},
               {"version": "v0.3.0", "dry_run": "true", "prerelease": "false", "synthetic": "false"}),
              ({"EVENT_NAME": "workflow_dispatch", "REF_TYPE": "tag", "REF_NAME": "v0.3.0", "INPUT_VERSION": "", "SHA": "c" * 40},
               {"version": "v0.0.0-dryrun.cccccccccccc", "dry_run": "true", "prerelease": "true", "synthetic": "true"}),
          ]
          for env_add, expected in cases:
              with tempfile.NamedTemporaryFile() as output:
                  env = dict(os.environ, GITHUB_OUTPUT=output.name, **env_add)
                  run = subprocess.run(["bash", "-c", decide], env=env, text=True, capture_output=True)
                  if run.returncode:
                      print(run.stdout, run.stderr, sep="\n", file=sys.stderr)
                      sys.exit(run.returncode)
                  output.seek(0)
                  got = dict(line.decode().rstrip().split("=", 1) for line in output if b"=" in line)
              if any(got.get(key) != value for key, value in expected.items()):
                  print(f"release decision mismatch for {env_add}: got {got}, want {expected}")
                  sys.exit(1)
          for name, job in wf["jobs"].items():
              extra = set(job.get("permissions", {})) - {"contents"}
              if extra:
                  print(f"release job {name} asks for more than contents: {sorted(extra)}")
                  sys.exit(1)
          print("release workflow: dry-run matrix, no repository secrets, contents-only permissions, changelog ready")
          EOF
      # The context guard is pure policy — every branch of it decides
      # whether to touch somebody's cluster — but the e2e job below can only
      # ever exercise the one branch it runs on (local kind). These tests
      # build their own kubeconfig, so all of them are covered keyless in
      # seconds: local kind proceeds, an unwritten kind context proceeds
      # (that is `kmx up` on an empty machine), and a typo, a kind-NAMED
      # remote, a remote with no confirmation, and a confirmation naming a
      # different context are all refused.
      - name: Context guard fails closed
        run: bash scripts/kube-guard-test.sh
      # install.sh is the front door and it is not exercised by anything
      # cheap: the e2e job runs it once, at the far end of a cluster
      # bring-up. These tests serve the download from a directory and
      # install a kmx that records its own argv, so what the two paths
      # actually invoke is asserted in seconds — including that
      # --quickstart never runs `kmx version`, whose pinned component lines
      # would otherwise land in the front-door transcript.
      - name: install.sh runs the right command on each path
        run: bash scripts/install-sh-test.sh
      # The native Orka Tool fixture checks actual HTTP requests, live
      # deployment identity and refusal responses without a cluster.
      - name: Native Orka Tool HTTP fixture health responses
        run: python3 scripts/test_model_fixtures.py
      - name: AX preview activity projection tests
        run: PYTHONDONTWRITEBYTECODE=1 PYTHONWARNINGS=error python3 -m unittest discover -s ax-harness -p 'test_activity.py' -v
      # The native Orka HTTP Tool's own allow/deny pair, proved keyless and
      # clusterless: the e2e-orka-runtime shard proves the CLUSTER refuses
      # (RBAC); this proves the SERVER refuses before a request is ever
      # made, over every pull request rather than only when that shard
      # runs. Mocked HTTP only — no live Kubernetes API is reached.
      - name: Orka k8s-tool self-test (read-only allowlist, secrets and mutation refused)
        run: python3 scripts/test_orka_k8s_tool.py -v
      # Quickstart proves the default native Orka journey. Legacy bring-up
      # or retired commands would invalidate that runtime-isolation claim.
      # Keep the guarded shard list explicit; the namespace tripwire must
      # be asserted rather than inferred from the commands it runs.
      - name: Converted shards install no legacy runtime, and each says so
        run: |
          python3 - <<'EOF'
          import re, sys, yaml
          # Keep this list explicit so rewriting a shard cannot silently
          # remove it from the guard.
          converted = ["e2e-quickstart"]
          # A bare `kmx up` installs Orka. Explicit alternate-runtime create
          # support does not let these converted Orka shards install it or aim
          # any non-create command at it. API-group text is no longer globally
          # forbidden because supported create must render it; these controls
          # instead name the unsupported operations.
          forbidden = [
              (re.compile(r"\bkmx(?:\s+--(?:context|container-engine)(?:=|\s+)\S+)*\s+up\s+--step(?:=|\s+)(?:kagent|agent|tools-agent)\b"),
               "an explicit legacy step installs the legacy runtime or its demo agents"),
              (re.compile(r"\bkmx(?:\s+--(?:context|container-engine)(?:=|\s+)\S+)*\s+govern\b"),
               "the legacy governance command repoints a legacy Agent"),
              (re.compile(r"\bkmx(?:\s+--(?:context|container-engine)(?:=|\s+)\S+)*\s+use\b"),
               "the retired preset switch selects the legacy runtime"),
              (re.compile(r"\bkmx(?:\s+--(?:context|container-engine)(?:=|\s+)\S+)*\s+agent\s+edit\b"),
               "the retired source editor edits a legacy Agent"),
              (re.compile(r"\bkmx(?:\s+--(?:context|container-engine)(?:=|\s+)\S+)*\s+(?:agent\s+(?:chat|list|show|lift|status|evaluate)|console|quickstart(?:-wizard)?|status)\b[^\n]*--runtime(?:=|\s+)kagent\b"),
               "a non-create command aimed at the alternate runtime"),
              (re.compile(r"--payload(?:=|\s+)kagent\b"), "the retired alternate-runtime AKS payload"),
              (re.compile(r"\bKAGENT_VERSION\b|kagent-(?:values|tool-server|tools|shim|cli)\b|\bkagent(?:cli|compat)\b"),
               "a retired alternate-runtime installer, CLI, shim, preset, or moving version pin"),
          ]
          # Negative controls, checked before the shards are: a guard whose
          # patterns have drifted either refuses supported commands or
          # notices nothing, and both failures look like a passing step.
          must_match = [
              "kmx up --step kagent",
              "kmx --context kind-x up --step=tools-agent",
              "kmx --context kind-x govern hello-world",
              "kmx --container-engine=podman use kagent",
              "kmx --context=kind-x agent edit hello-world",
              "kmx agent chat --runtime kagent hello-world",
              "kmx agent list --runtime=kagent",
              "kmx aks up --payload kagent",
              "KAGENT_VERSION=0.10.2",
              "helm install -f kagent-values.yaml kagent",
          ]
          must_not_match = [
              "kmx agent chat --namespace orka-system hello-world-agent",
              "kmx agent chat --runtime orka hello-world-agent",
              "kmx agent list --namespace orka-system",
              "kmx agent create orka-hello --namespace orka-system",
              "kmx agent create kagent-hello --runtime kagent --namespace agents",
              "kmx up",
              "kmx agent run demo --namespace orka-system",
              "kubectl get ns kagent",
              "kubectl -n agents get agents.kagent.dev",
              "kubectl get agents.core.orka.ai -n orka-system",
          ]
          control = []
          for sample in must_match:
              if not any(p.search(sample) for p, _ in forbidden):
                  control.append(f"no pattern catches the legacy sample {sample!r}")
          for sample in must_not_match:
              for p, _ in forbidden:
                  if p.search(sample):
                      control.append(f"{p.pattern!r} refuses the supported command {sample!r}")
          if control:
              print("the legacy-runtime patterns are wrong:", *control, sep="\n  ")
              sys.exit(1)
          wf = yaml.safe_load(open(".github/workflows/ci.yml"))
          problems = []
          for job in converted:
              if job not in wf["jobs"]:
                  problems.append(f"{job}: no such job — this list names the shards that were converted")
                  continue
              body = "\n".join(str(s.get("run", "")) for s in wf["jobs"][job]["steps"])
              for pattern, why in forbidden:
                  if pattern.search(body):
                      problems.append(f"{job}: {pattern.pattern!r} — {why}")
              # `ns` and `namespace` are the same request; the tripwire is
              # required, the spelling the shard happens to use is not.
              if not re.search(r"get (?:ns|namespace) kagent\b", body):
                  problems.append(f"{job}: no step asserts the legacy runtime's namespace is absent")
          if problems:
              print("converted shards must prove a path the legacy runtime is absent from:", *problems, sep="\n  ")
              sys.exit(1)
          print(f"{', '.join(converted)}: no legacy bring-up, no legacy commands, namespace tripwire present")
          EOF
      # `kmx-clone-free` is the only proof that the published binary works
      # with no checkout anywhere, so it must set up the way a reader is told
      # to: a BARE `kmx up`, which is the Orka runtime and which provisions
      # the `orka-result-reader` account its Task proof reads a result
      # through. An `orka install` step or a hand-made ServiceAccount beside
      # it would make that proof a statement about the job's own fixture
      # instead of about the command.
      #
      # Reject explicit legacy install steps and retired commands: the
      # clone-free journey must remain an Orka-only setup.
      - name: The clone-free journey sets up with a bare `kmx up`, and runs no retired command
        run: |
          python3 - <<'EOF'
          import re, sys, yaml
          wf = yaml.safe_load(open(".github/workflows/ci.yml"))
          # Commands, not prose: a step whose COMMENT names the retired govern command is
          # explaining itself, and reading it as an invocation would make the
          # ordering rule below fire on a comment.
          def commands(step):
              return "\n".join(line for line in str(step.get("run", "")).splitlines()
                               if not line.lstrip().startswith("#"))
          bodies = [commands(s) for s in wf["jobs"]["kmx-clone-free"]["steps"]]
          joined = "\n".join(bodies)
          problems = []
          if not any(re.search(r"^\s*kmx up\s*$", b, re.M) for b in bodies):
              problems.append("no bare `kmx up`: the job must set the runtime up the way the docs say to")
          # A separate Orka install would bypass the bare `kmx up` proof.
          if re.search(r"kmx (?:--\S+[ =]\S+ )*orka install\b", joined):
              problems.append("a standalone `orka install`: the bare `kmx up` already installs Orka")
          if "create serviceaccount orka-result-reader" in joined:
              problems.append("the result account is made by hand: `kmx up --step orka` provisions it")
          if "--result-service-account orka-result-reader" not in joined:
              problems.append("no Orka Task proof reading its result through orka-result-reader")
          # Retired operations, forbidden by name. Supported create/API
          # vocabulary is not globally banned; this Orka-only job may still
          # not install the alternate runtime, select it for another command,
          # or use its retired AKS payload.
          for pattern, why in [
                  (r"kmx(?:\s+--\S+(?:=|\s+)\S+)*\s+up\s+--step(?:=|\s+)(?:kagent|agent|tools-agent)",
                   "an explicit legacy install step"),
                  (r"\bkmx(?:\s+--(?:context|container-engine)(?:=|\s+)\S+)*\s+govern\b",
                   "the retired governance command"),
                  (r"\bkmx(?:\s+--(?:context|container-engine)(?:=|\s+)\S+)*\s+use\b",
                   "the retired preset switch"),
                   (r"\bkmx(?:\s+--(?:context|container-engine)(?:=|\s+)\S+)*\s+agent\s+edit\b",
                    "the retired source editor"),
                   (r"\bkmx(?:\s+--(?:context|container-engine)(?:=|\s+)\S+)*\s+(?:agent\s+(?:chat|list|show|lift|status|evaluate)|console|quickstart(?:-wizard)?|status)\b[^\n]*--runtime(?:=|\s+)kagent\b",
                    "a non-create command aimed at the alternate runtime"),
                   (r"--payload(?:=|\s+)kagent\b", "the retired alternate-runtime AKS payload"),
                   (r"\bKAGENT_VERSION\b|kagent-(?:values|tool-server|tools|shim|cli)\b|\bkagent(?:cli|compat)\b",
                    "a retired alternate-runtime installer, CLI, shim, preset, or moving version pin")]:
              if re.search(pattern, joined):
                  problems.append(f"{why}: {pattern!r}")
          if problems:
              print("kmx-clone-free no longer proves the supported setup:", *problems, sep="\n  ")
              sys.exit(1)
          print("kmx-clone-free: bare `kmx up` for Orka, its result account unmade by hand, "
                "no retired command anywhere in the job")
          EOF
      # Every cluster job short-circuits docs-only changes at STEP level (the
      # e2e shards must run and report — `e2e-hello-world` aggregates them
      # and is a required check). A step appended without the guard would run
      # against no cluster on the next docs-only change, so refuse it here,
      # on the PR that adds it. Only the checkout, the classify step and the
      # docs-only summary steps are exempt; every other step must skip when
      # docs_only is 'true'.
      #
      # The required check aggregates the shards, so a shard that nothing needs would run,
      # fail, and still leave `e2e-hello-world` green. The aggregator must
      # name every shard, must run with always() (a skipped required check
      # never reports and blocks every merge), and must own no cluster steps
      # of its own.
      - name: Every cluster step carries the docs-only guard, the required check covers every shard, and the clone-free job has no checkout
        run: |
          python3 - <<'EOF'
          import sys, yaml
          wf = yaml.safe_load(open(".github/workflows/ci.yml"))
          jobs = wf["jobs"]
          required = "e2e-hello-world"
          shards = sorted(j for j in jobs if j.startswith("e2e-") and j != required)
          if not shards:
              print("no e2e shard jobs found — the proof has to run somewhere")
              sys.exit(1)
          exempt = lambda s: (s.get("id") in ("changes", "docs-only-summary")
                              or str(s.get("if", "")).strip() == "steps.changes.outputs.docs_only == 'true'"
                              or str(s.get("uses", "")).startswith("actions/checkout"))
          # Exact match, not substring: `always() || …` or `!= 'false'`
          # would mention the output and still run without a cluster.
          guards = {"steps.changes.outputs.docs_only != 'true'",
                    "failure() && steps.changes.outputs.docs_only != 'true'",
                    "always() && steps.changes.outputs.docs_only != 'true'"}
          total = 0
          for job in shards + ["kmx-clone-free"]:
              steps = jobs[job]["steps"]
              total += len(steps)
              bad = [s.get("name") or s.get("uses") for s in steps
                     if not exempt(s) and str(s.get("if", "")).strip() not in guards]
              if bad:
                  print(f"{job} steps missing the docs-only guard:", *bad, sep="\n  ")
                  sys.exit(1)
          agg = jobs[required]
          if sorted(agg.get("needs", [])) != shards:
              print(f"{required} must need exactly {shards}, needs {agg.get('needs')}")
              sys.exit(1)
          if str(agg.get("if", "")).strip() != "always() && github.event_name != 'schedule'":
              print(f"{required} must always report except on the hygiene-only schedule")
              sys.exit(1)
          for step in agg["steps"]:
              body = str(step.get("run", ""))
              if "kubectl" in body or "make " in body:
                  print(f"{required} must own no cluster steps: {step.get('name')}")
                  sys.exit(1)
          # The clone-free job proves the path with NO checkout. A checkout
          # step added to it would make kmx auto-detect a source and the job
          # would silently stop proving anything.
          if any(str(s.get("uses", "")).startswith("actions/checkout")
                 for s in jobs["kmx-clone-free"]["steps"]):
              print("kmx-clone-free must not check the repository out — that is the premise of the job")
              sys.exit(1)
          print(f"{total} cluster steps across {len(shards)} shards + kmx-clone-free: all guarded")
          print(f"{required} reports for: {', '.join(shards)}; kmx-clone-free has no checkout")
          EOF
      # kmx's own module. It lives in the REQUIRED hygiene job rather
      # than a job of its own, because the guard port, the scaffolder's
      # refusals and the checksum verification are the parts of kmx that
      # decide whether someone's cluster gets written to or a credential
      # gets committed — they gate merges or they are decoration. Keyless
      # and clusterless: every one of these tests runs on fixtures.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Comment-history tripwire self-test
        run: python3 scripts/check-comment-history.py --selftest
      - name: No effort IDs or lane references in source comments
        run: python3 scripts/check-comment-history.py
      - name: kmx — gofmt clean
        run: test -z "$(gofmt -l cmd internal embed.go embed_test.go)"
      - name: kmx — vet
        run: go vet ./...
      # staticcheck, pinned to an exact release tag.
      #
      # The version matters and is easy to get wrong. staticcheck 2025.1.1
      # is built with go1.23.8, and this repository's module
      # requires go1.26 — so that release cannot compile the tree at all. It
      # does not report zero findings; it refuses to load the packages, and
      # a CI step that swallowed that would be a lint job proving nothing.
      # 2026.2.1 builds go1.26 and is what runs here.
      #
      # Pinned to `@2026.2.1` — staticcheck's own release tag, which is what
      # its documentation tells you to install and what `--version` prints —
      # rather than the module version `v0.8.1` or a floating `@latest`. An
      # exact pin means what CI enforces changes only when somebody edits
      # this file.
      #
      # Keyless: `go install` from the public module proxy, no token.
      # The ST1005 decision, and why it is a decision, lives in
      # staticcheck.conf at the repository root.
      - name: kmx — staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2026.2.1
          "$(go env GOPATH)/bin/staticcheck" ./...
      - name: kmx — build
        run: go build ./...
      - name: kmx — test (guard port, scaffolder, toolchain digests)
        id: kmx_tests
        run: |
          # Run once: -json changes the test flags, so a preceding plain
          # `go test ./...` would not warm this run's cache. Preserve its exit
          # status, including build failures outside the required packages.
          go_status=0
          go test ./... -json > kmx-test.json 2>&1 || go_status=$?
          # `ok  <package>` can mean every test SKIPPED. Each required
          # package must pass at least one test and have no failures.
          # Replay package/build Output events and non-JSON lines: build
          # errors may arrive outside test Output events and must be visible.
          # Individual test names are printed below only on failure.
          python3 - "$go_status" <<'EOF'
          import collections, json, sys

          # Why each of these is required, rather than just being a package
          # that happens to exist:
          REQUIRED = {
              # The reason this job is required at all.
              "internal/kmx/guard": "the context guard's port decisions",
              "internal/kmx/scaffold": "the scaffolder's key-shape refusals",
              "internal/kmx/orkaschema": "pinned Orka schemas and unknown-field refusals",
              # kmx downloads kind and kubectl. A binary it fetches
              # runs with the operator's kubeconfig, so the digest checks
              # are not decoration.
              "internal/kmx/toolchain": "the fetched toolchain's digests",
              "internal/kmx/portforward": "owned loopback forwards for native results and tools",
              # The managed path's rules about what may be deleted on
              # somebody else's subscription. Live infrastructure teardown
              # is exercised infrequently, so these tests catch regressions
              # without requiring a managed cluster.
              "internal/kmx/lift": "what may be deleted on a managed cluster",
              # Go's flag parsing stops at the first positional: native
              # agent commands must preserve argument order and refusals.
              "cmd/kmx": "native command argument order and retired-command refusals",
              "internal/kmx/app": "native operations and their refusals",
              # One list of credential shapes, read by the scaffolder, the
              # model configuration and the tree scan.
              "internal/kmx/secretshapes": "the shared credential-shape list",
          }

          passed = collections.Counter()
          failed_tests = collections.Counter()
          failed_names = []
          result = {}
          with open("kmx-test.json") as output:
              for line in output:
                  try:
                      event = json.loads(line)
                  except ValueError:
                      sys.stdout.write(line)  # build stderr can be plain text
                      continue
                  package, action, test = event.get("Package", ""), event.get("Action"), event.get("Test")
                  if not test:
                      sys.stdout.write(event.get("Output", ""))  # includes build-output events
                  if test and action == "pass":
                      passed[package] += 1
                  if test and action == "fail":
                      failed_tests[package] += 1
                      failed_names.append(f"{package}: {test}")
                  if not test and action in ("pass", "fail", "skip"):
                      result[package] = action

          problems = []
          for suffix, why in REQUIRED.items():
              named = [p for p in result if p.endswith("/" + suffix)]
              if not named:
                  problems.append(f"{suffix}: no such package ran — {why} was not exercised")
                  continue
              for package in named:
                  if result[package] != "pass":
                      problems.append(f"{package}: reported {result[package]}")
                  elif failed_tests[package]:
                      problems.append(f"{package}: {failed_tests[package]} test(s) failed")
                  elif not passed[package]:
                      problems.append(f"{package}: reported ok without a single test passing — "
                                      f"{why} was not exercised")
          for line in problems:
              print(line)
          if failed_names:
              print("failing tests:")
              for name in failed_names:
                  print("  " + name)
          if int(sys.argv[1]) != 0:
              print(f"go test exited with status {sys.argv[1]}")
          if problems or failed_names or int(sys.argv[1]) != 0:
              sys.exit(1)
          print(f"every required package ran its own tests: {sum(passed.values())} passed "
                f"across {len(REQUIRED)} required packages")
          EOF
          # Generated Orka YAML must parse without letting instructions
          # escape their scalar. This named test uses the Go YAML parser
          # with no Python dependency or skip path. Keep asserting it ran:
          # a renamed test must not turn go test -run into a green no-op.
          go test ./internal/kmx/scaffold/ -v \
            -run TestGeneratedManifestParsesAndKeepsInstructionsInsideTheScalar 2>&1 | tee parse.out
          grep -q -- '--- PASS: TestGeneratedManifestParsesAndKeepsInstructionsInsideTheScalar' parse.out
      - name: kmx — failed test output
        if: failure() && steps.kmx_tests.outcome == 'failure' && hashFiles('kmx-test.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: kmx-test-json
          path: kmx-test.json
      - name: agent-create wizard — terminal lifecycle
        run: |
          set -euo pipefail
          # This is not another model-only assertion: it opens a real Linux
          # PTY, checks Ctrl-C/Escape/SIGTERM cancellation and native offline
          # completion, and proves the terminal was restored.
          go test ./internal/kmx/app \
            -run '^TestCreateWizardPTY' \
            -count=1 -v | tee wizard-pty.out
          grep -q -- '--- PASS: TestCreateWizardPTYCancellationRestoresTerminal' wizard-pty.out
          grep -q -- '--- PASS: TestCreateWizardPTYNativeCompletionRestoresTerminal' wizard-pty.out
          grep -q -- '--- PASS: TestCreateWizardPTYSIGTERMRestoresTerminal' wizard-pty.out
          ! grep -q -- '--- SKIP:' wizard-pty.out
      - name: The retired runtime is refused by name, not resolved to Orka
        run: |
          set -euo pipefail
          go test ./internal/kmx/app ./cmd/kmx -run 'Retired' -count=1 -v | tee retirement.out
          grep -q -- '--- PASS: TestChatRefusesTheRetiredKagentRuntimeWithoutReachingACluster' retirement.out
          grep -q -- '--- PASS: TestLegacyRuntimeCommandsAreRetired' retirement.out
          ! grep -q -- '--- SKIP:' retirement.out

  # Linux uses its XDG user-config location while macOS uses
  # ~/Library/Application Support. Cross-compiling a Darwin binary does not
  # execute that distinction, so this native job protects the KMX_HOME
  # isolation contract without duplicating the cluster or full Go
  # suites already run by the Linux jobs.
  # Nightly proves hygiene only; cluster and platform jobs retain their
  # existing PR, push and manual-dispatch behavior.
  state-paths-macos:
    if: github.event_name != 'schedule'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: Native macOS state paths honor KMX_HOME
        run: |
          set -euo pipefail
          go test ./internal/kmx/config \
            -run '^TestStateDirUsesPortableOverrideAndNativeDefault$' \
            -count=1 -v | tee state-dir.out
          grep -q -- '--- PASS: TestStateDirUsesPortableOverrideAndNativeDefault' state-dir.out

          go test ./internal/kmx/app \
            -run '^(TestAgentLocationsPersistSeparateClustersPrivately|TestAgentTUIEnvironmentClassificationAndKubeconfigIsolation|TestAgentTUIProviderAndHostOverrideInferenceInfo|TestConsoleInferenceSourcePersistenceAndValidation|TestLiftPreferencesPersistScopedSelections|TestFoundryConfigRejectsTokenRedirectDestinations|TestBundleLiftSelectionPathUsesKMXHome|TestEvaluateUsesRememberedTarget)$' \
            -count=1 -v | tee app-state.out
          for test in \
            TestAgentLocationsPersistSeparateClustersPrivately \
            TestAgentTUIEnvironmentClassificationAndKubeconfigIsolation \
            TestAgentTUIProviderAndHostOverrideInferenceInfo \
            TestConsoleInferenceSourcePersistenceAndValidation \
            TestLiftPreferencesPersistScopedSelections \
            TestFoundryConfigRejectsTokenRedirectDestinations \
            TestBundleLiftSelectionPathUsesKMXHome \
            TestEvaluateUsesRememberedTarget; do
            grep -q -- "--- PASS: $test" app-state.out
          done
          ! grep -q -- '--- SKIP:' state-dir.out app-state.out

  # Five native shards prove quickstart, exact-version Kagent create,
  # Orka runtime and Helm integration, and clusterless live evaluation.
  # The required aggregator covers every shard; execution steps have docs guards.
  e2e-quickstart:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Classify the change (docs-only short-circuit, fail closed)
        id: changes
        uses: ./.github/actions/classify-change
      - uses: actions/setup-go@v5
        if: steps.changes.outputs.docs_only != 'true'
        with:
          go-version-file: go.mod
      # A pull request has no release to install from, so one is made here:
      # the binary this branch builds, plus the checksums.txt the install
      # script verifies it against. The mechanism under test is the real one
      # — only the origin is local.
      # Compound quickstart cannot pause between cluster creation and workload
      # pulls; wrap Docker's node creation, leaving kind and image pins intact.
      - name: Configure CI registry mirrors
        if: steps.changes.outputs.docs_only != 'true'
        run: python3 "$GITHUB_WORKSPACE/scripts/ci/registry-mirrors.py" setup --wrap
      - name: Build the release this branch would publish
        if: steps.changes.outputs.docs_only != 'true'
        run: |
          mkdir -p /tmp/release
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o /tmp/release/kmx-linux-amd64 ./cmd/kmx
          ( cd /tmp/release && sha256sum kmx-linux-amd64 > checksums.txt )
      # The premise, MADE TRUE rather than assumed. A GitHub runner ships
      # kubectl and Go in /usr/bin and Helm in /usr/local/bin, so no amount of
      # PATH arrangement produces the machine kmx is built for — /usr/bin is
      # also where docker and coreutils live. They are moved aside for the
      # length of this job and put back afterwards, which is the only way the
      # "kmx fetches them" claim is actually under test rather than asserted.
      - name: Make this runner the machine kmx is built for
        if: steps.changes.outputs.docs_only != 'true'
        run: |
          set -euo pipefail
          for t in kubectl helm kind go; do
            while p=$(command -v "$t" 2>/dev/null); do
              echo "hiding $p"
              sudo mv "$p" "$p.w31-hidden"
            done
          done
          for t in kubectl helm kind go; do
            if command -v "$t" >/dev/null 2>&1; then
              echo "premise broken: $t is still on PATH ($(command -v "$t"))"; exit 1
            fi
          done
          command -v docker >/dev/null || { echo "no container engine"; exit 1; }
          echo "this machine now has a container engine and nothing else kmx needs"
      - name: One command — install kmx and answer a question
        id: quickstart
        if: steps.changes.outputs.docs_only != 'true'
        env:
          KMX_DOWNLOAD_BASE: file:///tmp/release
          KIND_CLUSTER: kmx-quickstart
        run: |
          set -euo pipefail
          start=$(date +%s)
          sh install.sh --quickstart 2>&1 | tee quickstart.out
          elapsed=$(( $(date +%s) - start ))
          echo "seconds=$elapsed" >> "$GITHUB_OUTPUT"
          echo "time from one command to an answer: ${elapsed}s"
      - name: The agent actually answered, and nothing is governed yet
        if: steps.changes.outputs.docs_only != 'true'
        run: |
          set -euo pipefail
          grep -q 'COMPLETE  An agent answered' quickstart.out
          # The ungoverned state must be stated, not left to be inferred
          # from an empty ledger.
          grep -q 'This command does not enable governance' quickstart.out
          # The tools were fetched by kmx, not installed by the job. Orka's
          # pinned harness-v2 chart needs Helm for the first answer.
          for t in kind kubectl helm; do
            grep -q "fetching $t v" quickstart.out
          done
          # Nothing on this path installs, reads or waits on the legacy runtime.
          if grep -qi 'kagent' quickstart.out; then
            echo "the supported first-answer path still names the legacy runtime:"
            grep -i kagent quickstart.out; exit 1
          fi
          # The answer came from an Orka Task against the fixed bundle.
          grep -q 'Install Orka v' quickstart.out
          grep -q 'Deploy the hello-world-agent agent' quickstart.out
      # Running it twice is how an agent in a harness will use it: run,
      # read, decide, run again. The second run must be safe, and must still
      # end with an answer — this time as the JSON a machine reads.
      - name: Safe to run twice, and machine-readable
        if: steps.changes.outputs.docs_only != 'true'
        env:
          KIND_CLUSTER: kmx-quickstart
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          # Show what the run said if anything below fails: a step that hides
          # its own evidence costs a whole CI cycle to diagnose.
          trap 'echo "--- stderr ---"; tail -40 quickstart2.err; echo "--- stdout (first 400 bytes) ---"; head -c 400 quickstart.json' ERR
          kmx quickstart --output json > quickstart.json 2> quickstart2.err
          # stdout must be ONE json document and nothing else — the caller is
          # a parser, not a person.
          head -c 1 quickstart.json | grep -q '{'
          python3 - <<'EOF'
          import json, shlex, sys
          r = json.load(open("quickstart.json"))
          assert r["ok"] is True, r
          assert r["governed"] is False, "the fast path must not claim governance"
          assert r["answer"].strip(), "no answer in the structured output"
          assert r["agent"] == "hello-world-agent", r
          assert "orka-system" in r["manifest"], r["manifest"]
          assert "kagent" not in r["manifest"], r["manifest"]
          assert r["context"] == "kind-kmx-quickstart", r
          assert r["elapsed_seconds"] > 0, r
          commands = [shlex.split(n) for n in r["next"]]
          assert len(commands) == 3, r["next"]
          assert [argv[:3] for argv in commands] == [["kmx", "--context", r["context"]]] * 3, commands
          assert commands[0][3:5] == ["agent", "chat"], commands
          assert commands[1][3:] == ["agent", "create"], commands
          assert commands[2][3:] == ["orka", "status"], commands
          print("second run:", round(r["elapsed_seconds"], 1), "s ·", r["answer"][:80])
          EOF
      # `kmx up` on the same cluster is the RUNTIME and nothing more: it
      # must reconcile Orka without deploying an agent, and without bringing
      # back a legacy runtime that no longer has a caller.
      - name: kmx up is the runtime, and deploys no agent
        if: steps.changes.outputs.docs_only != 'true'
        env:
          KIND_CLUSTER: kmx-quickstart
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          kmx up 2>&1 | tee up-after-quickstart.out
          if grep -qi 'kagent' up-after-quickstart.out; then
            echo "a bare kmx up still names the legacy runtime:"
            grep -i kagent up-after-quickstart.out; exit 1
          fi
          k="$HOME/.config/kmx/path/kubectl"
          # The runtime, read from the cluster rather than from the command's
          # own stdout.
          "$k" --context kind-kmx-quickstart -n orka-system rollout status \
            deploy/orka-api-controller --timeout=120s
          if "$k" --context kind-kmx-quickstart -n orka-system get deploy orka-agent-harness-wrapper --ignore-not-found -o name | grep -q .; then
            echo "the harness wrapper was installed instead of harness-v2"; exit 1
          fi
          "$k" --context kind-kmx-quickstart -n orka-system get \
            providers.core.orka.ai local >/dev/null
          # The grant `up --step orka` owns, and its exact extent.
          "$k" --context kind-kmx-quickstart -n orka-system get \
            serviceaccount orka-result-reader >/dev/null
          rules=$("$k" --context kind-kmx-quickstart -n orka-system get \
            role orka-result-reader -o json)
          python3 - "$rules" <<'EOF'
          import json, sys
          rules = json.loads(sys.argv[1])["rules"]
          assert rules == [{"apiGroups": ["core.orka.ai"], "resources": ["tasks"],
                            "verbs": ["get"]}], rules
          print("result-reader grant is one verb on one resource")
          EOF
          # No legacy runtime was installed by anything on this path.
          if "$k" --context kind-kmx-quickstart get ns kagent >/dev/null 2>&1; then
            echo "namespace exists on the supported path: the legacy runtime is installed"; exit 1
          fi
          # Exactly the kmx-owned Orka chart, in harness-v2 mode.
          h="$HOME/.config/kmx/path/helm"
          test "$("$h" --kube-context kind-kmx-quickstart list --all-namespaces --short)" = orka
          "$h" --kube-context kind-kmx-quickstart -n orka-system get values orka -o json | python3 -c '
          import json, sys
          v = json.load(sys.stdin)
          assert v["controller"]["mode"] == "harness-v2", v
          assert v["fullnameOverride"] == "orka-api", v
          assert v["labels"]["kmx.kaimahi.ai/installed"] == "true", v
          '
      # Rerunning is how an agent in a harness uses this command. The third
      # run must REUSE the exact bundle it already wrote — not recreate it,
      # and not refuse it — and must still produce a fresh Task and answer.
      - name: A third run reuses the exact bundle and asks a fresh Task
        if: steps.changes.outputs.docs_only != 'true'
        env:
          KIND_CLUSTER: kmx-quickstart
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          k="$HOME/.config/kmx/path/kubectl"
          before=$("$k" --context kind-kmx-quickstart -n orka-system get \
            agents.core.orka.ai hello-world-agent -o jsonpath='{.metadata.uid}')
          tasks_before=$("$k" --context kind-kmx-quickstart -n orka-system get \
            tasks.core.orka.ai -o name | wc -l)
          kmx quickstart 2>&1 | tee quickstart3.out
          grep -q 'Reusing matching Provider/hello-world-agent' quickstart3.out
          grep -q 'Reusing matching Agent/hello-world-agent' quickstart3.out
          grep -q 'COMPLETE  An agent answered' quickstart3.out
          after=$("$k" --context kind-kmx-quickstart -n orka-system get \
            agents.core.orka.ai hello-world-agent -o jsonpath='{.metadata.uid}')
          test "$before" = "$after"
          tasks_after=$("$k" --context kind-kmx-quickstart -n orka-system get \
            tasks.core.orka.ai -o name | wc -l)
          test "$tasks_after" -gt "$tasks_before"
          echo "reused the bundle (UID $after) and asked a fresh Task"
      # A live spec that differs from the one quickstart would write is
      # somebody's deliberate change. It must STOP, not overwrite it.
      - name: A drifted bundle is refused, not overwritten
        if: steps.changes.outputs.docs_only != 'true'
        env:
          KIND_CLUSTER: kmx-quickstart
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          k="$HOME/.config/kmx/path/kubectl"
          "$k" --context kind-kmx-quickstart -n orka-system patch \
            agents.core.orka.ai hello-world-agent --type merge \
            -p '{"spec":{"systemPrompt":{"inline":"edited by an operator"}}}'
          if kmx quickstart > drift.out 2>&1; then
            echo "a drifted Agent was overwritten instead of refused"; cat drift.out; exit 1
          fi
          grep -q 'different configuration' drift.out
          prompt=$("$k" --context kind-kmx-quickstart -n orka-system get \
            agents.core.orka.ai hello-world-agent -o jsonpath='{.spec.systemPrompt.inline}')
          test "$prompt" = "edited by an operator"
          echo "the operator's edit survived the refusal"
      - name: The time did not double
        if: steps.changes.outputs.docs_only != 'true'
        env:
          SECONDS_TAKEN: ${{ steps.quickstart.outputs.seconds }}
        run: |
          set -euo pipefail
          # This 315s ceiling guards time from one command to an Orka answer.
          # It has no measured Orka baseline yet; do not infer one from this
          # ceiling. If the check fails, investigate the regression before
          # raising the ceiling. Record a green run on this runner class when
          # calibrating the bound.
          ceiling=315
          echo "time to first answer: ${SECONDS_TAKEN}s (ceiling ${ceiling}s)"
          if [ "$SECONDS_TAKEN" -gt "$ceiling" ]; then
            echo "time from one command to an answer regressed past the ceiling."
            echo "This is the time from one command to a working agent — the front door's whole promise."
            echo "Find what got slower before raising the ceiling."
            exit 1
          fi
      - name: Report registry pull endpoint evidence
        if: always() && steps.changes.outputs.docs_only != 'true'
        run: python3 "$GITHUB_WORKSPACE/scripts/ci/registry-mirrors.py" report
      - name: Tear down, and give the runner its tools back
        if: always() && steps.changes.outputs.docs_only != 'true'
        run: |
          "$HOME/.local/bin/kmx" down || true
          # Put back what was moved aside, so nothing after this job (or any
          # post step) meets a runner missing its own toolchain.
          for hidden in /usr/bin/*.w31-hidden /usr/local/bin/*.w31-hidden /usr/local/go/bin/*.w31-hidden; do
            [ -e "$hidden" ] || continue
            sudo mv "$hidden" "${hidden%.w31-hidden}"
          done
      - name: Docs-only short-circuit
        id: docs-only-summary
        if: steps.changes.outputs.docs_only == 'true'
        run: echo "every changed file is documentation; no cluster booted"
  # Live proof for the deliberately narrow alternate-runtime boundary. The two
  # official charts below are installed by CI as an external precondition;
  # KMX receives a ready exact-v0.10.2 cluster and is tested only for create.
  # Fail stubs plus KMX_TOOLCHAIN=off make any attempted Helm or kagent CLI use
  # by the command fail. No hosted credential is used: the model is a hardened,
  # deterministic in-cluster OpenAI chat-completions fixture.
  e2e-kagent-create:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KIND_CLUSTER: kmx-kagent-create
      KUBE_CTX: kind-kmx-kagent-create
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Classify the change (docs-only short-circuit, fail closed)
        id: changes
        uses: ./.github/actions/classify-change
      - name: Configure CI registry mirrors
        if: steps.changes.outputs.docs_only != 'true'
        run: python3 "$GITHUB_WORKSPACE/scripts/ci/registry-mirrors.py" setup
      - name: Install kind 0.33.0
        if: steps.changes.outputs.docs_only != 'true'
        run: |
          curl -sSfLo kind https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64
          test "$(sha256sum kind | cut -d' ' -f1)" = aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d
          chmod +x kind && sudo mv kind /usr/local/bin/kind
          test "$(kind version -q)" = 0.33.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        if: steps.changes.outputs.docs_only != 'true'
        with:
          go-version-file: go.mod
      - name: Install Helm 3.20.0
        if: steps.changes.outputs.docs_only != 'true'
