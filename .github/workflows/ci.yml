          EOF
      # The context guard is pure policy — every branch of it decides
      # whether to touch somebody's cluster — but the e2e job below can only
      # ever exercise the one branch it runs on (local kind). These tests
      # build their own kubeconfig, so all of them are covered keyless in
      # seconds: local kind proceeds, an unwritten kind context proceeds
      # (that is `kmx cluster up` on an empty machine), and a typo, a kind-NAMED
      # remote, a remote with no confirmation, and a confirmation naming a
      # different context are all refused.
      - name: Context guard fails closed
        run: bash scripts/kube-guard-test.sh
      # install.sh is the front door and it is not exercised by anything
      # cheap: the e2e job runs it once, at the far end of a cluster
      # bring-up. These tests serve the download from a directory and
      # install a kmx that records its own argv, so what the two paths
      # actually invoke is asserted in seconds — including that
      # --quickstart never runs `kmx version`, whose pinned component lines
      # would otherwise land in the front-door transcript.
      - name: install.sh runs the right command on each path
        run: bash scripts/install-sh-test.sh
      # The native Orka Tool fixture checks actual HTTP requests, live
      # deployment identity and refusal responses without a cluster.
      - name: Native Orka Tool HTTP fixture health responses
        run: python3 scripts/test_model_fixtures.py
      - name: Copilot plugin offline package and bundled MCP integration
        run: python3 -m unittest discover -s plugins/copilot -p 'test_*.py' -v
      - name: AX preview activity projection tests
        run: PYTHONDONTWRITEBYTECODE=1 PYTHONWARNINGS=error python3 -m unittest discover -s ax-harness -p 'test_activity.py' -v
      # The native Orka HTTP Tool's own allow/deny pair, proved keyless and
      # clusterless: the nightly/manual Orka worker proves the CLUSTER refuses
      # (RBAC); this proves the SERVER refuses before a request is ever
      # made, over every pull request rather than only when that shard
      # runs. Mocked HTTP only — no live Kubernetes API is reached.
      - name: Orka k8s-tool self-test (read-only allowlist, secrets and mutation refused)
        run: python3 scripts/test_orka_k8s_tool.py -v
      # Quickstart proves the default native Orka journey. Legacy bring-up
      # or retired commands would invalidate that runtime-isolation claim.
      # Keep the guarded shard list explicit; the namespace tripwire must
      # be asserted rather than inferred from the commands it runs.
      - name: Converted shards install no legacy runtime, and each says so
        run: |
          python3 - <<'EOF'
          import re, sys, yaml
          # Keep this list explicit so rewriting a shard cannot silently
          # remove it from the guard.
          converted = ["e2e-quickstart"]
          # A bare `kmx cluster up` installs Orka. Bounded exact-v0.10.2 create and
          # exact-v0.10.3 Go bundle lift/status/evaluate do not let these converted
          # Orka shards install the alternate runtime or use unsupported verbs.
          # API-group text is not globally forbidden; these controls name
          # unsupported operations, not runtime-version qualification.
          forbidden = [
              (re.compile(r"\b(?:bundle\s+(?:lift|status|evaluate|retire|verify)|create\s+--live)\b"), "a removed bundle or live-create operation"),
              (re.compile(r"\bkmx(?:\s+--(?:context|container-engine)(?:=|\s+)\S+)*\s+(?:(?:local|cluster)\s+)?up\s+--step(?:=|\s+)(?:kagent|agent|tools-agent)\b"),
               "an explicit legacy step installs the legacy runtime or its demo agents"),
              (re.compile(r"\bkmx(?:\s+--(?:context|container-engine)(?:=|\s+)\S+)*\s+govern\b"),
               "the legacy governance command repoints a legacy Agent"),
              (re.compile(r"\bkmx(?:\s+--(?:context|container-engine)(?:=|\s+)\S+)*\s+use\b"),
               "the retired preset switch selects the legacy runtime"),
              (re.compile(r"\bkmx(?:\s+--(?:context|container-engine)(?:=|\s+)\S+)*\s+agent\s+edit\b"),
               "the retired source editor edits a legacy Agent"),
              (re.compile(r"\bkmx(?:\s+--(?:context|container-engine)(?:=|\s+)\S+)*\s+(?:chat|run|(?:cluster\s+)?orka\s+(?:list|show)|bundle\s+(?:verify|retire)|bundle\s+evaluate\b(?![^;\n]*--runtime-version(?:=|\s+)v0\.10\.3(?:\s|$))|agent\s+(?:chat|list|show|evaluate)|(?:cluster\s+)?console|(?:cluster\s+)?quickstart(?:-wizard)?|(?:package\s+)?status)\b[^\n]*--runtime(?:=|\s+)kagent\b"),
               "an unsupported command aimed at the alternate runtime"),
              (re.compile(r"--payload(?:=|\s+)kagent\b"), "the retired alternate-runtime AKS payload"),
              (re.compile(r"\bKAGENT_VERSION\b|kagent-(?:values|tool-server|tools|shim|cli)\b|\bkagent(?:cli|compat)\b"),
               "a retired alternate-runtime installer, CLI, shim, preset, or moving version pin"),
          ]
          # Negative controls, checked before the shards are: a guard whose
          # patterns have drifted either refuses supported commands or
          # notices nothing, and both failures look like a passing step.
          must_match = [
              "kmx up --step kagent",
              "kmx --context kind-x up --step=tools-agent",
              "kmx --context kind-x local up --step=tools-agent",
              "kmx --context kind-x govern hello-world",
              "kmx --container-engine=podman use kagent",
              "kmx --context=kind-x agent edit hello-world",
              "kmx agent chat --runtime kagent hello-world",
              "kmx agent list --runtime=kagent",
              "kmx chat --runtime kagent hello-world",
              "kmx cluster orka list --runtime=kagent",
              "kmx bundle evaluate ./bundle --runtime kagent",
              "kmx bundle evaluate ./bundle --runtime kagent --runtime-version v0.10.2",
              "kmx bundle evaluate ./bundle --runtime kagent --runtime-version v0.10.3-other",
              "kmx agent evaluate ./bundle --runtime kagent --runtime-version v0.10.3",
              "kmx chat demo --runtime kagent --runtime-version v0.10.3",
              "kmx bundle retire ./bundle --runtime kagent --runtime-version v0.10.3",
              "kmx cluster aks up --payload kagent",
              "KAGENT_VERSION=0.10.2",
              "helm install -f kagent-values.yaml kagent",
          ]
          must_not_match = [
              "kmx chat --namespace orka-system hello-world-agent",
              "kmx chat --runtime orka hello-world-agent",
              "kmx cluster orka list --namespace orka-system",
              "kmx cluster up",
              "kmx --context kind-x local up",
              "kmx run demo --namespace orka-system",
              "kubectl get ns kagent",
              "kubectl -n agents get agents.kagent.dev",
              "kubectl get agents.core.orka.ai -n orka-system",
          ]
          control = []
          for sample in must_match:
              if not any(p.search(sample) for p, _ in forbidden):
                  control.append(f"no pattern catches the legacy sample {sample!r}")
          for sample in must_not_match:
              for p, _ in forbidden:
                  if p.search(sample):
                      control.append(f"{p.pattern!r} refuses the supported command {sample!r}")
          if control:
              print("the legacy-runtime patterns are wrong:", *control, sep="\n  ")
              sys.exit(1)
          wf = yaml.safe_load(open(".github/workflows/ci.yml"))
          problems = []
          for job in converted:
              if job not in wf["jobs"]:
                  problems.append(f"{job}: no such job — this list names the shards that were converted")
                  continue
              body = "\n".join(str(s.get("run", "")) for s in wf["jobs"][job]["steps"])
              for pattern, why in forbidden:
                  if pattern.search(body):
                      problems.append(f"{job}: {pattern.pattern!r} — {why}")
              # `ns` and `namespace` are the same request; the tripwire is
              # required, the spelling the shard happens to use is not.
              if not re.search(r"get (?:ns|namespace) kagent\b", body):
                  problems.append(f"{job}: no step asserts the legacy runtime's namespace is absent")
          if problems:
              print("converted shards must prove a path the legacy runtime is absent from:", *problems, sep="\n  ")
              sys.exit(1)
          print(f"{', '.join(converted)}: no legacy bring-up, no legacy commands, namespace tripwire present")
          EOF
      # `kmx-clone-free` is the only proof that the published binary works
      # with no checkout anywhere, so it must set up the way a reader is told
      # to: a BARE `kmx cluster up`, which is the Orka runtime and which provisions
      # the `orka-result-reader` account its Task proof reads a result
      # through. An `orka install` step or a hand-made ServiceAccount beside
      # it would make that proof a statement about the job's own fixture
      # instead of about the command.
      #
      # Reject explicit legacy install steps and retired commands: the
      # clone-free journey must remain an Orka-only setup.
      - name: The clone-free journey sets up with a bare `kmx cluster up`, and runs no retired command
        run: |
          python3 - <<'EOF'
          import re, sys, yaml
          wf = yaml.safe_load(open(".github/workflows/ci.yml"))
          # Commands, not prose: a step whose COMMENT names the retired govern command is
          # explaining itself, and reading it as an invocation would make the
          # ordering rule below fire on a comment.
          def commands(step):
              return "\n".join(line for line in str(step.get("run", "")).splitlines()
                               if not line.lstrip().startswith("#"))
          bodies = [commands(s) for s in wf["jobs"]["kmx-clone-free"]["steps"]]
          joined = "\n".join(bodies)
          problems = []
          if not any(re.search(r"^\s*kmx cluster up\s*$", b, re.M) for b in bodies):
              problems.append("no bare `kmx cluster up`: the job must set the runtime up the way the docs say to")
          # A separate Orka install would bypass the bare `kmx cluster up` proof.
          if re.search(r"kmx (?:--\S+[ =]\S+ )*(?:cluster )?orka install\b", joined):
              problems.append("a standalone `orka install`: the bare `kmx cluster up` already installs Orka")
          if "create serviceaccount orka-result-reader" in joined:
              problems.append("the result account is made by hand: `kmx cluster up --step orka` provisions it")
          proof = [r"(?s)^Orka says hello[.]\n*$", 'receipt["candidateCleanup"] == "complete"',
                   "kubectl --context kind-kmx-clone-free -n orka-system get tasks.core.orka.ai",
                   "--ignore-not-found", 'test -z "$remaining"', "--promote"]
          if "kmx package test --workspace" not in joined or any(part not in joined for part in proof):
              problems.append("no exact authored evaluation, complete cleanup, independent Task absence and explicit promotion proof")
          logical = joined.replace("\\\n", " ")
          if not re.search(r"^\s*kmx package deploy [^\n]*--promote(?:\s|$)", logical, re.M):
              problems.append("the source-only evidence promotion flag must belong to Deploy")
          if "type: regex" not in joined or "> workspace/eval/example.yaml" not in joined:
              problems.append("the exact-answer regex must be authored before evaluation")
          if "task result" in joined:
              problems.append("a deleted candidate Task cannot supply a post-evaluation result")
          eval_at, push_at, lift_at = [joined.find("kmx " + verb + " ") for verb in ("package test", "package push", "package deploy")]
          if not (0 <= eval_at < joined.find('receipt["candidateCleanup"]') <
                  joined.find('test -z "$remaining"') < push_at < lift_at):
              problems.append("candidate cleanup/absence must be checked before push and explicit Deploy")
          # Retired operations, forbidden by name. Bounded create/lift/status/evaluate
          # and API vocabulary are not globally banned; this Orka-only job
          # must not install the alternate runtime, use unsupported commands
          # or use its retired AKS payload.
          forbidden = [
                  (r"\b(?:bundle\s+(?:lift|status|evaluate|retire|verify)|create\s+--live)\b", "a removed bundle or live-create operation"),
                  (r"kmx(?:\s+--\S+(?:=|\s+)\S+)*\s+(?:(?:local|cluster)\s+)?up\s+--step(?:=|\s+)(?:kagent|agent|tools-agent)",
                   "an explicit legacy install step"),
                  (r"\bkmx(?:\s+--(?:context|container-engine)(?:=|\s+)\S+)*\s+govern\b",
                   "the retired governance command"),
                  (r"\bkmx(?:\s+--(?:context|container-engine)(?:=|\s+)\S+)*\s+use\b",
                   "the retired preset switch"),
                   (r"\bkmx(?:\s+--(?:context|container-engine)(?:=|\s+)\S+)*\s+agent\s+edit\b",
                    "the retired source editor"),
                   (r"\bkmx(?:\s+--(?:context|container-engine)(?:=|\s+)\S+)*\s+(?:chat|run|(?:cluster\s+)?orka\s+(?:list|show)|bundle\s+(?:verify|retire)|bundle\s+evaluate\b(?![^;\n]*--runtime-version(?:=|\s+)v0\.10\.3(?:\s|$))|agent\s+(?:chat|list|show|evaluate)|(?:cluster\s+)?console|(?:cluster\s+)?quickstart(?:-wizard)?|(?:package\s+)?status)\b[^\n]*--runtime(?:=|\s+)kagent\b",
                    "an unsupported command aimed at the alternate runtime"),
                   (r"--payload(?:=|\s+)kagent\b", "the retired alternate-runtime AKS payload"),
                   (r"\bKAGENT_VERSION\b|kagent-(?:values|tool-server|tools|shim|cli)\b|\bkagent(?:cli|compat)\b",
                    "a retired alternate-runtime installer, CLI, shim, preset, or moving version pin")]
          for pattern, why in forbidden:
              if re.search(pattern, joined):
                  problems.append(f"{why}: {pattern!r}")
          if problems:
              print("kmx-clone-free no longer proves the supported setup:", *problems, sep="\n  ")
              sys.exit(1)
          print("kmx-clone-free: bare `kmx cluster up` for Orka, its result account unmade by hand, "
                "no retired command anywhere in the job")
          EOF
      # Nightly/manual qualification invokes the fixed full Orka worker.
      # CI must not call it; retained shards keep their existing docs guards.
      # Validate the full worker and reject conditional proof gaps.
      #
      # The required check aggregates the shards, so a shard that nothing needs would run,
      # fail, and still leave `e2e-hello-world` green. The aggregator must
      # name every shard, must run with always() (a skipped required check
      # never reports and blocks every merge), and must own no cluster steps
      # of its own.
      - name: Cluster routing, reusable Orka proof and docs-only guards
        run: |
          python3 - <<'EOF'
          import sys, yaml
          wf = yaml.safe_load(open(".github/workflows/ci.yml"))
          jobs = wf["jobs"]
          manual = yaml.safe_load(open(".github/workflows/runtime-qualification.yml"))
          runtime_jobs = {runtime + "-qualification": {
              "permissions": {"contents": "read"},
              "uses": "./.github/workflows/" + runtime + "-runtime.yml"}
              for runtime in ("orka", "kagent")}
          if (manual.get("on", manual.get(True)) != {"workflow_dispatch": None}
                  or manual.get("permissions") != {"contents": "read"}
                  or manual.get("jobs") != runtime_jobs):
              print("on-demand runtime qualification must keep both unchanged read-only callers"); sys.exit(1)
          for runtime in ("orka", "kagent"):
              worker = yaml.safe_load(open(".github/workflows/" + runtime + "-runtime.yml"))
              checkout = next(s for s in worker["jobs"]["qualify"]["steps"]
                              if str(s.get("uses", "")).startswith("actions/checkout@"))
              if checkout.get("with", {}).get("ref") != "${" + "{ github.sha }" + "}":
                  print("runtime qualification must check out the exact dispatched commit"); sys.exit(1)
          required = "e2e-hello-world"
          shards = sorted(j for j in jobs if j.startswith("e2e-") and j != required)
          if not shards:
              print("no e2e shard jobs found — the proof has to run somewhere")
              sys.exit(1)
          exempt = lambda s: (s.get("id") in ("changes", "docs-only-summary")
                              or str(s.get("if", "")).strip() == "steps.changes.outputs.docs_only == 'true'"
                              or str(s.get("uses", "")).startswith("actions/checkout"))
          # Exact match, not substring: `always() || …` or `!= 'false'`
          # would mention the output and still run without a cluster.
          guards = {"steps.changes.outputs.docs_only != 'true'",
                    "failure() && steps.changes.outputs.docs_only != 'true'",
                    "always() && steps.changes.outputs.docs_only != 'true'"}
          total = 0
          if ("e2e-orka-runtime" in jobs or any(
                  j.get("uses", "").endswith("/orka-runtime.yml") for j in jobs.values())):
              print("Orka runtime qualification belongs only in nightly and on-demand workflows"); sys.exit(1)
          full = yaml.safe_load(open(".github/workflows/orka-runtime.yml"))
          proof = full["jobs"]["qualify"]
          steps = proof["steps"]
          if ("workflow_call" not in full.get("on", full.get(True, {})) or "if" in proof or
                  proof.get("permissions") != {"contents": "read"} or proof.get("timeout-minutes") != 45):
              print("the reusable Orka worker must always execute the full read-only proof"); sys.exit(1)
          if any(str(s.get("if", "")).strip() not in {"", "always()", "failure()"} for s in steps):
              print("a reusable Orka step can skip required live proof"); sys.exit(1)
          needed = {"Native suite — qualify evaluation, exact transfer and CLI lift",
                    "Pinned update preconditions — fresh RV and pair reservation",
                    "Orka — Agent and Task return an exact local-model answer",
                    "Native Orka Tool — Task invokes read-only health Tool", "down"}
          if not needed.issubset({s.get("name") for s in steps}):
              print("the reusable Orka worker is missing required proof steps"); sys.exit(1)
          for job in shards + ["kmx-clone-free"]:
              if job == "e2e-kagent-lift":
                  caller = jobs[job]
                  routed = "${" + "{ !cancelled() && github.event_name != 'pull_request' && !(github.event_name == 'push' && github.ref == 'refs/heads/main') }" + "}"
                  if (caller.get("uses") != "./.github/workflows/kagent-runtime.yml" or
                          caller.get("needs") != ["classify-change"] or caller.get("if") != routed or
                          caller.get("permissions") != {"contents": "read"} or "secrets" in caller):
                      print("kagent must delegate read-only to full nightly/manual qualification"); sys.exit(1)
                  full = yaml.safe_load(open(".github/workflows/kagent-runtime.yml"))
                  proof = full["jobs"]["qualify"]
                  steps = proof["steps"]
                  if ("workflow_call" not in full.get("on", full.get(True, {})) or "if" in proof or
                          proof.get("permissions") != {"contents": "read"} or proof.get("timeout-minutes") != 35 or
                          any(str(s.get("if", "")).strip() not in {"", "always()", "failure()"} for s in steps)):
                      print("full kagent proof must not have path/step shortcuts"); sys.exit(1)
                  commands = {s.get("run") for s in steps}
                  if not {"bash scripts/ci/kagent-lift.sh", "mkdir -p bin && go build -o bin/kmx ./cmd/kmx"}.issubset(commands):
                      print("full kagent worker is missing live qualification"); sys.exit(1)
                  total += len(steps)
                  continue
              steps = jobs[job]["steps"]
              total += len(steps)
              bad = [s.get("name") or s.get("uses") for s in steps
                     if not exempt(s) and str(s.get("if", "")).strip() not in guards]
              if bad:
                  print(f"{job} steps missing the docs-only guard:", *bad, sep="\n  ")
                  sys.exit(1)
              # Classification diffs against the merge commit's first parent;
              # a depth-1 checkout can't resolve it and fails closed, so the
              # job boots a cluster on every docs-only change.
              if any(str(s.get("uses", "")).startswith("./.github/actions/classify-change") for s in steps):
                  co = [s for s in steps if str(s.get("uses", "")).startswith("actions/checkout")]
                  if not co or str((co[0].get("with") or {}).get("fetch-depth", 1)) not in ("0", "2"):
                      print(f"{job}: checkout needs fetch-depth 2 so docs-only classification can resolve its base")
                      sys.exit(1)
          fast = jobs.get("kagent-contract", {})
          fast_steps = fast.get("steps", [])
          fast_body = "\n".join(s.get("run", "") for s in fast_steps)
          needed = {"python3 -m unittest discover -s scripts -p 'test_kagent_lift*.py'",
                    "python3 scripts/test_suite_kagent.py",
                    "python3 scripts/test_kagent_workflows.py",
                    "go test ./internal/kmx/app -run '^(TestKagent|TestSuiteKagent|TestSuiteFailureKagent|TestReleaseLiftKagent|TestDestinationStatusKagent)' -skip '^TestLive' -count=1 -timeout=300s"}
          if (fast.get("if") != "${" + "{ !cancelled() }" + "}" or "needs" in fast or
                  fast.get("permissions") != {"contents": "read"} or
                  "not live qualification" not in fast.get("name", "") or
                  any(s.get("if") for s in fast_steps) or
                  not all(command in fast_body for command in needed) or "bash scripts/ci/kagent-lift.sh" in fast_body):
              print("fast kagent contracts must run without pretending live qualification"); sys.exit(1)
          agg = jobs[required]
          if sorted(agg.get("needs", [])) != sorted(shards + ["classify-change", "kagent-contract"]):
              print(f"{required} must need all shards and classification, needs {agg.get('needs')}")
              sys.exit(1)
          if str(agg.get("if", "")).strip() != "always()":
              print(f"{required} must always report, including nightly")
              sys.exit(1)
          for step in agg["steps"]:
              body = str(step.get("run", ""))
              if "kubectl" in body or "make " in body:
                  print(f"{required} must own no cluster steps: {step.get('name')}")
                  sys.exit(1)
          # The clone-free job proves the path with NO checkout. A checkout
          # step added to it would make kmx auto-detect a source and the job
          # would silently stop proving anything.
          if any(str(s.get("uses", "")).startswith("actions/checkout")
                 for s in jobs["kmx-clone-free"]["steps"]):
              print("kmx-clone-free must not check the repository out — that is the premise of the job")
              sys.exit(1)
          print(f"{total} cluster steps across {len(shards)} shards + kmx-clone-free: all guarded")
          print(f"{required} reports for: {', '.join(shards)}; kmx-clone-free has no checkout")
          EOF
      # kmx's own module. These checks feed the REQUIRED hygiene gate,
      # because the guard port, the scaffolder's
      # refusals and the checksum verification are the parts of kmx that
      # decide whether someone's cluster gets written to or a credential
      # gets committed — they gate merges or they are decoration. Keyless
      # and clusterless: every one of these tests runs on fixtures.
      - name: Comment-history tripwire self-test
        run: python3 scripts/check-comment-history.py --selftest
      - name: Source comments describe current behavior
        run: python3 scripts/check-comment-history.py
      - name: kmx — gofmt clean
        run: |
          formatted=$(gofmt -l cmd internal pkg embed.go embed_test.go)
          test -z "$formatted"
      - name: kmx — vet
        run: go vet ./...
      # Reuse the export cache warmed by vet instead of adding a cold compile.
      - name: Orka typed caller boundary
        run: go run scripts/ci/orka-callers.go
      # staticcheck, pinned to an exact release tag.
      #
      # The version matters and is easy to get wrong. staticcheck 2025.1.1
      # is built with go1.23.8, and this repository's module
      # requires go1.26 — so that release cannot compile the tree at all. It
      # does not report zero findings; it refuses to load the packages, and
      # a CI step that swallowed that would be a lint job proving nothing.
      # 2026.2.1 builds go1.26 and is what runs here.
      #
      # Pinned to `@2026.2.1` — staticcheck's own release tag, which is what
      # its documentation tells you to install and what `--version` prints —
      # rather than the module version `v0.8.1` or a floating `@latest`. An
      # exact pin means what CI enforces changes only when somebody edits
      # this file.
      #
      # Keyless: `go install` from the public module proxy, no token.
      # The ST1005 decision, and why it is a decision, lives in
      # staticcheck.conf at the repository root.
      - name: kmx — staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2026.2.1
          "$(go env GOPATH)/bin/staticcheck" ./...
      - name: kmx — build
        run: go build ./...
      - name: kmx — filesystem and state race tests
        run: go test -race -count=1 ./internal/kmx/fileaccess ./internal/kmx/config
      - name: kmx — Windows libraries
        run: |
          GOOS=windows GOARCH=amd64 go build ./internal/... ./pkg/...
          GOOS=windows GOARCH=arm64 go build ./internal/... ./pkg/...
      - name: kmx — test (guard port, scaffolder, toolchain digests)
        id: kmx_tests
        run: |
          set -euo pipefail
          # App runs in its own process-isolated shards, required by this job's
          # final gate. Keep every other package and preserve discovery/build
          # failures as well as test failures.
          remaining=$(go list ./... | grep -vx "github.com/kaimahi-agents/kaimahi/internal/kmx/app")
          test -n "$remaining"
          mapfile -t packages <<< "$remaining"
          go_status=0
          go test "${packages[@]}" -json > kmx-test.json 2>&1 || go_status=$?
          # `ok  <package>` can mean every test SKIPPED. Each required
          # package must pass at least one test and have no failures.
          # Replay package/build Output events and non-JSON lines: build
          # errors may arrive outside test Output events and must be visible.
          # Individual test names are printed below only on failure.
          python3 - "$go_status" <<'EOF'
          import collections, json, sys

          # Why each of these is required, rather than just being a package
          # that happens to exist:
          REQUIRED = {
              "internal/kmx/agentsuite": "internal sandbox construction contracts",
              "internal/kmx/agentsuite/agentkit": "AgentKit build and archive policy",
              "internal/kmx/agentsuite/localartifact": "local bounded suite layout and archive ingestion",
              "internal/kmx/agentsuite/oras": "AgentSuite packing and registry transfer",
              "pkg/suiteview": "public read-only suite member recipe views",
              # The reason this job is required at all.
              "internal/kmx/guard": "the context guard's port decisions",
              "internal/kmx/fileaccess": "checked filesystem, private mutation and identity foundations",
              "internal/kmx/config": "native state location and explicit creating/non-creating resolution",
              "internal/kmx/scaffold": "the scaffolder's key-shape refusals",
              "internal/kmx/orkaschema": "pinned Orka schemas and unknown-field refusals",
              # kmx downloads kind and kubectl. A binary it fetches
              # runs with the operator's kubeconfig, so the digest checks
              # are not decoration.
              "internal/kmx/toolchain": "the fetched toolchain's digests",
              "internal/kmx/portforward": "owned loopback forwards for native results and tools",
              # The managed path's rules about what may be deleted on
              # somebody else's subscription. Live infrastructure teardown
              # is exercised infrequently, so these tests catch regressions
              # without requiring a managed cluster.
              "internal/kmx/lift": "what may be deleted on a managed cluster",
              # Go's flag parsing stops at the first positional: native
              # agent commands must preserve argument order and refusals.
              "cmd/kmx": "native command argument order and retired-command refusals",
              # One list of credential shapes, read by the scaffolder, the
              # model configuration and the tree scan.
              "internal/kmx/secretshapes": "the shared credential-shape list",
          }

          passed = collections.Counter()
          failed_tests = collections.Counter()
          failed_names = []
          result = {}
          with open("kmx-test.json") as output:
              for line in output:
                  try:
                      event = json.loads(line)
                  except ValueError:
                      sys.stdout.write(line)  # build stderr can be plain text
                      continue
                  package, action, test = event.get("Package", ""), event.get("Action"), event.get("Test")
                  if not test:
                      sys.stdout.write(event.get("Output", ""))  # includes build-output events
                  if test and action == "pass":
                      passed[package] += 1
                  if test and action == "fail":
                      failed_tests[package] += 1
                      failed_names.append(f"{package}: {test}")
                  if not test and action in ("pass", "fail", "skip"):
                      result[package] = action

          problems = []
          for suffix, why in REQUIRED.items():
              named = [p for p in result if p == "github.com/kaimahi-agents/kaimahi/" + suffix]
              if not named:
                  problems.append(f"{suffix}: no such package ran — {why} was not exercised")
                  continue
              for package in named:
                  if result[package] != "pass":
                      problems.append(f"{package}: reported {result[package]}")
                  elif failed_tests[package]:
                      problems.append(f"{package}: {failed_tests[package]} test(s) failed")
                  elif not passed[package]:
                      problems.append(f"{package}: reported ok without a single test passing — "
                                      f"{why} was not exercised")
          for line in problems:
              print(line)
          if failed_names:
              print("failing tests:")
              for name in failed_names:
                  print("  " + name)
          if int(sys.argv[1]) != 0:
              print(f"go test exited with status {sys.argv[1]}")
          if problems or failed_names or int(sys.argv[1]) != 0:
              sys.exit(1)
          print(f"every required package ran its own tests: {sum(passed.values())} passed "
                f"across {len(REQUIRED)} required packages")
          EOF
          # Generated Orka YAML must parse without letting instructions
          # escape their scalar. This named test uses the Go YAML parser
          # with no Python dependency or skip path. Keep asserting it ran:
          # a renamed test must not turn go test -run into a green no-op.
          go test ./internal/kmx/scaffold/ -v \
            -run TestGeneratedManifestParsesAndKeepsInstructionsInsideTheScalar 2>&1 | tee parse.out
          grep -q -- '--- PASS: TestGeneratedManifestParsesAndKeepsInstructionsInsideTheScalar' parse.out
      - name: kmx — failed test output
        if: failure() && steps.kmx_tests.outcome == 'failure' && hashFiles('kmx-test.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: kmx-test-json
          path: kmx-test.json
      - name: agent-create wizard — terminal lifecycle
        run: |
          set -euo pipefail
          # Retained native flows exercise PTY Ctrl-C/console Escape, workspace
          # confirmation/completion and SIGINT/SIGTERM guard cancellation.
          # PTY wizard, console and chat checks compare restored terminal state;
          # signal/input ownership and model-screen cancellation stay separate.
          go test ./internal/kmx/app \
            -run '^(TestQuickstartWizardPTYCtrlCRestoresTerminal|TestAgentTUIDemoPTYCommandsAndTerminalRestore|TestCreateSuiteMemberTerminalConfirmation|TestTimelinePTYEditsAndCancelsRunningResponse|TestOrkaGuardPromptCancellationAndInputOwnership|TestQuickstartCancellationAcrossScreens|TestQuickstartNormalCompletionIsNotCancellation)$' \
            -count=1 -v | tee wizard-pty.out
          for test in \
            TestQuickstartWizardPTYCtrlCRestoresTerminal \
            TestAgentTUIDemoPTYCommandsAndTerminalRestore \
            TestCreateSuiteMemberTerminalConfirmation \
            TestTimelinePTYEditsAndCancelsRunningResponse \
            TestOrkaGuardPromptCancellationAndInputOwnership \
            TestQuickstartCancellationAcrossScreens \
            TestQuickstartNormalCompletionIsNotCancellation; do
            grep -q -- "--- PASS: $test" wizard-pty.out
          done
          ! grep -q -- '--- SKIP:' wizard-pty.out
      - name: The retired runtime is refused by name, not resolved to Orka
        run: |
          set -euo pipefail
          go test ./internal/kmx/app ./cmd/kmx -run 'Retired|TestLegacyAgentEditIsRemovedBeforeConfiguration' -count=1 -v | tee retirement.out
          grep -q -- '--- PASS: TestChatRefusesTheRetiredKagentRuntimeWithoutReachingACluster' retirement.out
          grep -q -- '--- PASS: TestLegacyAgentEditIsRemovedBeforeConfiguration' retirement.out
          ! grep -q -- '--- SKIP:' retirement.out
  # Run checks alongside native tests; keep the required name fail-closed.
  # Missing, skipped, cancelled or failed work must never produce a green gate.
  hygiene:
    runs-on: ubuntu-latest
    needs: [hygiene-checks, app-tests, windows-amd64-native, windows-arm64-cross]
    if: always()
    steps:
      - name: Every required hygiene dependency succeeded
        if: always()
        env:
          SHARDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'EOF'
          import json, os, sys
          needs = json.loads(os.environ["SHARDS"])
          expected = {"hygiene-checks", "app-tests", "windows-amd64-native", "windows-arm64-cross"}
          if set(needs) != expected:
              print("missing or unexpected hygiene dependency — refusing success"); sys.exit(1)
          bad = {}
          for name in sorted(expected):
              result = needs[name].get("result", "unknown")
              print(f"{name}: {result}")
              if result != "success":
                  bad[name] = result
          if bad:
              print("required hygiene dependencies did not all succeed:", bad); sys.exit(1)
          EOF

  # Linux uses its XDG user-config location while macOS uses
  # ~/Library/Application Support. Cross-compiling a Darwin binary does not
  # execute that distinction, so this native job protects the KMX_HOME
  # isolation contract without duplicating the cluster or full Go
  # suites already run by the Linux jobs.
  # Nightly also runs the dedicated Go lift proof; existing cluster and
  # platform jobs retain their PR, push and manual-dispatch behavior.
  state-paths-macos:
    if: github.event_name != 'schedule'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: Native macOS suite view safety
        run: |
          set -euo pipefail
          go test ./pkg/suiteview ./internal/kmx/agentsuite/localartifact \
            -count=1 -v | tee suiteview-macos.out
          grep -q -- '--- PASS:' suiteview-macos.out
          if grep -q -- '--- SKIP:' suiteview-macos.out; then
            exit 1
          fi
      - name: Native macOS state paths honor KMX_HOME
        run: |
          set -euo pipefail
          go test ./internal/kmx/config \
            -run '^(TestStateDirUsesPortableOverrideAndNativeDefault|TestContextResolutionOrder)$' \
            -count=1 -v | tee state-dir.out
          grep -q -- '--- PASS: TestStateDirUsesPortableOverrideAndNativeDefault' state-dir.out
          grep -q -- '--- PASS: TestContextResolutionOrder' state-dir.out

          go test ./internal/kmx/app \
            -run '^(TestAgentLocationsPersistSeparateClustersPrivately|TestAgentTUIEnvironmentClassificationAndKubeconfigIsolation|TestAgentTUIProviderAndHostOverrideInferenceInfo|TestConsoleInferenceSourcePersistenceAndValidation|TestLiftPreferencesPersistScopedSelections|TestFoundryConfigRejectsTokenRedirectDestinations|TestQuickstartWizardSuiteAuthorsOnlyPrivateSource|TestAgentTUIStartupPrefersRememberedRemoteAndHonorsFlags)$' \
            -count=1 -v | tee app-state.out
          for test in \
            TestAgentLocationsPersistSeparateClustersPrivately \
            TestAgentTUIEnvironmentClassificationAndKubeconfigIsolation \
            TestAgentTUIProviderAndHostOverrideInferenceInfo \
            TestConsoleInferenceSourcePersistenceAndValidation \
            TestLiftPreferencesPersistScopedSelections \
            TestFoundryConfigRejectsTokenRedirectDestinations \
            TestQuickstartWizardSuiteAuthorsOnlyPrivateSource \
            TestAgentTUIStartupPrefersRememberedRemoteAndHonorsFlags; do
            grep -q -- "--- PASS: $test" app-state.out
          done
          if grep -q -- '--- SKIP:' state-dir.out app-state.out; then
            exit 1
          fi

          go test ./cmd/kmx \
            -run '^TestPrivateTempDirReturnsCanonicalPrivatePath$' \
            -count=1 -v | tee private-temp-dir.out
          grep -q -- '--- PASS: TestPrivateTempDirReturnsCanonicalPrivatePath' private-temp-dir.out
          if grep -q -- '--- SKIP:' private-temp-dir.out; then
            exit 1
          fi

  # Existing native shards prove quickstart, exact-version kagent create,
  # Orka runtime and Helm integration, and clusterless live evaluation.
  # Their docs guards and schedule semantics remain unchanged.
  e2e-quickstart:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Classify the change (docs-only short-circuit, fail closed)
        id: changes
        uses: ./.github/actions/classify-change
      - uses: actions/setup-go@v5
        if: steps.changes.outputs.docs_only != 'true'
        with:
          go-version-file: go.mod
      # A pull request has no release to install from, so one is made here:
      # the binary this branch builds, plus the checksums.txt the install
      # script verifies it against. The mechanism under test is the real one
      # — only the origin is local.
      # Compound quickstart cannot pause between cluster creation and workload
      # pulls; wrap Docker's node creation, leaving kind and image pins intact.
      - name: Configure CI registry mirrors
        if: steps.changes.outputs.docs_only != 'true'
        run: python3 "$GITHUB_WORKSPACE/scripts/ci/registry-mirrors.py" setup --wrap
      - name: Build the release this branch would publish
        if: steps.changes.outputs.docs_only != 'true'
        run: |
          mkdir -p /tmp/release
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o /tmp/release/kmx-linux-amd64 ./cmd/kmx
          ( cd /tmp/release && sha256sum kmx-linux-amd64 > checksums.txt )
      # The premise, MADE TRUE rather than assumed. A GitHub runner ships
      # kubectl and Go in /usr/bin and Helm in /usr/local/bin, so no amount of
      # PATH arrangement produces the machine kmx is built for — /usr/bin is
      # also where docker and coreutils live. They are moved aside for the
      # length of this job and put back afterwards, which is the only way the
      # "kmx fetches them" claim is actually under test rather than asserted.
      - name: Make this runner the machine kmx is built for
        if: steps.changes.outputs.docs_only != 'true'
        run: |
          set -euo pipefail
          for t in kubectl helm kind go; do
            while p=$(command -v "$t" 2>/dev/null); do
              echo "hiding $p"
              sudo mv "$p" "$p.kmx-ci-hidden"
            done
          done
          for t in kubectl helm kind go; do
            if command -v "$t" >/dev/null 2>&1; then
              echo "premise broken: $t is still on PATH ($(command -v "$t"))"; exit 1
            fi
          done
          command -v docker >/dev/null || { echo "no container engine"; exit 1; }
          echo "this machine now has a container engine and nothing else kmx needs"
      - name: One command — install kmx and answer a question
        id: quickstart
        if: steps.changes.outputs.docs_only != 'true'
        env:
          KMX_DOWNLOAD_BASE: file:///tmp/release
          KIND_CLUSTER: kmx-quickstart
        run: |
          set -euo pipefail
          start=$(date +%s)
          sh install.sh --quickstart 2>&1 | tee quickstart.out
          elapsed=$(( $(date +%s) - start ))
          echo "seconds=$elapsed" >> "$GITHUB_OUTPUT"
          echo "time from one command to an answer: ${elapsed}s"
      - name: Verify effective kubelet sync frequency
        if: steps.changes.outputs.docs_only != 'true'
        run: |
          set -euo pipefail
          "$HOME/.config/kmx/path/kubectl" --context kind-kmx-quickstart --request-timeout=10s \
            get --raw /api/v1/nodes/kmx-quickstart-control-plane/proxy/configz 2>/dev/null |
            python3 -c '
          import json, sys
          try:
              frequency = json.load(sys.stdin)["kubeletconfig"]["syncFrequency"]
          except (ValueError, KeyError, TypeError):
              sys.exit("effective kubelet configuration unavailable")
          if frequency != "5s":
              sys.exit("effective kubelet syncFrequency must be 5s")
          print("effective kubelet syncFrequency: 5s")
          '
      - name: The agent actually answered, and nothing is governed yet
        if: steps.changes.outputs.docs_only != 'true'
        run: |
          set -euo pipefail
          grep -q 'COMPLETE  An agent answered' quickstart.out
          # The ungoverned state must be stated, not left to be inferred
          # from an empty ledger.
          grep -q 'This command does not enable governance' quickstart.out
          # The tools were fetched by kmx, not installed by the job. Orka's
          # pinned harness-v2 chart needs Helm for the first answer.
          for t in kind kubectl helm; do
            grep -q "fetching $t v" quickstart.out
          done
          # Nothing on this path installs, reads or waits on the legacy runtime.
          if grep -qi 'kagent' quickstart.out; then
            echo "the supported first-answer path still names the legacy runtime:"
            grep -i kagent quickstart.out; exit 1
          fi
          # Full suite eval/lift precedes the separate fresh answer Task.
          grep -q 'Install Orka v' quickstart.out
          grep -q 'Deploy the hello-world-agent agent' quickstart.out
      # `kmx cluster up` on the same cluster is the RUNTIME and nothing more: it
      # must reconcile Orka without deploying an agent, and without bringing
      # back a legacy runtime that no longer has a caller.
      - name: kmx cluster up is the runtime, and deploys no agent
        if: steps.changes.outputs.docs_only != 'true'
        env:
          KIND_CLUSTER: kmx-quickstart
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          k="$HOME/.config/kmx/path/kubectl"
          source_before=$("$k" --context kind-kmx-quickstart -n orka-system get providers.core.orka.ai local -o jsonpath='{.metadata.resourceVersion}')
          kmx cluster up 2>&1 | tee up-after-quickstart.out
          source_after=$("$k" --context kind-kmx-quickstart -n orka-system get providers.core.orka.ai local -o jsonpath='{.metadata.resourceVersion}')
          test "$source_before" = "$source_after"
          if grep -qi 'kagent' up-after-quickstart.out; then
            echo "a bare kmx cluster up still names the legacy runtime:"
            grep -i kagent up-after-quickstart.out; exit 1
          fi
          k="$HOME/.config/kmx/path/kubectl"
          # The runtime, read from the cluster rather than from the command's
          # own stdout.
          "$k" --context kind-kmx-quickstart -n orka-system rollout status \
            deploy/orka-api-controller --timeout=120s
          if "$k" --context kind-kmx-quickstart -n orka-system get deploy orka-agent-harness-wrapper --ignore-not-found -o name | grep -q .; then
            echo "the harness wrapper was installed instead of harness-v2"; exit 1
          fi
          "$k" --context kind-kmx-quickstart -n orka-system get \
            providers.core.orka.ai local >/dev/null
          # The grant `up --step orka` owns, and its exact extent.
          "$k" --context kind-kmx-quickstart -n orka-system get \
            serviceaccount orka-result-reader >/dev/null
          rules=$("$k" --context kind-kmx-quickstart -n orka-system get \
            role orka-result-reader -o json)
          python3 - "$rules" <<'EOF'
          import json, sys
          rules = json.loads(sys.argv[1])["rules"]
          assert rules == [{"apiGroups": ["core.orka.ai"], "resources": ["tasks"],
                            "verbs": ["get"]}], rules
          print("result-reader grant is one verb on one resource")
          EOF
          # No legacy runtime was installed by anything on this path.
          if "$k" --context kind-kmx-quickstart get ns kagent >/dev/null 2>&1; then
            echo "namespace exists on the supported path: the legacy runtime is installed"; exit 1
          fi
          # Exactly the kmx-owned Orka chart, in harness-v2 mode.
          h="$HOME/.config/kmx/path/helm"
          test "$("$h" --kube-context kind-kmx-quickstart list --all-namespaces --short)" = orka
          "$h" --kube-context kind-kmx-quickstart -n orka-system get values orka -o json | python3 -c '
          import json, sys
          v = json.load(sys.stdin)
          assert v["controller"]["mode"] == "harness-v2", v
          assert v["fullnameOverride"] == "orka-api", v
          assert v["labels"]["kmx.kaimahi.dev/installed"] == "true", v
          '
      # Repeat after runtime setup without changing the source binding identity.
      # Each run still evaluates all cases and requests a separate fresh answer.
      - name: Safe to run twice, and machine-readable
        if: steps.changes.outputs.docs_only != 'true'
        env:
          KIND_CLUSTER: kmx-quickstart
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          # Show what the run said if anything below fails: a step that hides
          # its own evidence costs a whole CI cycle to diagnose.
          trap 'echo "--- stderr ---"; tail -40 quickstart2.err; echo "--- stdout (first 400 bytes) ---"; head -c 400 quickstart.json' ERR
          kmx cluster quickstart --output json > quickstart.json 2> quickstart2.err
          # stdout must be ONE json document and nothing else — the caller is
          # a parser, not a person.
          head -c 1 quickstart.json | grep -q '{'
          python3 - <<'EOF'
          import json, shlex, sys
          r = json.load(open("quickstart.json"))
          assert r["ok"] is True, r
          assert r["governed"] is False, "the fast path must not claim governance"
          assert r["answer"].strip(), "no answer in the structured output"
          assert r["agent"] == "hello-world-agent", r
          assert "orka-system" in r["manifest"], r["manifest"]
          assert r["suite_digest"].startswith("sha256:"), r
          assert r["suite_digest"] in r["manifest"], r
          for key in ("workspace", "layout", "evidence"):
              assert r[key], r
          assert not __import__("pathlib").Path(r["workspace"], "agent.yaml").exists(), r
          assert "kagent" not in r["manifest"], r["manifest"]
          assert r["context"] == "kind-kmx-quickstart", r
          assert r["elapsed_seconds"] > 0, r
          commands = [shlex.split(n) for n in r["next"]]
          assert len(commands) == 3, r["next"]
          assert [argv[:3] for argv in commands] == [["kmx", "--context", r["context"]]] * 3, commands
          assert commands[0][3:4] == ["chat"], commands
          assert commands[1][3:] == ["create", "--help"], commands
          assert commands[2][3:] == ["cluster", "orka", "status"], commands
          print("second run:", round(r["elapsed_seconds"], 1), "s ·", r["answer"][:80])
          EOF
      # Rerunning is how an agent in a harness uses this command. The third
      # run must REUSE the exact suite placement — not recreate it,
      # and not refuse it — and must still produce a fresh Task and answer.
      - name: A third run reevaluates and reuses the exact suite placement
        if: steps.changes.outputs.docs_only != 'true'
        env:
          KIND_CLUSTER: kmx-quickstart
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          k="$HOME/.config/kmx/path/kubectl"
          before=$("$k" --context kind-kmx-quickstart -n orka-system get \
            agents.core.orka.ai hello-world-agent -o jsonpath='{.metadata.uid}')
          tasks_before=$("$k" --context kind-kmx-quickstart -n orka-system get \
            tasks.core.orka.ai -o name | wc -l)
          kmx cluster quickstart 2>&1 | tee quickstart3.out
          grep -q 'Provider/hello-world-agent: reused; observed Ready=true' quickstart3.out
          grep -q 'Agent/hello-world-agent: reused; observed Ready=true' quickstart3.out
          grep -q 'COMPLETE  An agent answered' quickstart3.out
          after=$("$k" --context kind-kmx-quickstart -n orka-system get \
            agents.core.orka.ai hello-world-agent -o jsonpath='{.metadata.uid}')
          test "$before" = "$after"
          tasks_after=$("$k" --context kind-kmx-quickstart -n orka-system get \
            tasks.core.orka.ai -o name | wc -l)
          test "$tasks_after" -eq "$((tasks_before + 2))"
          echo "reused suite placement (UID $after), full eval and fresh answer Tasks"
      # A live spec that differs from the one quickstart would write is
      # somebody's deliberate change. It must STOP, not overwrite it.
      - name: A drifted suite placement is refused before Tasks
        if: steps.changes.outputs.docs_only != 'true'
        env:
          KIND_CLUSTER: kmx-quickstart
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          k="$HOME/.config/kmx/path/kubectl"
          "$k" --context kind-kmx-quickstart -n orka-system patch \
            agents.core.orka.ai hello-world-agent --type merge \
            -p '{"spec":{"systemPrompt":{"inline":"edited by an operator"}}}'
          tasks_before=$("$k" --context kind-kmx-quickstart -n orka-system get tasks.core.orka.ai -o name | wc -l)
          if kmx cluster quickstart > drift.out 2>&1; then
            echo "a drifted Agent was overwritten instead of refused"; cat drift.out; exit 1
          fi
          grep -q 'native placement refused: Agent/hello-world-agent differs from the reviewed suite' drift.out
          tasks_after=$("$k" --context kind-kmx-quickstart -n orka-system get tasks.core.orka.ai -o name | wc -l)
          test "$tasks_after" -eq "$tasks_before"
          prompt=$("$k" --context kind-kmx-quickstart -n orka-system get \
            agents.core.orka.ai hello-world-agent -o jsonpath='{.spec.systemPrompt.inline}')
          test "$prompt" = "edited by an operator"
          echo "the operator's edit survived the refusal"
      - name: The time did not double
        if: steps.changes.outputs.docs_only != 'true'
        env:
          SECONDS_TAKEN: ${{ steps.quickstart.outputs.seconds }}
        run: |
          set -euo pipefail
          # This 315s ceiling guards time from one command to an Orka answer.
          # It has no measured Orka baseline yet; do not infer one from this
          # ceiling. If the check fails, investigate the regression before
          # raising the ceiling. Record a green run on this runner class when
          # calibrating the bound.
          ceiling=315
          echo "time to first answer: ${SECONDS_TAKEN}s (ceiling ${ceiling}s)"
          if [ "$SECONDS_TAKEN" -gt "$ceiling" ]; then
            echo "time from one command to an answer regressed past the ceiling."
            echo "This is the time from one command to a working agent — the front door's whole promise."
            echo "Find what got slower before raising the ceiling."
            exit 1
          fi
      - name: Report registry pull endpoint evidence
        if: always() && steps.changes.outputs.docs_only != 'true'
        run: python3 "$GITHUB_WORKSPACE/scripts/ci/registry-mirrors.py" report
      - name: Tear down, and give the runner its tools back
        if: always() && steps.changes.outputs.docs_only != 'true'
        env:
          KIND_CLUSTER: kmx-quickstart
        run: |
          "$HOME/.local/bin/kmx" --context kind-kmx-quickstart cluster down || true
          # Put back what was moved aside, so nothing after this job (or any
          # post step) meets a runner missing its own toolchain.
          for hidden in /usr/bin/*.kmx-ci-hidden /usr/local/bin/*.kmx-ci-hidden /usr/local/go/bin/*.kmx-ci-hidden; do
            [ -e "$hidden" ] || continue
            sudo mv "$hidden" "${hidden%.kmx-ci-hidden}"
          done
      - name: Docs-only short-circuit
        id: docs-only-summary
        if: steps.changes.outputs.docs_only == 'true'
        run: echo "every changed file is documentation; no cluster booted"
  e2e-orka-helm:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Classify the change (docs-only short-circuit, fail closed)
        id: changes
        uses: ./.github/actions/classify-change
      - name: Install kind
        if: steps.changes.outputs.docs_only != 'true'
        run: |
          curl -fsSLo kind https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64
          chmod +x kind && sudo mv kind /usr/local/bin/kind
      - uses: actions/setup-go@v5
        if: steps.changes.outputs.docs_only != 'true'
        with:
          go-version-file: go.mod
      - name: Configure CI registry mirrors
        if: steps.changes.outputs.docs_only != 'true'
        run: python3 "$GITHUB_WORKSPACE/scripts/ci/registry-mirrors.py" setup
      - name: Create only the dedicated Helm cluster
        if: steps.changes.outputs.docs_only != 'true'
        run: |
          set -euo pipefail
          if kind get clusters | grep -qx helm-release-orka; then
            echo 'refusing to reuse or delete an existing kind cluster'; exit 1
          fi
          kind create cluster --name helm-release-orka --wait 90s
          echo 'KMX_ORKA_HELM_CREATED=1' >> "$GITHUB_ENV"
          python3 "$GITHUB_WORKSPACE/scripts/ci/registry-mirrors.py" nodes --cluster helm-release-orka
      - name: Install SHA-256 verified stock Orka harness-v2 chart
        if: steps.changes.outputs.docs_only != 'true'
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://github.com/orka-agents/orka/releases/download/v0.2.0/orka-0.2.0.tgz -o /tmp/orka-helm-0.2.0.tgz
          printf '%s  %s\n' 'b7596c4e35d7189a3b2cf25921cd50e6c31328dbb83bdee50e20c757e0f03b79' /tmp/orka-helm-0.2.0.tgz | sha256sum -c -
          mkdir -p /tmp/orka-helm-chart
          tar -xzf /tmp/orka-helm-0.2.0.tgz -C /tmp/orka-helm-chart orka/crds
          kubectl --context kind-helm-release-orka apply -f /tmp/orka-helm-chart/orka/crds/ >/dev/null
          kubectl --context kind-helm-release-orka wait --for=condition=Established --timeout=120s -f /tmp/orka-helm-chart/orka/crds/ >/dev/null
          helm --kube-context kind-helm-release-orka install orka /tmp/orka-helm-0.2.0.tgz -n orka-system \
            --create-namespace --wait --timeout 10m --set controller.mode=harness-v2 >/dev/null 2>/dev/null || {
              echo 'stock Orka Helm install failed (chart output suppressed)'; exit 1;
            }
          helm --kube-context kind-helm-release-orka -n orka-system get values orka -o json | python3 -c '
          import json, sys
          v = json.load(sys.stdin)
          assert v["controller"]["mode"] == "harness-v2", "unexpected controller mode"
          assert not v.get("fullnameOverride"), "stock release has fullnameOverride"
          '
          kubectl --context kind-helm-release-orka -n orka-system rollout status deploy/orka-controller --timeout=180s >/dev/null
      - name: Prepare the stock Tool and scoped result access through kmx methods
        if: steps.changes.outputs.docs_only != 'true'
        run: |
          set -euo pipefail
          KMX_LIVE_KIND_CONTEXT=kind-helm-release-orka go test ./internal/kmx/app \
            -run '^TestLiveProvisionOrkaResultReader$' -count=1
          KMX_LIVE_KIND_CONTEXT=kind-helm-release-orka go test ./internal/kmx/app \
            -run '^TestLiveInstallQuickstartK8sTool$' -count=1
          kubectl --context kind-helm-release-orka -n orka-system get rolebinding kmx-k8s-tool-policy-reader -o json | python3 -c '
          import json, sys
          b = json.load(sys.stdin)
          assert b["subjects"] == [{"kind":"ServiceAccount","name":"orka-ai-worker","namespace":"orka-system"}], "wrong stock AI worker grant"
          assert b["roleRef"]["name"] == "kmx-k8s-tool-policy-reader", "wrong reader Role"
          '
          kubectl --context kind-helm-release-orka -n orka-system get role kmx-k8s-tool-policy-reader -o json | python3 -c '
          import json, sys
          assert json.load(sys.stdin)["rules"] == [{"apiGroups":["core.orka.ai"],"resources":["outboundaccesspolicies"],"resourceNames":["kmx-k8s-tool-gateway"],"verbs":["get"]}], "policy Role is not exactly named get"
          '
          test "$(kubectl --context kind-helm-release-orka -n orka-system auth can-i get outboundaccesspolicies.core.orka.ai/kmx-k8s-tool-gateway --as=system:serviceaccount:orka-system:orka-ai-worker)" = yes
          test "$(kubectl --context kind-helm-release-orka -n orka-system auth can-i get outboundaccesspolicies.core.orka.ai/unrelated --as=system:serviceaccount:orka-system:orka-ai-worker || true)" = no
      - name: Helm-style Tool health Task succeeds with projected event metadata
        if: steps.changes.outputs.docs_only != 'true'
        run: |
          set -euo pipefail
          health_marker="health-$(head -c 8 /dev/urandom | od -An -tx1 | tr -d ' \n')"
          kubectl --context kind-helm-release-orka -n orka-system create deployment "$health_marker" \
            --image=registry.k8s.io/pause:3.10 --replicas=0 >/dev/null
          kubectl --context kind-helm-release-orka -n orka-system create secret generic local-provider-key \
            --from-literal=api-key=not-used-by-this-endpoint >/dev/null
          kubectl --context kind-helm-release-orka -n orka-system create configmap orka-tool-model \
            --from-file=server.py=scripts/ci/orka-tool-model.py >/dev/null
          kubectl --context kind-helm-release-orka apply -f scripts/ci/orka-tool-model.yaml >/dev/null
          kubectl --context kind-helm-release-orka -n orka-system set env deployment/orka-tool-model \
            ORKA_HEALTH_DEPLOYMENT_MARKER="$health_marker" >/dev/null
          kubectl --context kind-helm-release-orka -n orka-system rollout status deploy/orka-tool-model --timeout=180s >/dev/null
          go build -o /tmp/orka-helm-kmx ./cmd/kmx
          mkdir -p bin
          go build -o bin/orka-native-reference ./scripts/ci/orka-native-reference.go
          python3 scripts/ci/orka-runtime-fixture.py kind-helm-release-orka tool
          /tmp/orka-helm-kmx --context kind-helm-release-orka run --agent orka-tool-proof --namespace orka-system \
            --prompt 'Check deployment health in orka-system using k8s-get-resources.' \
            >/dev/null 2>/dev/null || { echo 'stock health Task failed (answer and worker output suppressed)'; exit 1; }
          task=$(kubectl --context kind-helm-release-orka -n orka-system get tasks.core.orka.ai -o json | \
            python3 -c 'import json,sys; items=json.load(sys.stdin)["items"]; matches=[i for i in items if i.get("spec",{}).get("agentRef",{}).get("name")=="orka-tool-proof"]; assert len(matches)==1, "expected one stock health Task"; print(matches[0]["metadata"]["name"])')
          test "$(kubectl --context kind-helm-release-orka -n orka-system get task "$task" -o jsonpath='{.status.phase}')" = Succeeded || { echo 'stock health Task did not succeed'; exit 1; }
          KMX_LIVE_KIND_CONTEXT=kind-helm-release-orka KMX_LIVE_TASK_NAME="$task" \
            go test ./internal/kmx/app -run '^TestLiveInspectQuickstartToolEvents$' -count=1 -v
      - name: Helm Task and Tool phase diagnostics on failure
        if: failure() && steps.changes.outputs.docs_only != 'true'
        run: |
          if [ "${KMX_ORKA_HELM_CREATED:-}" = 1 ]; then
            kubectl --context kind-helm-release-orka -n orka-system get tasks.core.orka.ai -o json | python3 -c 'import json,sys; print("Task phases:",[t.get("status",{}).get("phase","unknown") for t in json.load(sys.stdin).get("items",[])])' || true
            kubectl --context kind-helm-release-orka -n orka-system get tools.core.orka.ai k8s-get-resources -o json | python3 -c 'import json,sys; print("Tool conditions:",[(c.get("type"),c.get("status")) for c in json.load(sys.stdin).get("status",{}).get("conditions",[])])' || true
          fi
      - name: Report registry pull endpoint evidence
        if: always() && steps.changes.outputs.docs_only != 'true'
        run: python3 "$GITHUB_WORKSPACE/scripts/ci/registry-mirrors.py" report
      - name: Delete only the cluster created by this job
        if: always() && steps.changes.outputs.docs_only != 'true'
        run: |
          if [ "${KMX_ORKA_HELM_CREATED:-}" = 1 ]; then kind delete cluster --name helm-release-orka; fi
      - name: Docs-only short-circuit
        id: docs-only-summary
        if: steps.changes.outputs.docs_only == 'true'
        run: echo "every changed file is documentation; no cluster booted"
  kagent-contract:
    name: kagent contract — not live qualification
    if: ${{ !cancelled() }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: Hermetic fixture and qualifier contracts — no live cluster
        run: |
          python3 -m unittest discover -s scripts -p 'test_kagent_lift*.py'
          python3 scripts/test_suite_kagent.py
          python3 scripts/test_kagent_workflows.py
      - name: Offline kagent Go contracts — not live qualification
        run: go test ./internal/kmx/app -run '^(TestKagent|TestSuiteKagent|TestSuiteFailureKagent|TestReleaseLiftKagent|TestDestinationStatusKagent)' -skip '^TestLive' -count=1 -timeout=300s
      - name: State the coverage boundary
        run: echo "Hermetic kagent contracts passed; not live qualification. Live A2A, full evaluation, evaluated push and suite lift run nightly and on demand before runtime-related tags."

  e2e-kagent-lift:
    needs: [classify-change]
    if: ${{ !cancelled() && github.event_name != 'pull_request' && !(github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    permissions:
      contents: read
    uses: ./.github/workflows/kagent-runtime.yml

  e2e-hello-world:
    runs-on: ubuntu-latest
    needs: [classify-change, kagent-contract, e2e-kagent-lift, e2e-orka-helm, e2e-quickstart]
    if: always()
    steps:
      - name: Every e2e shard succeeded
        env:
          SHARDS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          python3 - <<'EOF'
          import json, os, sys
          needs = json.loads(os.environ["SHARDS"])
          expected = {"kagent-contract", "e2e-kagent-lift", "e2e-orka-helm", "e2e-quickstart"}
          classifier = needs.pop("classify-change", {})
          if classifier.get("result") != "success":
              print("classification did not succeed — refusing to report success"); sys.exit(1)
          if set(needs) != expected:
              print("missing or unexpected e2e shard dependencies — refusing success"); sys.exit(1)
          event = os.environ["EVENT"]
          ref = os.environ["REF"]
          bad = {}
          for job, outcome in sorted(needs.items()):
              result = outcome.get("result", "unknown")
              print(f"{job}: {result}")
              intended_skip = job == "e2e-kagent-lift" and (event == "pull_request" or (event == "push" and ref == "refs/heads/main"))
              scheduled_skip = job in {"e2e-orka-helm", "e2e-quickstart"} and event == "schedule"
              if result != "success" and not (result == "skipped" and (intended_skip or scheduled_skip)):
                  bad[job] = result
          if bad:
              print("e2e shards did not succeed:", bad); sys.exit(1)
          print("every e2e shard succeeded")
          EOF
  kmx-clone-free:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      # The same docs-only short-circuit the e2e job has, and for the same
      # reason: every documentation update is a PR that merges to main, and
      # a 40-minute cluster run per doc commit is a cost with no coverage.
      # Fail closed — any error, an undeterminable file set, or anything that
      # is not documentation runs the full job. There is no checkout here, so
      # the file list comes from the compare API rather than from git.
      - name: Classify the change (docs-only short-circuit, fail closed)
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          set +e
          docs_only=false
          reason=""
          case "$BASE" in
            ""|0000000000000000000000000000000000000000) reason="no base commit" ;;
          esac
          files=""
          if [ -z "$reason" ]; then
            files=$(curl -sS --fail-with-body \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/compare/$BASE...$HEAD" \
              | python3 -c 'import json,sys; d=json.load(sys.stdin); print("\n".join(f["filename"] for f in d.get("files") or []))')
            rc=$?
            if [ "$rc" -ne 0 ] || [ -z "$files" ]; then
              reason="cannot list the changed files"
            fi
          fi
          if [ -z "$reason" ]; then
            docs_only=true
            while IFS= read -r f; do
              case "$f" in
                docs/*|*.md) ;;
                *) docs_only=false; reason="non-doc change: $f"; break ;;
              esac
            done <<<"$files"
            [ "$docs_only" = true ] && reason="every changed file is documentation"
          fi
          echo "changed files:"
          display_files="${files:-(undetermined)}"
          printf '  %s\n' "${display_files//$'\n'/$'\n  '}"
          echo "docs_only=$docs_only ($reason)"
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
      # Bare compound up cannot pause between cluster creation and workload
      # pulls; wrap Docker's node creation, leaving kind and image pins intact.
      - name: Configure CI registry mirrors without a checkout
        if: steps.changes.outputs.docs_only != 'true'
        env:
          CI_MIRROR_REPO: ${{ github.repository }}
          CI_MIRROR_REF: ${{ github.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/ci-registry-bootstrap"
          curl -fsSL --retry 3 \
            "https://raw.githubusercontent.com/${CI_MIRROR_REPO}/${CI_MIRROR_REF}/scripts/ci/registry-mirrors.py" \
            -o "$RUNNER_TEMP/ci-registry-bootstrap/registry-mirrors.py"
          python3 "$RUNNER_TEMP/ci-registry-bootstrap/registry-mirrors.py" setup --wrap
      - uses: actions/setup-go@v5
        if: steps.changes.outputs.docs_only != 'true'
        with:
          go-version: '1.26.10'
      - name: Install kind
        if: steps.changes.outputs.docs_only != 'true'
        run: |
          curl -sSfLo kind https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64
          chmod +x kind && sudo mv kind /usr/local/bin/kind
      - name: Install kmx from the Go proxy at this commit — no clone
        if: steps.changes.outputs.docs_only != 'true'
        env:
          SHA: ${{ github.sha }}
        run: |
          mkdir -p "$HOME/journey"
          # The proxy may not have indexed the push yet. Retry, and say
          # which failure it was: "not yet published" and "does not build"
          # look identical if only the last attempt is reported.
          for attempt in 1 2 3 4 5 6; do
            if go install "github.com/kaimahi-agents/kaimahi/cmd/kmx@$SHA" 2>install.err; then
              published=1; break
            fi
            cat install.err
            echo "attempt $attempt: the proxy does not serve $SHA yet; waiting 30s"
            sleep 30
          done
          test -n "${published:-}" || { echo "go install never succeeded for $SHA"; exit 1; }
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: The binary is what a user gets, and knows nothing of a checkout
        if: steps.changes.outputs.docs_only != 'true'
        working-directory: /home/runner/journey
        run: |
          kmx version
          # Fail closed on the premise: if a checkout somehow exists at or
          # above this directory, the published binary's embedded native
          # assets would no longer be the only setup inputs.
          test ! -e ./go.mod && test ! -e /home/runner/go.mod && test ! -e /home/runner/k8s
      # The setup a reader is told to run, run verbatim: a bare `kmx cluster up` IS
      # the Orka runtime — kind, Ollama, the model, the pinned Orka release
      # with its Provider and its `orka-result-reader` account. Nothing here
      # installs Orka a second time, and nothing creates that account by
      # hand: the Task proof below reads its result through the account this
      # one command provisioned, which is the claim the docs make.
      - name: up — cluster, Ollama, the model and the pinned Orka runtime
        if: steps.changes.outputs.docs_only != 'true'
        working-directory: /home/runner/journey
        env:
          KIND_CLUSTER: kmx-clone-free
        run: kmx cluster up
      - name: create — native Orka Task returns an actual local-model answer
        if: steps.changes.outputs.docs_only != 'true'
        working-directory: /home/runner/journey
        run: |
          # Checkout-independent native workspace authoring and reviewed digest lift.
          mkdir -m 700 workspace evidence
          printf '%s\n' 'Answer briefly.' > instructions.txt
          kmx package create orka-hello --workspace workspace --model qwen2.5:3b --instructions instructions.txt
          printf '%s\n' 'id: example' 'input: "Reply with exactly this text: Orka says hello."' \
            'assertions:' '  - id: exact-answer' '    type: regex' "    pattern: '(?s)^Orka says hello[.]\n*$'" > workspace/eval/example.yaml
          kmx package test --workspace workspace --to-context kind-kmx-clone-free --to-namespace orka-system \
            --inference provider:local --out evidence/passing.json
          task=$(python3 - <<'PY'
          import json
          receipt = json.load(open("evidence/passing.json"))
          assert receipt["candidateCleanup"] == "complete"
          assert receipt["result"] == "pass" and len(receipt["cases"]) == 1
          assert receipt["cases"][0]["assertions"][0]["verdict"] == "pass"
          print(receipt["cases"][0]["taskName"])
          PY
          )
          remaining=$(kubectl --context kind-kmx-clone-free -n orka-system get tasks.core.orka.ai "$task" --ignore-not-found -o name)
          test -z "$remaining"
          kmx package push --workspace workspace --evaluation evidence/passing.json --to-layout layout hello:v1
          digest=$(python3 -c 'import json; print(json.load(open("layout/index.json"))["manifests"][0]["digest"])')
          kmx package deploy "hello@$digest" --from-layout layout --to-context kind-kmx-clone-free \
            --to-namespace orka-system --inference provider:local --evidence evidence/passing.json --promote
      - name: Cluster state on failure
        if: failure() && steps.changes.outputs.docs_only != 'true'
        run: |
          kubectl --context kind-kmx-clone-free get pods -A || true
          kubectl --context kind-kmx-clone-free -n orka-system get agents.core.orka.ai,tasks.core.orka.ai || true
      - name: Report registry pull endpoint evidence
        if: always() && steps.changes.outputs.docs_only != 'true'
        run: python3 "$RUNNER_TEMP/ci-registry-bootstrap/registry-mirrors.py" report
      - name: down
        if: always() && steps.changes.outputs.docs_only != 'true'
        run: kind delete cluster --name kmx-clone-free || true
      - name: Docs-only change — no cluster booted
        if: steps.changes.outputs.docs_only == 'true'
        run: echo "every changed file is documentation; the clone-free journey was not run"
