          curl -sSfLo "$archive" https://get.helm.sh/helm-v3.20.0-linux-amd64.tar.gz
          test "$(sha256sum "$archive" | cut -d' ' -f1)" = dbb4c8fc8e19d159d1a63dda8db655f9ffa4aac1b9a6b188b34a40957119b286
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          sudo install -m 0755 "$RUNNER_TEMP/linux-amd64/helm" /usr/local/bin/helm
          test "$(helm version --template '{{.Version}}')" = v3.20.0
      - name: Build kmx
        if: steps.changes.outputs.docs_only != 'true'
        run: |
          mkdir -p bin
          go build -o bin/kmx ./cmd/kmx
      - name: Create the dedicated cluster and install the external exact-version precondition
        if: steps.changes.outputs.docs_only != 'true'
        run: |
          set -euo pipefail
          kind create cluster --name kmx-kagent-create --wait 180s
          python3 "$GITHUB_WORKSPACE/scripts/ci/registry-mirrors.py" nodes --cluster "$KIND_CLUSTER"
          test "$(kubectl config current-context)" = kind-kmx-kagent-create
          charts="$RUNNER_TEMP/kagent-v0.10.2-charts"
          mkdir -p "$charts/crds" "$charts/runtime"
          helm pull oci://ghcr.io/kagent-dev/kagent/helm/kagent-crds@sha256:d487e679001b1a666e0ec97a0a87aab8a10bc1f52acba92b36b70c195492c7c3 --untar --untardir "$charts/crds"
          helm pull oci://ghcr.io/kagent-dev/kagent/helm/kagent@sha256:cd8a8fe8db81e193f8a82c4d20e9162781476d2a4c1795234d107e2743ec8366 --untar --untardir "$charts/runtime"
          crds_chart="$charts/crds/kagent-crds"
          runtime_chart="$charts/runtime/kagent"
          test "$(helm show chart "$crds_chart" | awk '/^name:/ {print $2}')" = kagent-crds
          test "$(helm show chart "$runtime_chart" | awk '/^name:/ {print $2}')" = kagent
          test "$(helm show chart "$crds_chart" | awk '/^version:/ {print $2}')" = 0.10.2
          test "$(helm show chart "$runtime_chart" | awk '/^version:/ {print $2}')" = 0.10.2
          helm install kagent-crds "$crds_chart" --namespace kagent --create-namespace --kube-context kind-kmx-kagent-create --set kmcp.enabled=false --wait --timeout 5m
          helm install kagent "$runtime_chart" --namespace kagent --kube-context kind-kmx-kagent-create --set kmcp.enabled=false --set kagent-tools.enabled=false --set k8s-agent.enabled=false --set kgateway-agent.enabled=false --set istio-agent.enabled=false --set promql-agent.enabled=false --set observability-agent.enabled=false --set argo-rollouts-agent.enabled=false --set helm-agent.enabled=false --set cilium-policy-agent.enabled=false --set cilium-manager-agent.enabled=false --set cilium-debug-agent.enabled=false --set grafana-mcp.enabled=false --set oauth2-proxy.enabled=false --set providers.default=ollama --set-string providers.ollama.config.host=http://unused.invalid:11434 --set ui.replicas=0 --wait --timeout 10m
          kubectl --context kind-kmx-kagent-create -n kagent rollout status deployment/kagent-controller --timeout=300s
          kubectl --context kind-kmx-kagent-create -n kagent rollout status deployment/kagent-postgresql --timeout=300s
      - name: Provision the model prerequisite and hardened deterministic fixture
        if: steps.changes.outputs.docs_only != 'true'
        run: |
          set -euo pipefail
          kubectl --context kind-kmx-kagent-create create namespace agents
          # This value has no hosted authority and is never printed or placed
          # in argv. The temporary file is private and removed after creation.
          dummy_file="$RUNNER_TEMP/model-key-value"
          umask 077
          openssl rand -hex 16 | tr -d '\n' > "$dummy_file"
          kubectl --context kind-kmx-kagent-create -n agents create secret generic model-key \
            --from-file=api-key="$dummy_file"
          rm -f "$dummy_file"
          kubectl --context kind-kmx-kagent-create -n agents apply -f - <<'YAML'
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: model
          data:
            server.py: |
              import json
              from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

              class Handler(BaseHTTPRequestHandler):
                  def do_POST(self):
                      length = int(self.headers.get("Content-Length", "0"))
                      try:
                          request = json.loads(self.rfile.read(length))
                      except (ValueError, UnicodeDecodeError):
                          self.send_error(400)
                          return
                      if self.path != "/v1/chat/completions" or not isinstance(request, dict):
                          self.send_error(404)
                          return
                      payload = {
                          "id": "chatcmpl-kmx-kagent-create",
                          "object": "chat.completion",
                          "created": 1,
                          "model": request.get("model", "fixture"),
                          "choices": [{
                              "index": 0,
                              "message": {"role": "assistant", "content": "Kagent says hello."},
                              "finish_reason": "stop",
                          }],
                          "usage": {"prompt_tokens": 4, "completion_tokens": 4, "total_tokens": 8},
                      }
                      body = json.dumps(payload, separators=(",", ":")).encode()
                      self.send_response(200)
                      self.send_header("Content-Type", "application/json")
                      self.send_header("Content-Length", str(len(body)))
                      self.end_headers()
                      self.wfile.write(body)

                  def log_message(self, fmt, *args):
                      print("model: " + (fmt % args), flush=True)

              ThreadingHTTPServer(("0.0.0.0", 9000), Handler).serve_forever()
          ---
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: model
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: model
            template:
              metadata:
                labels:
                  app: model
              spec:
                automountServiceAccountToken: false
                securityContext:
                  runAsNonRoot: true
                  runAsUser: 1000
                  runAsGroup: 1000
                  seccompProfile:
                    type: RuntimeDefault
                containers:
                  - name: model
                    image: python:3.13-alpine
                    command: [python3, -B, /app/server.py]
                    ports:
                      - name: http
                        containerPort: 9000
                    readinessProbe:
                      tcpSocket:
                        port: http
                      periodSeconds: 1
                    resources:
                      requests:
                        cpu: 10m
                        memory: 24Mi
                      limits:
                        cpu: 100m
                        memory: 48Mi
                    securityContext:
                      allowPrivilegeEscalation: false
                      readOnlyRootFilesystem: true
                      capabilities:
                        drop: [ALL]
                    volumeMounts:
                      - name: source
                        mountPath: /app
                        readOnly: true
                      - name: tmp
                        mountPath: /tmp
                volumes:
                  - name: source
                    configMap:
                      name: model
                  - name: tmp
                    emptyDir:
                      sizeLimit: 8Mi
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: model
          spec:
            selector:
              app: model
            ports:
              - name: http
                port: 9000
                targetPort: http
          YAML
          kubectl --context kind-kmx-kagent-create -n agents rollout status deployment/model --timeout=180s
      - name: KMX creates the exact-version Agent and gets the exact answer without installer tools
        if: steps.changes.outputs.docs_only != 'true'
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/kagent-create"
          mkdir -p "$fixture/fail-bin"
          kubectl_path=$(command -v kubectl)
          for tool in helm kagent; do
            printf '#!/bin/sh\necho "%s must not be invoked by kmx agent create" >&2\nexit 97\n' "$tool" > "$fixture/fail-bin/$tool"
            chmod +x "$fixture/fail-bin/$tool"
          done
          test "$(PATH="$fixture/fail-bin:$PATH" command -v helm)" = "$fixture/fail-bin/helm"
          test "$(PATH="$fixture/fail-bin:$PATH" command -v kagent)" = "$fixture/fail-bin/kagent"
          test -x "$kubectl_path"
          case "$kubectl_path" in /*) ;; *) echo "kubectl path is not absolute" >&2; exit 1 ;; esac
          ln -s "$kubectl_path" "$fixture/fail-bin/kubectl"
          artifact="$fixture/live-kagent.yaml"
          bundle="$fixture/bundle"
          PATH="$fixture/fail-bin:/usr/bin:/bin" KMX_TOOLCHAIN=off \
            "$GITHUB_WORKSPACE/bin/kmx" --context kind-kmx-kagent-create \
            agent create live-kagent --runtime kagent --namespace agents \
            --description 'Deterministic live Kagent create proof' \
            --provider-type openai --model fixture --secret model-key \
            --base-url http://model.agents.svc.cluster.local:9000/v1 \
            --task 'Reply with exactly: Kagent says hello.' \
            --out "$artifact" --bundle-path "$bundle" > "$fixture/answer.out"
          test "$(cat "$fixture/answer.out")" = 'Kagent says hello.'
          printf 'KAGENT_CREATE_ARTIFACT=%s\nKAGENT_CREATE_BUNDLE=%s\n' "$artifact" "$bundle" >> "$GITHUB_ENV"
      - name: Assert live identities, readiness, ownership, image and private receipt
        if: steps.changes.outputs.docs_only != 'true'
        run: |
          set -euo pipefail
          kubectl --context kind-kmx-kagent-create get --raw \
            /api/v1/namespaces/kagent/services/http:kagent-controller:8083/proxy/version \
            > "$RUNNER_TEMP/kagent-version.json"
          kubectl --context kind-kmx-kagent-create -n agents get modelconfigs.kagent.dev live-kagent -o json \
            > "$RUNNER_TEMP/live-model.json"
          kubectl --context kind-kmx-kagent-create -n agents get agents.kagent.dev live-kagent -o json \
            > "$RUNNER_TEMP/live-agent.json"
          kubectl --context kind-kmx-kagent-create -n agents get deployment live-kagent -o json \
            > "$RUNNER_TEMP/live-deployment.json"
          kubectl --context kind-kmx-kagent-create -n agents get service live-kagent -o json \
            > "$RUNNER_TEMP/live-service.json"
          kubectl --context kind-kmx-kagent-create -n agents get pods -l kagent=live-kagent -o json \
            > "$RUNNER_TEMP/live-pods.json"
          kubectl --context kind-kmx-kagent-create get namespace kube-system -o json \
            > "$RUNNER_TEMP/kube-system.json"
          python3 - "$KAGENT_CREATE_ARTIFACT" "$KAGENT_CREATE_BUNDLE" \
            "$RUNNER_TEMP/kagent-version.json" "$RUNNER_TEMP/live-model.json" \
            "$RUNNER_TEMP/live-agent.json" "$RUNNER_TEMP/live-deployment.json" \
            "$RUNNER_TEMP/live-service.json" "$RUNNER_TEMP/live-pods.json" \
            "$RUNNER_TEMP/kube-system.json" <<'PY'
          import glob, json, os, pathlib, re, stat, sys

          artifact, bundle, version_path, model_path, agent_path, deploy_path, service_path, pods_path, namespace_path = sys.argv[1:]
          version = json.load(open(version_path))
          assert version.get("kagent_version") == "0.10.2", version
          assert version.get("git_commit") == "68df64f", version
          assert len(version.get("git_commit", "")) == 7, version

          model = json.load(open(model_path))
          agent = json.load(open(agent_path))
          deployment = json.load(open(deploy_path))
          service = json.load(open(service_path))

          def current(obj, required):
              generation = obj["metadata"]["generation"]
              assert obj.get("status", {}).get("observedGeneration") == generation, obj.get("status")
              conditions = obj.get("status", {}).get("conditions", [])
              for condition_type in required:
                  matches = [c for c in conditions if c.get("type") == condition_type and c.get("status") == "True"]
                  assert len(matches) == 1, (condition_type, conditions)
                  observed = matches[0].get("observedGeneration", 0)
                  assert observed == generation or obj["kind"] == "ModelConfig" and observed == 0, matches[0]

          current(model, ["Accepted"])
          current(agent, ["Accepted", "Ready"])
          ready = [c for c in agent["status"]["conditions"] if c.get("type") == "Ready"]
          assert ready[0].get("reason") == "DeploymentReady", ready
          agent_uid = agent["metadata"]["uid"]
          for child in (deployment, service):
              owners = [o for o in child["metadata"].get("ownerReferences", []) if o.get("controller") is True]
              assert len(owners) == 1, owners
              assert (owners[0].get("apiVersion"), owners[0].get("kind"), owners[0].get("name"), owners[0].get("uid")) == (
                  "kagent.dev/v1alpha2", "Agent", "live-kagent", agent_uid
              ), owners
          containers = deployment["spec"]["template"]["spec"]["containers"]
          runtime = [c for c in containers if c.get("name") == "kagent"]
          assert len(runtime) == 1 and runtime[0].get("image") == "ghcr.io/kagent-dev/kagent/golang-adk:0.10.2", runtime
          pods = json.load(open(pods_path))["items"]
          assert len(pods) == 1, pods
          statuses = [s for s in pods[0]["status"]["containerStatuses"] if s.get("name") == "kagent"]
          assert len(statuses) == 1 and statuses[0].get("ready") is True, statuses
          accepted_go_digests = {
              "c1ae7865e4c4ed1d4708bbcc04ea952c54c3014a3da3178427bf31922d0956dd",  # index
              "922dd44552c55cad46c9e38c9d56b1138a682114e665e89b60caebde8f1952f6",  # amd64
              "0b8e0c9b04304240efab0bee39d943240cd88f852760af01b8da25b23e4c6245",  # arm64
          }
          image_id = statuses[0].get("imageID", "")
          if "://" in image_id:
              image_id = image_id.split("://", 1)[1]
          repository = "kagent-dev/kagent/golang-adk"
          for prefix in (repository + "@", "ghcr.io/" + repository + "@"):
              if image_id.startswith(prefix):
                  image_id = image_id.removeprefix(prefix)
                  break
          else:
              assert image_id.startswith("sha256:"), statuses
          image_digests = image_id.split("@")
          assert image_digests and all(re.fullmatch(r"sha256:[0-9a-f]{64}", value)
                                       for value in image_digests), statuses
          assert all(value.removeprefix("sha256:") in accepted_go_digests
                     for value in image_digests), (image_digests, statuses)

          marker_names = {"kaimahi.dev/bundle", "kaimahi.dev/portable-digest", "kaimahi.dev/rendered-digest"}
          artifact_text = pathlib.Path(artifact).read_text()
          assert not any(name in artifact_text for name in marker_names), "review artifact carries ownership markers"
          assert "Kagent says hello." not in artifact_text, "review artifact carries the answer"
          assert "Reply with exactly: Kagent says hello." not in artifact_text, "review artifact carries the task prompt"
          for obj in (model, agent):
              annotations = obj["metadata"].get("annotations", {})
              assert all(annotations.get(name) for name in marker_names), annotations

          receipts = glob.glob(os.path.join(bundle, "receipts", "create-*.json"))
          assert len(receipts) == 1, receipts
          receipt_path = receipts[0]
          receipt = json.load(open(receipt_path))
          assert receipt.get("kind") == "KagentCreateReceipt", receipt
          cluster_uid = json.load(open(namespace_path))["metadata"]["uid"]
          assert receipt["clusterUID"] == cluster_uid, receipt
          assert receipt["agentRef"]["Runtime"] == "kagent" and receipt["agentRef"]["UID"] == agent_uid, receipt
          assert receipt["deploy"]["Target"]["Runtime"] == "kagent", receipt
          resources = receipt["deploy"]["Resources"]
          expected = {"ModelConfig": model["metadata"]["uid"], "Agent": agent_uid}
          assert len(resources) == 2 and {r["Kind"]: r["UID"] for r in resources} == expected, resources
          receipt_text = pathlib.Path(receipt_path).read_text()
          assert "Reply with exactly: Kagent says hello." not in receipt_text, receipt_text
          assert "Kagent says hello." not in receipt_text, receipt_text
          assert "Deterministic live Kagent create proof" not in receipt_text, receipt_text
          assert stat.S_IMODE(os.stat(receipt_path).st_mode) == 0o600, oct(stat.S_IMODE(os.stat(receipt_path).st_mode))
          print("exact controller, current conditions, Agent-owned workload, official Go image, marker split and private receipt proved")
          PY
      - name: Cluster state on failure
        if: failure() && steps.changes.outputs.docs_only != 'true'
        run: |
          kubectl --context kind-kmx-kagent-create get pods -A -o wide || true
          kubectl --context kind-kmx-kagent-create -n kagent get deploy,svc,pods,pvc -o wide || true
          kubectl --context kind-kmx-kagent-create -n kagent logs deployment/kagent-controller --tail=120 || true
          kubectl --context kind-kmx-kagent-create -n kagent logs deployment/kagent-postgresql --tail=80 || true
          kubectl --context kind-kmx-kagent-create -n agents get modelconfigs.kagent.dev,agents.kagent.dev,deploy,svc,pods -o wide || true
          kubectl --context kind-kmx-kagent-create -n agents get events --sort-by=.lastTimestamp || true
          kubectl --context kind-kmx-kagent-create -n agents logs deployment/model --tail=80 || true
          kubectl --context kind-kmx-kagent-create -n agents logs deployment/live-kagent --tail=120 || true
      - name: Report registry pull endpoint evidence
        if: always() && steps.changes.outputs.docs_only != 'true'
        run: python3 "$GITHUB_WORKSPACE/scripts/ci/registry-mirrors.py" report
      - name: Delete only the dedicated Kagent create cluster
        if: always() && steps.changes.outputs.docs_only != 'true'
        run: kind delete cluster --name kmx-kagent-create || true
      - name: Docs-only short-circuit
        id: docs-only-summary
        if: steps.changes.outputs.docs_only == 'true'
        run: echo "every changed file is documentation; no cluster booted"
  # The Orka runtime, proved on every pull request and without the legacy
  # runtime.
  #
  # This is a SEPARATE boundary from the shards above, and it is additive:
  # nothing here installs, reads or asserts the legacy runtime, and nothing
  # above changes. Two claims are made, and they are deliberately kept
  # apart because they can fail independently:
  #
  #   1. Orka executes. A pinned install, a keyless Provider, an Agent and a
  #      Task that returns an exact, non-empty answer from a local model.
  #   2. The native Orka HTTP Tool's boundary holds. The Tool object is
  #      admitted by Orka's own CRD, its endpoint returns a live ConfigMap
  #      listing, and both its own validation and the cluster's RBAC refuse
  #      Secrets and every pod mutation.
  #
  # What is NOT claimed: that the 3B model chose to call the tool. Tool
  # SELECTION by a small local model is the repository's known CI flake
  # class 2, so this shard proves the tool's boundary directly over HTTP and
  # leaves model-driven invocation unasserted rather than asserting it
  # flakily. It also claims nothing about governance: Orka traffic is not on
  # the plane seam here, and no step pretends otherwise.
  e2e-orka-runtime:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KIND_CLUSTER: kmx-orka
      KUBE_CTX: kind-kmx-orka
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Classify the change (docs-only short-circuit, fail closed)
        id: changes
        uses: ./.github/actions/classify-change
      - name: Install kind
        if: steps.changes.outputs.docs_only != 'true'
        run: |
          curl -sSfLo kind https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64
          chmod +x kind && sudo mv kind /usr/local/bin/kind
      - uses: actions/setup-go@v5
        if: steps.changes.outputs.docs_only != 'true'
        with:
          go-version-file: go.mod
      - name: Build kmx
        if: steps.changes.outputs.docs_only != 'true'
        run: |
          mkdir -p bin
          go build -o bin/kmx ./cmd/kmx
      - name: Configure CI registry mirrors
        if: steps.changes.outputs.docs_only != 'true'
        run: python3 "$GITHUB_WORKSPACE/scripts/ci/registry-mirrors.py" setup
      # Component steps only. `kmx orka install` is the command under test
      # here, and the next step runs it with its digest verification and its
      # Provider's readiness asserted — a bare `kmx up` would have installed
      # Orka already, and that step would then be asserting about somebody
      # else's work. The other half of this shard's point is what the Orka
      # path does NOT install: no legacy namespace or harness wrapper.
      - name: Cluster, Ollama and the model — no legacy runtime
        if: steps.changes.outputs.docs_only != 'true'
        run: |
          set -euo pipefail
          if kind get clusters | grep -qx kmx-orka; then
            echo 'refusing to reuse or delete an existing kind cluster'; exit 1
          fi
          bin/kmx up --step cluster
          echo 'KMX_ORKA_RUNTIME_CREATED=1' >> "$GITHUB_ENV"
          python3 "$GITHUB_WORKSPACE/scripts/ci/registry-mirrors.py" nodes --cluster "$KIND_CLUSTER"
          bin/kmx up --step ollama
          bin/kmx up --step model
          # Fail closed on the premise. If a later edit made any of the three
          # steps above pull in the legacy runtime, every Orka claim below
          # would still pass while proving something else entirely.
          if kubectl --context kind-kmx-orka get namespace kagent >/dev/null 2>&1; then
            echo "the Orka shard created the legacy runtime's namespace; it is not proving an Orka-only path"
            exit 1
          fi
      - name: Orka — install the pinned release and its keyless Provider
        if: steps.changes.outputs.docs_only != 'true'
        run: |
          set -euo pipefail
          bin/kmx orka install 2>&1 | tee orka-install.out
          # The digest pin is the point of the command, so require that it
          # was actually verified rather than that the command exited 0.
          grep -q 'Installer verified:' orka-install.out
          kubectl --context kind-kmx-orka -n orka-system rollout status deploy/orka-api-controller --timeout=300s
          # A Provider that is not Ready resolves no model, and an Agent
          # bound to it would fail later with a much less legible message.
          for _ in $(seq 1 60); do
            ready=$(kubectl --context kind-kmx-orka -n orka-system get providers.core.orka.ai local \
              -o jsonpath='{.status.ready}' 2>/dev/null || true)
            [ "$ready" = true ] && break
            sleep 5
          done
          test "${ready:-}" = true || {
            echo "Provider local never became Ready; a model call would be refused"
            exit 1
          }
      # `kmx orka install` provisions the Task result account. Prove the
      # installed grant is Task-get only; do not hand-create its resources.
      - name: Orka — verify the installed Task result account
        if: steps.changes.outputs.docs_only != 'true'
        run: |
          set -euo pipefail
          kubectl --context kind-kmx-orka -n orka-system get serviceaccount orka-result-reader >/dev/null
          role=$(kubectl --context kind-kmx-orka -n orka-system get role orka-result-reader -o json)
          python3 - "$role" <<'PY'
          import json, sys
          rules = json.loads(sys.argv[1])["rules"]
          assert rules == [{"apiGroups": ["core.orka.ai"], "resources": ["tasks"], "verbs": ["get"]}], "unexpected result-reader grant"
          PY
          binding=$(kubectl --context kind-kmx-orka -n orka-system get rolebinding orka-result-reader -o json)
          python3 - "$binding" <<'PY'
          import json, sys
          binding = json.loads(sys.argv[1])
          assert binding["roleRef"]["kind"] == "Role" and binding["roleRef"]["name"] == "orka-result-reader", "unexpected bound role"
          assert binding["subjects"] == [{"kind": "ServiceAccount", "name": "orka-result-reader", "namespace": "orka-system"}], "unexpected result-reader subject"
          PY
      # Exercise the same installer called by console Prepare, not a raw
      # manifest substitute. The opt-in test pins a dedicated kind context.
      - name: Native Orka Tool — install through the shared Prepare method
        if: steps.changes.outputs.docs_only != 'true'
        run: |
          set -euo pipefail
          KMX_LIVE_KIND_CONTEXT=kind-kmx-orka go test ./internal/kmx/app \
            -run '^TestLiveInstallQuickstartK8sTool$' -count=1
          sum=$(sha256sum scripts/orka-k8s-tool.py | cut -d' ' -f1)
          # Admitted by ORKA's own CRD, not merely by the API server: a Tool
          # this cluster's Orka would reject is not a native Orka Tool.
          url=$(kubectl --context kind-kmx-orka -n orka-system get tools.core.orka.ai k8s-get-resources \
            -o jsonpath='{.spec.http.url}')
          test "$url" = https://1.1.1.1/resources
          kubectl --context kind-kmx-orka -n orka-system get rolebinding kmx-k8s-tool-policy-reader -o json | python3 -c '
          import json, sys
          b = json.load(sys.stdin)
          assert b["subjects"] == [{"kind":"ServiceAccount","name":"orka-api-ai-worker","namespace":"orka-system"}], "wrong policy reader subject"
          assert b["roleRef"]["name"] == "kmx-k8s-tool-policy-reader", "wrong policy reader role"
          '
          # The chart worker needs this named policy for gateway approval
          # binding; it must not acquire general policy reads.
          test "$(kubectl --context kind-kmx-orka -n orka-system auth can-i get outboundaccesspolicies.core.orka.ai/kmx-k8s-tool-gateway --as=system:serviceaccount:orka-system:orka-api-ai-worker)" = yes
          test "$(kubectl --context kind-kmx-orka -n orka-system auth can-i get outboundaccesspolicies.core.orka.ai/unrelated --as=system:serviceaccount:orka-system:orka-api-ai-worker)" = no
          policy=$(kubectl --context kind-kmx-orka -n orka-system get tools.core.orka.ai k8s-get-resources \
            -o jsonpath='{.spec.http.outboundAccessPolicyRef.name}')
          test "$policy" = kmx-k8s-tool-gateway
          # The running pod is the committed code, stated rather than assumed.
          annotated=$(kubectl --context kind-kmx-orka -n orka-system get deploy kmx-k8s-tool \
            -o jsonpath='{.spec.template.metadata.annotations.kaimahi\.dev/tool-code}')
          test "$annotated" = "$sum"
          # Both resources must be ready for the generations read in this
          # loop; stale conditions from an earlier spec do not establish it.
          for resource_and_condition in \
            "outboundaccesspolicies.core.orka.ai/kmx-k8s-tool-gateway Accepted" \
            "tools.core.orka.ai/k8s-get-resources Available"; do
            read -r resource condition <<<"$resource_and_condition"
            current=
            for _ in $(seq 1 60); do
              object=$(kubectl --context kind-kmx-orka -n orka-system get "$resource" -o json)
              current=$(python3 -c '
          import json, sys
          obj, condition = json.load(sys.stdin), sys.argv[1]
          generation = obj["metadata"]["generation"]
          print(any(c.get("type") == condition and c.get("status") == "True"
                    and c.get("observedGeneration") == generation
                    for c in obj.get("status", {}).get("conditions", [])))
          ' "$condition" <<<"$object")
              [ "$current" = True ] && break
              sleep 2
            done
            test "$current" = True || { echo "$resource never reached $condition for the current generation"; exit 1; }
          done
      # The public URL is only a logical authority. A missing policy must
      # make the current Tool generation unavailable; it must never turn
      # example.com into the physical fallback destination.
      - name: Native Orka Tool — missing gateway fails closed
        if: steps.changes.outputs.docs_only != 'true'
        run: |
          set -euo pipefail
          kubectl --context kind-kmx-orka -n orka-system patch tools.core.orka.ai k8s-get-resources \
            --type=merge -p '{"spec":{"http":{"outboundAccessPolicyRef":{"name":"missing-gateway"}}}}'
          generation=$(kubectl --context kind-kmx-orka -n orka-system get tools.core.orka.ai k8s-get-resources \
            -o jsonpath='{.metadata.generation}')
          failed=
          for _ in $(seq 1 60); do
            object=$(kubectl --context kind-kmx-orka -n orka-system get tools.core.orka.ai k8s-get-resources -o json)
            failed=$(python3 -c '
          import json, sys
          obj, generation = json.load(sys.stdin), int(sys.argv[1])
          unavailable = any(c.get("type") == "Available" and c.get("status") == "False"
                            and c.get("observedGeneration") == generation
                            for c in obj.get("status", {}).get("conditions", []))
          error = obj.get("status", {}).get("error", "")
          print(unavailable and "referenced outbound access policy \"missing-gateway\" not found" in error)
          ' "$generation" <<<"$object")
            [ "$failed" = True ] && break
            sleep 2
          done
          test "$failed" = True || { echo 'Tool did not reject the missing gateway'; exit 1; }
          # Restore the only policy kmx manages and require the restored
          # generation before any Task is allowed to use the Tool.
          kubectl --context kind-kmx-orka -n orka-system patch tools.core.orka.ai k8s-get-resources \
            --type=merge -p '{"spec":{"http":{"outboundAccessPolicyRef":{"name":"kmx-k8s-tool-gateway"}}}}'
          generation=$(kubectl --context kind-kmx-orka -n orka-system get tools.core.orka.ai k8s-get-resources \
            -o jsonpath='{.metadata.generation}')
          restored=
          for _ in $(seq 1 60); do
            status=$(kubectl --context kind-kmx-orka -n orka-system get tools.core.orka.ai k8s-get-resources \
              -o jsonpath='{.status.conditions[?(@.type=="Available")].status}:{.status.conditions[?(@.type=="Available")].observedGeneration}')
            [ "$status" = "True:$generation" ] && { restored=1; break; }
            sleep 2
          done
          test -n "$restored" || { echo 'Tool did not regain current-generation Available'; exit 1; }
      - name: Orka — fail closed on legacy runtime state
        if: steps.changes.outputs.docs_only != 'true'
        run: |
          set -euo pipefail
          if kubectl --context kind-kmx-orka get namespace kagent >/dev/null 2>&1; then
            echo "the Orka shard created the legacy runtime's namespace"
            exit 1
          fi
          # The installed chart is the only release, with the harness-v2
          # controller and kmx ownership settings (not the old wrapper).
          releases=$(helm --kube-context kind-kmx-orka list --all-namespaces --short)
          test "$releases" = orka || { echo "unexpected Helm releases: $releases"; exit 1; }
          helm --kube-context kind-kmx-orka -n orka-system get values orka -o json | python3 -c '
          import json, sys
          v = json.load(sys.stdin)
          assert v["controller"]["mode"] == "harness-v2", v
          assert v["fullnameOverride"] == "orka-api", v
          assert v["labels"]["kmx.kaimahi.ai/installed"] == "true", v
          '
          if kubectl --context kind-kmx-orka -n orka-system get deploy orka-agent-harness-wrapper --ignore-not-found -o name | grep -q .; then
            echo "the harness wrapper was installed instead of harness-v2"; exit 1
          fi
      # The allowed half. An unguessable name is created first, so a listing
      # that contains it can only have come from a live read through the
      # tool — not from a fixture, a cache or a plausible reply.
      - name: Native Orka Tool — allowed ConfigMap listing is a live read
        if: steps.changes.outputs.docs_only != 'true'
        run: |
          set -euo pipefail
          marker="probe-$(head -c 8 /dev/urandom | od -An -tx1 | tr -d ' \n')"
          kubectl --context kind-kmx-orka -n orka-system create configmap "$marker" --from-literal=probe=1 >/dev/null
          # --address pins IPv4: kubectl's default `localhost` can bind the
          # v6 side only while curl talks to 127.0.0.1. The forward's own
          # output is kept and printed on failure, and the trap stops it
          # outliving this step — a background kubectl is not reaped when a
          # step ends, and the port is reused below.
          kubectl --context kind-kmx-orka -n orka-system port-forward --address 127.0.0.1 \
            svc/kmx-k8s-tool 18080:8080 >tool-forward.log 2>&1 &
          pf=$!
          trap 'kill "$pf" 2>/dev/null || true' EXIT
          ready=
          for _ in $(seq 1 150); do
            if curl -fsS --max-time 2 -o /dev/null http://127.0.0.1:18080/healthz 2>/dev/null; then ready=1; break; fi
            sleep 0.2
          done
          test -n "$ready" || { echo 'the tool never answered on 127.0.0.1:18080'; exit 1; }
          curl -fsS --max-time 30 -X POST http://127.0.0.1:18080/resources \
            -H 'Content-Type: application/json' \
            -d '{"resource":"configmaps","namespace":"orka-system"}' -o tool-allowed.out
          python3 - "$marker" <<'EOF'
          import json, sys
          marker = sys.argv[1]
          body = json.load(open("tool-allowed.out"))
          names = [i["name"] for i in body["items"]]
          assert body["resource"] == "configmaps", "unexpected Tool resource"
          assert marker in names, "live ConfigMap marker absent from the read-only listing"
          # A projection, never contents: a ConfigMap's data must not come
          # back through a tool a model can call.
          assert all(set(i) <= {"name", "namespace", "phase", "readyReplicas",
                                "replicas", "succeeded", "failed"} for i in body["items"]), "Tool returned unexpected fields"
          print("live ConfigMap marker present in read-only listing")
          EOF
      # The denied half, asserted at BOTH boundaries, because either one
      # alone is a single point of silent failure: the server's own
      # validation (which a widened allowlist would remove) and the
      # cluster's RBAC (which a widened ClusterRole would remove).
      - name: Native Orka Tool — Secrets and pod mutation are refused
        if: steps.changes.outputs.docs_only != 'true'
        run: |
          set -euo pipefail
          kubectl --context kind-kmx-orka -n orka-system port-forward --address 127.0.0.1 \
            svc/kmx-k8s-tool 18080:8080 >tool-forward-deny.log 2>&1 &
          pf=$!
          trap 'kill "$pf" 2>/dev/null || true' EXIT
          ready=
          for _ in $(seq 1 150); do
            if curl -fsS --max-time 2 -o /dev/null http://127.0.0.1:18080/healthz 2>/dev/null; then ready=1; break; fi
            sleep 0.2
          done
          test -n "$ready" || { echo 'the tool never answered'; exit 1; }
          for body in '{"resource":"secrets"}' '{"resource":"secrets","namespace":"orka-system"}' '{"resource":"pods","verb":"delete"}'; do
            code=$(curl -s -o deny.out -w '%{http_code}' --max-time 30 -X POST \
              http://127.0.0.1:18080/resources -H 'Content-Type: application/json' -d "$body")
            test "$code" = 400 || { echo "tool refused with unexpected HTTP $code"; exit 1; }
            grep -q 'Invalid resource request' deny.out
          done
          # And the authority the tool holds even if its validation were
          # bypassed. `! cmd` is exempt from errexit, so can-i's answer is
          # compared explicitly — each check aborts the step on a wrong one.
          sa=system:serviceaccount:orka-system:kmx-k8s-reader
          for denied in "get secrets" "list secrets" "create pods" "delete pods" \
                        "update pods" "patch pods" "patch configmaps"; do
            # Split the verb/resource pair for kubectl auth can-i.
            # shellcheck disable=SC2086
            got=$(kubectl --context kind-kmx-orka auth can-i $denied -n orka-system --as="$sa" || true)
            test "$got" = no || { echo "the tool account may $denied"; exit 1; }
          done
          # The positive control: a denial list that refused everything would
          # pass the seven checks above and prove nothing. Scoped to
          # orka-system to match the namespace the live request above hits.
          kubectl --context kind-kmx-orka auth can-i list configmaps -n orka-system --as="$sa"
      # The fixture requires a per-run Deployment from the Tool's response,
      # not a name in its source or prompt. Zero replicas create no image pulls.
      # Task evidence comes from Orka's authorized event API, never worker logs
      # or an answer printed to CI. This tests routing, not model selection.
      - name: Native Orka Tool — Task invokes read-only health Tool
        if: steps.changes.outputs.docs_only != 'true'
        run: |
          set -euo pipefail
          health_marker="health-$(head -c 8 /dev/urandom | od -An -tx1 | tr -d ' \n')"
          kubectl --context kind-kmx-orka -n orka-system create deployment "$health_marker" \
            --image=registry.k8s.io/pause:3.10 --replicas=0 >/dev/null
          kubectl --context kind-kmx-orka -n orka-system create configmap orka-tool-model \
            --from-file=server.py=scripts/ci/orka-tool-model.py
          kubectl --context kind-kmx-orka apply -f scripts/ci/orka-tool-model.yaml
          kubectl --context kind-kmx-orka -n orka-system set env deployment/orka-tool-model \
            ORKA_HEALTH_DEPLOYMENT_MARKER="$health_marker" >/dev/null
          kubectl --context kind-kmx-orka -n orka-system rollout status deploy/orka-tool-model --timeout=180s
          bin/kmx --context kind-kmx-orka agent create orka-tool-proof \
            --namespace orka-system --provider-type openai --model tool-fixture \
            --secret local-provider-key \
            --base-url http://orka-tool-model.orka-system.svc.cluster.local:8080/v1 \
            --tools k8s-get-resources \
            --task 'Check deployment health in orka-system using k8s-get-resources.' \
            --result-service-account orka-result-reader \
            --out /tmp/orka-tool-agent.yaml --bundle-path /tmp/orka-tool-bundle \
            >/dev/null 2>/dev/null || { echo 'health Task failed (answer and worker output suppressed)'; exit 1; }
          task=$(kubectl --context kind-kmx-orka -n orka-system get tasks.core.orka.ai -o json | \
            python3 -c 'import json,sys; items=json.load(sys.stdin)["items"]; matches=[i for i in items if i.get("spec",{}).get("agentRef",{}).get("name")=="orka-tool-proof"]; assert len(matches)==1, "expected one Task for health proof"; print(matches[0]["metadata"]["name"])')
          test "$(kubectl --context kind-kmx-orka -n orka-system get task "$task" -o jsonpath='{.status.phase}')" = Succeeded || { echo 'health Task did not succeed'; exit 1; }
          KMX_LIVE_KIND_CONTEXT=kind-kmx-orka KMX_LIVE_TASK_NAME="$task" \
            go test ./internal/kmx/app -run '^TestLiveInspectQuickstartToolEvents$' -count=1 -v
      # Provider → Agent → Task, and a REAL answer. The prompt is
      # deterministic and the comparison is exact: "a non-empty reply" would
      # pass on an error string, and a 3B model asked an open question is
      # the repository's CI flake class 2.
      - name: Orka — Agent and Task return an exact local-model answer
        if: steps.changes.outputs.docs_only != 'true'
        run: |
          set -euo pipefail
          # Reuse the installer's Secret; never invent a Provider key here.
          bin/kmx --context kind-kmx-orka agent create orka-hello \
            --namespace orka-system --provider-type openai --model qwen2.5:3b \
            --secret local-provider-key \
            --base-url http://ollama.ollama.svc.cluster.local:11434/v1 \
            --task 'Reply with exactly this text: Orka says hello.' \
            --result-service-account orka-result-reader > orka-answer.out
          test -f agents/orka-hello.yaml
          test "$(cat orka-answer.out)" = 'Orka says hello.'
          # The Task really ran and really succeeded, read from the cluster
          # rather than from the command's own stdout.
          phase=$(kubectl --context kind-kmx-orka -n orka-system get tasks.core.orka.ai -o json | \
            python3 -c 'import json,sys; items=json.load(sys.stdin)["items"]; matches=[i for i in items if i.get("spec",{}).get("agentRef",{}).get("name")=="orka-hello"]; assert len(matches)==1, matches; print(matches[0].get("status",{}).get("phase",""))')
          test "$phase" = Succeeded
      - name: Cluster state on failure
        if: failure() && steps.changes.outputs.docs_only != 'true'
        run: |
          if [ "${KMX_ORKA_RUNTIME_CREATED:-}" = 1 ]; then
            kubectl --context kind-kmx-orka get pods -A || true
            kubectl --context kind-kmx-orka -n orka-system get providers.core.orka.ai,agents.core.orka.ai,tasks.core.orka.ai,tools.core.orka.ai -o wide || true
            for deployment in orka-api-controller kmx-k8s-tool; do
              kubectl --context kind-kmx-orka -n orka-system logs "deploy/$deployment" --tail=100 2>/dev/null | python3 -c '
          import sys
          lines = sys.stdin.read().lower().splitlines()
          print(sys.argv[1], "log summary: lines=", len(lines), "errors=", sum("error" in line for line in lines))
          ' "$deployment" || true
            done
            kubectl --context kind-kmx-orka -n orka-system get tasks.core.orka.ai -o json | python3 -c 'import json,sys; print("Task phases:", [t.get("status",{}).get("phase","unknown") for t in json.load(sys.stdin).get("items",[])])' || true
            kubectl --context kind-kmx-orka -n orka-system get tools.core.orka.ai k8s-get-resources -o json | python3 -c 'import json,sys; print("Tool conditions:",[(c.get("type"),c.get("status")) for c in json.load(sys.stdin).get("status",{}).get("conditions",[])])' || true
          fi
      - name: Report registry pull endpoint evidence
        if: always() && steps.changes.outputs.docs_only != 'true'
        run: python3 "$GITHUB_WORKSPACE/scripts/ci/registry-mirrors.py" report
      - name: down
        if: always() && steps.changes.outputs.docs_only != 'true'
        run: |
          if [ "${KMX_ORKA_RUNTIME_CREATED:-}" = 1 ]; then kind delete cluster --name kmx-orka; fi
      - name: Docs-only short-circuit
        id: docs-only-summary
        if: steps.changes.outputs.docs_only == 'true'
        run: echo "every changed file is documentation; no cluster booted"
  # Independent stock Helm release: no kmx fullnameOverride or owner marker.
  # It uses the same production Prepare installer and authorized Task-event probe.
  e2e-orka-helm:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Classify the change (docs-only short-circuit, fail closed)
        id: changes
        uses: ./.github/actions/classify-change
      - name: Install kind
        if: steps.changes.outputs.docs_only != 'true'
        run: |
          curl -fsSLo kind https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64
          chmod +x kind && sudo mv kind /usr/local/bin/kind
      - uses: actions/setup-go@v5
        if: steps.changes.outputs.docs_only != 'true'
        with:
          go-version-file: go.mod
      - name: Configure CI registry mirrors
        if: steps.changes.outputs.docs_only != 'true'
        run: python3 "$GITHUB_WORKSPACE/scripts/ci/registry-mirrors.py" setup
      - name: Create only the dedicated Helm cluster
        if: steps.changes.outputs.docs_only != 'true'
        run: |
          set -euo pipefail
          if kind get clusters | grep -qx helm-release-orka; then
            echo 'refusing to reuse or delete an existing kind cluster'; exit 1
          fi
          kind create cluster --name helm-release-orka --wait 90s
          echo 'KMX_ORKA_HELM_CREATED=1' >> "$GITHUB_ENV"
          python3 "$GITHUB_WORKSPACE/scripts/ci/registry-mirrors.py" nodes --cluster helm-release-orka
      - name: Install SHA-256 verified stock Orka harness-v2 chart
        if: steps.changes.outputs.docs_only != 'true'
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://github.com/orka-agents/orka/releases/download/v0.2.0/orka-0.2.0.tgz -o /tmp/orka-helm-0.2.0.tgz
          printf '%s  %s\n' 'b7596c4e35d7189a3b2cf25921cd50e6c31328dbb83bdee50e20c757e0f03b79' /tmp/orka-helm-0.2.0.tgz | sha256sum -c -
          mkdir -p /tmp/orka-helm-chart
          tar -xzf /tmp/orka-helm-0.2.0.tgz -C /tmp/orka-helm-chart orka/crds
          kubectl --context kind-helm-release-orka apply -f /tmp/orka-helm-chart/orka/crds/ >/dev/null
          kubectl --context kind-helm-release-orka wait --for=condition=Established --timeout=120s -f /tmp/orka-helm-chart/orka/crds/ >/dev/null
          helm --kube-context kind-helm-release-orka install orka /tmp/orka-helm-0.2.0.tgz -n orka-system \
            --create-namespace --wait --timeout 10m --set controller.mode=harness-v2 >/dev/null 2>/dev/null || {
              echo 'stock Orka Helm install failed (chart output suppressed)'; exit 1;
            }
          helm --kube-context kind-helm-release-orka -n orka-system get values orka -o json | python3 -c '
          import json, sys
          v = json.load(sys.stdin)
          assert v["controller"]["mode"] == "harness-v2", "unexpected controller mode"
          assert not v.get("fullnameOverride"), "stock release has fullnameOverride"
          '
          kubectl --context kind-helm-release-orka -n orka-system rollout status deploy/orka-controller --timeout=180s >/dev/null
      - name: Prepare the stock Tool and scoped result access through kmx methods
        if: steps.changes.outputs.docs_only != 'true'
        run: |
          set -euo pipefail
          KMX_LIVE_KIND_CONTEXT=kind-helm-release-orka go test ./internal/kmx/app \
            -run '^TestLiveProvisionOrkaResultReader$' -count=1
          KMX_LIVE_KIND_CONTEXT=kind-helm-release-orka go test ./internal/kmx/app \
            -run '^TestLiveInstallQuickstartK8sTool$' -count=1
          kubectl --context kind-helm-release-orka -n orka-system get rolebinding kmx-k8s-tool-policy-reader -o json | python3 -c '
          import json, sys
          b = json.load(sys.stdin)
          assert b["subjects"] == [{"kind":"ServiceAccount","name":"orka-ai-worker","namespace":"orka-system"}], "wrong stock AI worker grant"
          assert b["roleRef"]["name"] == "kmx-k8s-tool-policy-reader", "wrong reader Role"
          '
          kubectl --context kind-helm-release-orka -n orka-system get role kmx-k8s-tool-policy-reader -o json | python3 -c '
          import json, sys
          assert json.load(sys.stdin)["rules"] == [{"apiGroups":["core.orka.ai"],"resources":["outboundaccesspolicies"],"resourceNames":["kmx-k8s-tool-gateway"],"verbs":["get"]}], "policy Role is not exactly named get"
          '
          test "$(kubectl --context kind-helm-release-orka -n orka-system auth can-i get outboundaccesspolicies.core.orka.ai/kmx-k8s-tool-gateway --as=system:serviceaccount:orka-system:orka-ai-worker)" = yes
          test "$(kubectl --context kind-helm-release-orka -n orka-system auth can-i get outboundaccesspolicies.core.orka.ai/unrelated --as=system:serviceaccount:orka-system:orka-ai-worker || true)" = no
      - name: Helm-style Tool health Task succeeds with projected event metadata
        if: steps.changes.outputs.docs_only != 'true'
        run: |
          set -euo pipefail
          health_marker="health-$(head -c 8 /dev/urandom | od -An -tx1 | tr -d ' \n')"
          kubectl --context kind-helm-release-orka -n orka-system create deployment "$health_marker" \
            --image=registry.k8s.io/pause:3.10 --replicas=0 >/dev/null
          kubectl --context kind-helm-release-orka -n orka-system create secret generic local-provider-key \
            --from-literal=api-key=not-used-by-this-endpoint >/dev/null
          kubectl --context kind-helm-release-orka -n orka-system create configmap orka-tool-model \
            --from-file=server.py=scripts/ci/orka-tool-model.py >/dev/null
          kubectl --context kind-helm-release-orka apply -f scripts/ci/orka-tool-model.yaml >/dev/null
          kubectl --context kind-helm-release-orka -n orka-system set env deployment/orka-tool-model \
            ORKA_HEALTH_DEPLOYMENT_MARKER="$health_marker" >/dev/null
          kubectl --context kind-helm-release-orka -n orka-system rollout status deploy/orka-tool-model --timeout=180s >/dev/null
          go build -o /tmp/orka-helm-kmx ./cmd/kmx
          /tmp/orka-helm-kmx --context kind-helm-release-orka agent create orka-tool-proof \
            --namespace orka-system --provider-type openai --model tool-fixture \
            --secret local-provider-key \
            --base-url http://orka-tool-model.orka-system.svc.cluster.local:8080/v1 \
            --tools k8s-get-resources --orka-api-service orka \
            --task 'Check deployment health in orka-system using k8s-get-resources.' \
            --result-service-account orka-result-reader \
            --out /tmp/orka-tool-agent.yaml --bundle-path /tmp/orka-tool-bundle \
            >/dev/null 2>/dev/null || { echo 'stock health Task failed (answer and worker output suppressed)'; exit 1; }
          task=$(kubectl --context kind-helm-release-orka -n orka-system get tasks.core.orka.ai -o json | \
            python3 -c 'import json,sys; items=json.load(sys.stdin)["items"]; matches=[i for i in items if i.get("spec",{}).get("agentRef",{}).get("name")=="orka-tool-proof"]; assert len(matches)==1, "expected one stock health Task"; print(matches[0]["metadata"]["name"])')
          test "$(kubectl --context kind-helm-release-orka -n orka-system get task "$task" -o jsonpath='{.status.phase}')" = Succeeded || { echo 'stock health Task did not succeed'; exit 1; }
          KMX_LIVE_KIND_CONTEXT=kind-helm-release-orka KMX_LIVE_TASK_NAME="$task" \
            go test ./internal/kmx/app -run '^TestLiveInspectQuickstartToolEvents$' -count=1 -v
      - name: Helm Task and Tool phase diagnostics on failure
        if: failure() && steps.changes.outputs.docs_only != 'true'
        run: |
          if [ "${KMX_ORKA_HELM_CREATED:-}" = 1 ]; then
            kubectl --context kind-helm-release-orka -n orka-system get tasks.core.orka.ai -o json | python3 -c 'import json,sys; print("Task phases:",[t.get("status",{}).get("phase","unknown") for t in json.load(sys.stdin).get("items",[])])' || true
            kubectl --context kind-helm-release-orka -n orka-system get tools.core.orka.ai k8s-get-resources -o json | python3 -c 'import json,sys; print("Tool conditions:",[(c.get("type"),c.get("status")) for c in json.load(sys.stdin).get("status",{}).get("conditions",[])])' || true
          fi
      - name: Report registry pull endpoint evidence
        if: always() && steps.changes.outputs.docs_only != 'true'
        run: python3 "$GITHUB_WORKSPACE/scripts/ci/registry-mirrors.py" report
      - name: Delete only the cluster created by this job
        if: always() && steps.changes.outputs.docs_only != 'true'
        run: |
          if [ "${KMX_ORKA_HELM_CREATED:-}" = 1 ]; then kind delete cluster --name helm-release-orka; fi
      - name: Docs-only short-circuit
        id: docs-only-summary
        if: steps.changes.outputs.docs_only == 'true'
        run: echo "every changed file is documentation; no cluster booted"
  e2e-eval-loop:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Classify the change (docs-only short-circuit, fail closed)
        id: changes
        uses: ./.github/actions/classify-change
      - uses: actions/setup-go@v5
        if: steps.changes.outputs.docs_only != 'true'
        with:
          go-version-file: go.mod
      - name: Build kmx
        if: steps.changes.outputs.docs_only != 'true'
        run: go build -o bin/kmx ./cmd/kmx
      - name: Configure CI registry mirrors
        if: steps.changes.outputs.docs_only != 'true'
        run: python3 "$GITHUB_WORKSPACE/scripts/ci/registry-mirrors.py" setup
      - name: Live AIKit evaluation and zero-call replay
        if: steps.changes.outputs.docs_only != 'true'
        uses: ./.github/actions/kmx-eval
        with:
          bundle: internal/kmx/app/testdata/live-eval-loop
          kmx-bin: ${{ github.workspace }}/bin/kmx
          model-mode: aikit
          verify: 'true'
          artifact-name: eval-loop-evidence
      - name: Report registry pull endpoint evidence
        if: always() && steps.changes.outputs.docs_only != 'true'
        run: python3 "$GITHUB_WORKSPACE/scripts/ci/registry-mirrors.py" report
      - name: Documentation-only summary
        id: docs-only-summary
        if: steps.changes.outputs.docs_only == 'true'
        run: echo "every changed file is documentation; no live evaluation run"
  e2e-hello-world:
    runs-on: ubuntu-latest
    needs: [e2e-eval-loop, e2e-kagent-create, e2e-orka-runtime, e2e-orka-helm, e2e-quickstart]
    if: always() && github.event_name != 'schedule'
    steps:
      - name: Every e2e shard succeeded
        env:
          SHARDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'EOF'
          import json, os, sys
          shards = json.loads(os.environ["SHARDS"])
          for job, outcome in sorted(shards.items()):
              print(f"{job}: {outcome['result']}")
          bad = {job: o["result"] for job, o in shards.items() if o["result"] != "success"}
          if not shards:
              print("no e2e shards reported — refusing to report success"); sys.exit(1)
          if bad:
              print("e2e shards did not succeed:", bad); sys.exit(1)
          print("every e2e shard succeeded")
          EOF
  kmx-clone-free:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      # The same docs-only short-circuit the e2e job has, and for the same
      # reason: every documentation update is a PR that merges to main, and
      # a 40-minute cluster run per doc commit is a cost with no coverage.
      # Fail closed — any error, an undeterminable file set, or anything that
      # is not documentation runs the full job. There is no checkout here, so
      # the file list comes from the compare API rather than from git.
      - name: Classify the change (docs-only short-circuit, fail closed)
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          set +e
          docs_only=false
          reason=""
          case "$BASE" in
            ""|0000000000000000000000000000000000000000) reason="no base commit" ;;
          esac
          files=""
          if [ -z "$reason" ]; then
            files=$(curl -sS --fail-with-body \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/compare/$BASE...$HEAD" \
              | python3 -c 'import json,sys; d=json.load(sys.stdin); print("\n".join(f["filename"] for f in d.get("files") or []))')
            rc=$?
            if [ "$rc" -ne 0 ] || [ -z "$files" ]; then
              reason="cannot list the changed files"
            fi
          fi
          if [ -z "$reason" ]; then
            docs_only=true
            while IFS= read -r f; do
              case "$f" in
                docs/*|*.md) ;;
                *) docs_only=false; reason="non-doc change: $f"; break ;;
              esac
            done <<<"$files"
            [ "$docs_only" = true ] && reason="every changed file is documentation"
          fi
          echo "changed files:"; echo "${files:-(undetermined)}" | sed 's/^/  /'
          echo "docs_only=$docs_only ($reason)"
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
      # Bare compound up cannot pause between cluster creation and workload
      # pulls; wrap Docker's node creation, leaving kind and image pins intact.
      - name: Configure CI registry mirrors without a checkout
        if: steps.changes.outputs.docs_only != 'true'
        env:
          CI_MIRROR_REPO: ${{ github.repository }}
          CI_MIRROR_REF: ${{ github.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/ci-registry-bootstrap"
          curl -fsSL --retry 3 \
            "https://raw.githubusercontent.com/${CI_MIRROR_REPO}/${CI_MIRROR_REF}/scripts/ci/registry-mirrors.py" \
            -o "$RUNNER_TEMP/ci-registry-bootstrap/registry-mirrors.py"
          python3 "$RUNNER_TEMP/ci-registry-bootstrap/registry-mirrors.py" setup --wrap
      - uses: actions/setup-go@v5
        if: steps.changes.outputs.docs_only != 'true'
        with:
          go-version: '1.26'
      - name: Install kind
        if: steps.changes.outputs.docs_only != 'true'
        run: |
          curl -sSfLo kind https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64
          chmod +x kind && sudo mv kind /usr/local/bin/kind
      - name: Install kmx from the Go proxy at this commit — no clone
        if: steps.changes.outputs.docs_only != 'true'
        env:
          SHA: ${{ github.sha }}
        run: |
          mkdir -p "$HOME/journey"
          # The proxy may not have indexed the push yet. Retry, and say
          # which failure it was: "not yet published" and "does not build"
          # look identical if only the last attempt is reported.
          for attempt in 1 2 3 4 5 6; do
            if go install "github.com/kaimahi-agents/kaimahi/cmd/kmx@$SHA" 2>install.err; then
              published=1; break
            fi
            cat install.err
            echo "attempt $attempt: the proxy does not serve $SHA yet; waiting 30s"
            sleep 30
          done
          test -n "${published:-}" || { echo "go install never succeeded for $SHA"; exit 1; }
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: The binary is what a user gets, and knows nothing of a checkout
        if: steps.changes.outputs.docs_only != 'true'
        working-directory: /home/runner/journey
        run: |
          kmx version
          # Fail closed on the premise: if a checkout somehow exists at or
          # above this directory, the published binary's embedded native
          # assets would no longer be the only setup inputs.
          test ! -e ./go.mod && test ! -e /home/runner/go.mod && test ! -e /home/runner/k8s
      # The setup a reader is told to run, run verbatim: a bare `kmx up` IS
      # the Orka runtime — kind, Ollama, the model, the pinned Orka release
      # with its Provider and its `orka-result-reader` account. Nothing here
      # installs Orka a second time, and nothing creates that account by
      # hand: the Task proof below reads its result through the account this
      # one command provisioned, which is the claim the docs make.
      - name: up — cluster, Ollama, the model and the pinned Orka runtime
        if: steps.changes.outputs.docs_only != 'true'
        working-directory: /home/runner/journey
        env:
          KIND_CLUSTER: kmx-clone-free
        run: kmx up
      - name: agent create — native Orka Task returns an actual local-model answer
        if: steps.changes.outputs.docs_only != 'true'
        working-directory: /home/runner/journey
        run: |
          # Reuse the installer's Secret, never its shared Provider/local.
          # `--result-service-account` names the account `kmx up --step orka`
          # provisioned: create itself provisions no account and no RBAC, so
          # naming one the bring-up made is the whole point of this step.
          # This step exercises agent creation through the supported
          # Orka path, not through retired governance commands.
          kmx --context kind-kmx-clone-free agent create orka-hello \
            --namespace orka-system --provider-type openai --model qwen2.5:3b \
            --secret local-provider-key \
            --base-url http://ollama.ollama.svc.cluster.local:11434/v1 \
            --task 'Reply with exactly this text: Orka says hello.' \
            --result-service-account orka-result-reader > orka-answer.out
          test -f agents/orka-hello.yaml
          test "$(cat orka-answer.out)" = 'Orka says hello.'
      - name: Cluster state on failure
        if: failure() && steps.changes.outputs.docs_only != 'true'
        run: |
          kubectl --context kind-kmx-clone-free get pods -A || true
          kubectl --context kind-kmx-clone-free -n orka-system get agents.core.orka.ai,tasks.core.orka.ai || true
      - name: Report registry pull endpoint evidence
        if: always() && steps.changes.outputs.docs_only != 'true'
        run: python3 "$RUNNER_TEMP/ci-registry-bootstrap/registry-mirrors.py" report
      - name: down
        if: always() && steps.changes.outputs.docs_only != 'true'
        run: kind delete cluster --name kmx-clone-free || true
      - name: Docs-only change — no cluster booted
        if: steps.changes.outputs.docs_only == 'true'
        run: echo "every changed file is documentation; the clone-free journey was not run"
