name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 3 * * *'
  # Manual dispatch exercises the clone-free job from a branch as well as
  # main, so its install path can be verified before merging.
  workflow_dispatch:

# Least privilege for every job: checkout needs repository read, nothing
# needs more.
permissions:
  contents: read

jobs:
  classify-change:
    runs-on: ubuntu-latest
    outputs:
      kagent_changed: ${{ steps.changes.outputs.kagent_changed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 2
      - id: changes
        uses: ./.github/actions/classify-change

  # Each process retains serial fixture isolation; top-level names are assigned
  # exactly once without splitting dynamic subtests from their parent.
  app-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: App tests and scalar timing summary
        id: app_tests
        run: python3 scripts/ci/app-tests.py --shard ${{ matrix.shard }} --shards 4
      - name: App test timings (no test output)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kmx-app-timings-${{ matrix.os }}-${{ matrix.shard }}
          path: kmx-app-test.timings.json
          if-no-files-found: ignore
      - name: App test failure diagnostics
        if: failure() && steps.app_tests.outcome == 'failure' && hashFiles('kmx-app-test.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kmx-app-test-json-${{ matrix.os }}-${{ matrix.shard }}
          path: kmx-app-test.json
          retention-days: 3

  windows-amd64-native:
    name: Windows amd64 native CLI and package qualification
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: Build isolated user-owner test launcher
        shell: pwsh
        run: go build -trimpath -o "$env:RUNNER_TEMP\kmx-windows-tests.exe" ./scripts/ci/windows-tests
      - name: Assert native Windows x64 runner
        shell: pwsh
        run: |
          if (-not [Environment]::Is64BitOperatingSystem -or -not [Environment]::Is64BitProcess) {
            throw 'windows-amd64-native requires a native 64-bit Windows process.'
          }
          $arch = [System.Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture.ToString()
          if ($arch -ne 'X64') { throw "windows-amd64-native ran as $arch, not X64." }
          if ((go env GOOS) -ne 'windows' -or (go env GOARCH) -ne 'amd64') {
            throw 'Go did not select native windows/amd64.'
          }
      - name: Native selected package tests with no skips
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # The launcher package intentionally contains host-capability skip
          # branches; keep that complete package proof, then require zero skips
          # for every operation-specific selection below.
          & "$env:RUNNER_TEMP\kmx-windows-tests.exe" go test -race -count=1 -timeout=600s -v ./scripts/ci/windows-tests ./internal/kmx/fileaccess
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $directFileAccessTests = @('TestWindowsFilesystemQualification','TestWindowsTemporaryVolumeIsQualified','TestWindowsPrivateCreationUsesExplicitProtectedDescriptor')
          $output = go test -race -count=1 -timeout=600s -v `
            -run ('^(' + ($directFileAccessTests -join '|') + ')$') ./internal/kmx/fileaccess 2>&1
          $status = $LASTEXITCODE
          $output | Write-Output
          if ($status -ne 0) { exit $status }
          if ($output -match '--- SKIP:') { throw 'a direct selected fileaccess test skipped' }
          foreach ($test in $directFileAccessTests) {
            if (-not ($output -match ("--- PASS: " + [regex]::Escape($test) + " \("))) { throw "$test did not pass" }
          }
          $configTests = @('TestStateDirUsesPortableOverrideAndNativeDefault','TestWindowsStateAccessUsesLocalAppDataAndSeparatesCreation','TestWindowsStateAccessRefusesUnsafeRootWithoutRepair','TestPrepareLocalPreviewJournalDirCreatesPrivateChain')
          $output = & "$env:RUNNER_TEMP\kmx-windows-tests.exe" go test -race -count=1 -timeout=600s -v `
            -run ('^(' + ($configTests -join '|') + ')$') `
            ./internal/kmx/config 2>&1
          $status = $LASTEXITCODE
          $output | Write-Output
          if ($status -ne 0) { exit $status }
          if ($output -match '--- SKIP:') { throw 'a selected config test skipped' }
          foreach ($test in $configTests) {
            if (-not ($output -match ("--- PASS: " + [regex]::Escape($test) + " \("))) { throw "$test did not pass" }
          }
          $previewTests = @('TestFakeInstructionRegressionFailsThenFixes','TestInspectReplaysWithoutModelCall','TestJournalRetentionAndClear','TestJournalLockCleanupFailureVetoesCompletion','TestClearDirectorySyncFailureReportsUncertainty','TestWindowsJournalFamilyIsPrivateAndReplayable','TestWindowsInterruptedJournalFamilyClearRecovers')
          $output = & "$env:RUNNER_TEMP\kmx-windows-tests.exe" go test -race -count=1 -timeout=600s -v `
            -run ('^(' + ($previewTests -join '|') + ')$') ./internal/kmx/localpreview 2>&1
          $status = $LASTEXITCODE
          $output | Write-Output
          if ($status -ne 0) { exit $status }
          if ($output -match '--- SKIP:') { Write-Error 'a selected localpreview test skipped'; exit 1 }
          foreach ($test in $previewTests) {
            if (-not ($output -match ("--- PASS: " + [regex]::Escape($test) + " \("))) { Write-Error "$test did not pass"; exit 1 }
          }
          $appTests = @('TestLocalFileRunnerRunFailRetainExplainJourney','TestLocalFileRunnerJournaledAppSnapshot','TestSuiteFailureStorePublicationUncertainty','TestSuiteFailureStoreUnresolvedVisibilityKeepsDiagnosticID','TestSuiteFailureStoreOwnPairVisibleUntilWholeClear','TestSuiteFailureStoreAtomicErrors','TestFileFailureRetentionExplainRevisionAndIsolation','TestFileFailureRetentionDoesNotChangeOutcome','TestFileFailureRetentionKeepsFrozenSubjectAfterParentReplacement','TestFileFailureStoreUnresolvedVisibilityKeepsDiagnosticID','TestFileFailureStoreInterruptedWriteAndScopedClear','TestFileFailureStoreLeavesWorkspaceV1BytesCompatible','TestFileFailureStoreRejectsContradictoryRecords','TestWindowsSuiteFailureStoreLifecycle','TestWindowsSuiteFailureWorkspaceCaseAliasesSharePartition','TestWindowsFileFailureStoreLifecycleAndCaseAliases')
          $output = & "$env:RUNNER_TEMP\kmx-windows-tests.exe" go test -race -count=1 -timeout=600s -v `
            -run ('^(' + ($appTests -join '|') + ')$') ./internal/kmx/app 2>&1
          $status = $LASTEXITCODE
          $output | Write-Output
          if ($status -ne 0) { exit $status }
          if ($output -match '--- SKIP:') { Write-Error 'a selected App test skipped'; exit 1 }
          foreach ($test in $appTests) {
            if (-not ($output -match ("--- PASS: " + [regex]::Escape($test) + " \("))) { Write-Error "$test did not pass"; exit 1 }
          }
      - name: Focused native cmd/kmx tests with no skips
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tests = @('TestGuardedWindowsDeferredOperationsRefuseBeforeEffects','TestGuardedWindowsAllowsPackageFreeFileCommands','TestGuardedWindowsFileCommandsRefuseEveryExternalRouteBeforeEffects','TestGuardedWindowsFileSnapshotCannotChangeRouteAfterAdmission','TestGuardedWindowsExplainRequiresExplicitFileAndAllowsFileScopedClear','TestGuardedWindowsFileExplainClearStaysSubjectScoped','TestGuardedWindowsSupportedCommandFlagsAreExhaustivelyAllowlisted','TestGuardedWindowsVersionHelpAndCompletionRemainInert','TestGuardedWindowsCommandTreeIsExhaustivelyClassified','TestFileCommandJournaledPreviewDemo')
          $output = & "$env:RUNNER_TEMP\kmx-windows-tests.exe" go test -race -count=1 -timeout=600s -v `
            -run ('^(' + ($tests -join '|') + ')$') ./cmd/kmx 2>&1
          $status = $LASTEXITCODE
          $output | Write-Output
          if ($status -ne 0) { exit $status }
          if ($output -match '--- SKIP:') { throw 'a selected cmd/kmx package test skipped' }
          foreach ($test in $tests) {
            if (-not ($output -match ("--- PASS: " + [regex]::Escape($test) + " \("))) { throw "$test did not pass" }
          }
      - name: Native windows/amd64 build and vet all packages
        shell: pwsh
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: |
          $ErrorActionPreference = 'Stop'
          go build ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go vet ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go build -trimpath -o "$env:RUNNER_TEMP\kmx.exe" ./cmd/kmx
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $metadataLines = @(go version -m "$env:RUNNER_TEMP\kmx.exe" 2>&1)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $metadataLines | Write-Output
          $metadata = $metadataLines -join "`n"
          if ($metadata -notmatch '(?m)^\s*build\s+GOOS=windows\s*$' -or $metadata -notmatch '(?m)^\s*build\s+GOARCH=amd64\s*$') {
            throw 'native executable metadata is not windows/amd64'
          }
      - name: Direct executable day-zero journey
        shell: pwsh
        run: ./scripts/ci/windows-cli-day-zero.ps1 -Binary "$env:RUNNER_TEMP\kmx.exe" -Fixture ./internal/kmx/agentfile/testdata/greeter.agent.md

  windows-arm64-cross:
    name: Windows arm64 cross-build metadata only (not native execution)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: Cross-build and vet all packages without execution
        shell: pwsh
        env:
          GOOS: windows
          GOARCH: arm64
          CGO_ENABLED: '0'
        run: |
          $ErrorActionPreference = 'Stop'
          if ([System.Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture.ToString() -ne 'X64') {
            throw 'Cross-build evidence expects the hosted x64 process and never executes arm64.'
          }
          go build ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go vet ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go build -trimpath -o "$env:RUNNER_TEMP\kmx-windows-arm64.exe" ./cmd/kmx
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test -c -o "$env:RUNNER_TEMP\cmd-kmx-arm64.test.exe" ./cmd/kmx
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test -c -o "$env:RUNNER_TEMP\fileaccess-arm64.test.exe" ./internal/kmx/fileaccess
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test -c -o "$env:RUNNER_TEMP\config-arm64.test.exe" ./internal/kmx/config
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test -c -o "$env:RUNNER_TEMP\localpreview-arm64.test.exe" ./internal/kmx/localpreview
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test -c -o "$env:RUNNER_TEMP\app-arm64.test.exe" ./internal/kmx/app
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test -c -o "$env:RUNNER_TEMP\windows-tests-arm64.test.exe" ./scripts/ci/windows-tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($path in @(
            "$env:RUNNER_TEMP\kmx-windows-arm64.exe",
            "$env:RUNNER_TEMP\cmd-kmx-arm64.test.exe",
            "$env:RUNNER_TEMP\fileaccess-arm64.test.exe",
            "$env:RUNNER_TEMP\config-arm64.test.exe",
            "$env:RUNNER_TEMP\localpreview-arm64.test.exe",
            "$env:RUNNER_TEMP\app-arm64.test.exe",
            "$env:RUNNER_TEMP\windows-tests-arm64.test.exe"
          )) {
            $metadataLines = @(go version -m $path 2>&1)
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $metadataLines | Write-Output
            $metadata = $metadataLines -join "`n"
            if ($metadata -notmatch '(?m)^\s*build\s+GOOS=windows\s*$' -or $metadata -notmatch '(?m)^\s*build\s+GOARCH=arm64\s*$') {
              throw "$path metadata is not windows/arm64"
            }
          }

  hygiene-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Changed lines contain no conflict markers or whitespace errors
        id: whitespace
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            pull_request) base=HEAD^1 ;;
            push)
              case "$BEFORE" in
                ""|0000000000000000000000000000000000000000)
                  echo "No before commit for the push; cannot check its diff." >&2
                  exit 1
                  ;;
              esac
              base="$BEFORE"
              if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
                git fetch --no-tags origin "$base"
              fi
              ;;
            schedule|workflow_dispatch) base=HEAD^ ;;
            *) echo "Unsupported diff-check event: $EVENT" >&2; exit 1 ;;
          esac
          # PR checkout is the merge commit: its actual first parent avoids
          # including unrelated changes from a stale event base SHA.
          base=$(git rev-parse --verify "$base^{commit}")
          merge_base=$(git merge-base "$base" HEAD)
          echo "Checking changed lines from $merge_base to HEAD"
          git diff --check "$merge_base" HEAD
      - name: Classify script changes (fail closed)
        id: mutation_changes
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/classify-change
      - name: Required files present
        run: |
          test -f LICENSE
          test -f README.md
          test -f docs/package.json
          test -f docs/package-lock.json
          test -f docs/.vitepress/config.mts
      - name: Brand assets validate
        run: python3 scripts/check-brand-assets.py
      - name: All YAML parses
        run: |
          python3 - <<'EOF'
          import pathlib, sys, yaml
          failed = False
          for p in pathlib.Path(".").rglob("*.y*ml"):
              if ".git" in p.parts:
                  continue
              try:
                  list(yaml.safe_load_all(p.read_text()))
              except Exception as e:
                  print(f"{p}: {e}")
                  failed = True
          sys.exit(1 if failed else 0)
          EOF
      # The scanner and manifest scaffolder share the credential shapes in
      # internal/kmx/secretshapes/shapes.json. Prove the scanner still catches
      # each shape before trusting its verdict on the tree.
      - name: Credential-shape scanner still catches every shape
        run: python3 scripts/check-secret-shapes.py --selftest
      - name: No credential shapes in tree
        run: python3 scripts/check-secret-shapes.py
      - name: Changelog fragment policy self-tests
        run: |
          python3 scripts/check-changelog-fragments.py --selftest
          python3 scripts/test_changelog_ci.py
      - name: Changelog fragments validate and cover this PR
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          python3 scripts/check-changelog-fragments.py
          if [ "$EVENT" = pull_request ]; then
            parent_line=$(git log -1 --format=%P HEAD)
            read -ra parents <<< "$parent_line"
            if [ "${#parents[@]}" -ne 2 ]; then
              echo "Fragment policy requires a synthetic two-parent PR merge checkout." >&2
              exit 1
            fi
            python3 scripts/check-changelog-fragments.py --base "${parents[0]}" --head HEAD
          fi
      # Directory responsibilities are inherited by their files. Check paths,
      # ownership-area coverage and the retired-module boundary, not volatile
      # counts, exhaustive inventories or editorial classifications.
      - name: Repository-map checker self-test
        run: python3 scripts/check-repository-map.py --selftest
      - name: The repository map still describes this tree
        run: python3 scripts/check-repository-map.py
      # Retired commands and assets must not return as current instructions.
      # Native runtime identifiers and external chart bootstrap are not bans;
      # supported operations and runtime versions are validated by kmx tests.
      # Self-tests and mutations exercise matching, exact exceptions and scan coverage.
      - name: Retired-command scanner catches its bounded command and asset cases
        run: python3 scripts/check-legacy-runtime.py --selftest
      - name: Current instructions contain no retired commands or assets
        run: python3 scripts/check-legacy-runtime.py
      # And the checkers themselves: each one is copied, broken on purpose
      # in a named way, and required to notice. A self-test built from
      # fixture pairs proves a checker gets today's answer right; it does
      # not prove the checker would notice tomorrow's wrong answer, and
      # every gap this closes was found by editing a checker until it was
      # worthless and watching its own self-test stay green.
      - name: Registry mirror helper self-tests
        run: python3 scripts/test_registry_mirrors.py
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Live eval gate and failure diagnostics self-tests
        run: |
          python3 scripts/test_orka_runtime_fixture.py
          python3 scripts/test_app_tests.py
          python3 scripts/test_bundle_retirement_ci.py
      - name: Native suite fixtures, timing and reference self-tests
        run: |
          python3 scripts/test_suite_native.py
          python3 scripts/test_native_timings.py
          python3 scripts/test_suite_native_lift.py
          python3 scripts/test_orka_native_reference.py
      - name: Orka qualification and dependency boundaries
        run: |
          python3 scripts/test_orka_routing.py
          python3 scripts/test_orka_callers.py
          python3 scripts/test_orka_workflows.py
          python3 scripts/test_orka_nightly_report.py
          go run scripts/ci/orka-boundary.go
      - name: Mutation runner and CI routing self-tests
        run: python3 scripts/test_check_mutations.py
      - name: Every checker notices being broken
        if: github.event_name != 'pull_request' || steps.mutation_changes.outputs.scripts_changed != 'false'
        run: python3 scripts/check-mutations.py
      # This repo is public and documents a managed-cluster path.
      # A subscription/tenant GUID, an AKS FQDN, or a real ACR login server
      # must never land in the tree — every Azure identifier is supplied by
      # the operator at run time. The same script is what the operator runs
      # locally while writing up an AKS run.
      # The scanner is itself a gate that can fail open (a regex that
      # matches nothing passes everything): prove it still catches each
      # identifier class before trusting its verdict on the tree.
      - name: Azure identifier scanner still catches every class
        run: bash scripts/check-no-azure-ids-test.sh
      - name: No Azure identifiers in tree
        run: bash scripts/check-no-azure-ids.sh
      # The docs are organised by capability. The checker covers every
      # link target that is not an absolute URL: inline links, HTML
      # `<img src>` and `<a href>` (including tags
      # whose attributes span several lines), and
      # reference links through their definitions. Each must resolve to a
      # file in the tree, and each #anchor on a Markdown target must match
      # a heading there. Fenced blocks and code spans are not links.
      - name: AgentSuite consumer fixture parity
        run: |
          python3 scripts/check-agentsuite-fixtures.py --selftest
          python3 scripts/check-agentsuite-fixtures.py
      - name: Doc-link checker self-test
        run: python3 scripts/check-doc-links.py --selftest
      - name: Doc links resolve
        run: python3 scripts/check-doc-links.py
      - name: README front door is ordered around working capability
        run: python3 scripts/check-readme-front-door.py
      - name: README front-door checker self-test
        run: python3 scripts/check-readme-front-door-test.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Documentation site renders current Markdown
        run: |
          npm --prefix docs ci --ignore-scripts
          npm --prefix docs run docs:check
      - name: Published AgentSuite schema parity
        run: npm --prefix docs run docs:schemas
      # The release job's notes come from CHANGELOG.md and it REFUSES
      # to publish a version with no section there. That refusal is the only
      # thing making "every release has notes" true, so the extractor is
      # tested here rather than discovered on a tag.
      - name: Release-notes extractor self-test
        run: python3 scripts/release-notes.py --selftest
      - name: Homebrew formula renderer self-test
        run: python3 scripts/homebrew-formula.py --selftest
      - name: The unreleased section exists, and the release job stays keyless
        run: |
          python3 - <<'EOF'
          import os, re, subprocess, sys, tempfile, yaml
          changelog = open("CHANGELOG.md").read()
          if not re.search(r"^## Unreleased$", changelog, re.M):
              print("CHANGELOG.md needs an '## Unreleased' section to write the next release into")
              sys.exit(1)
          wf = yaml.safe_load(open(".github/workflows/release.yml"))
          # This repository is public and fork-exposed, and CI carries
          # no repository secret. A release does not change that — the only
          # credential it may use is the token GitHub mints for the run.
          # `github.token` and `secrets.GITHUB_TOKEN` are that same token;
          # anything else named under secrets. would be a new one.
          used = set(re.findall(r"secrets\.([A-Za-z_][A-Za-z0-9_]*)", open(".github/workflows/release.yml").read()))
          if used - {"GITHUB_TOKEN"}:
              print(f"the release job uses repository secrets: {sorted(used - {'GITHUB_TOKEN'})}")
              sys.exit(1)
          # Least privilege, stated: the workflow reads, and only the job
          # that publishes may write contents.
          if wf.get("permissions") != {"contents": "read"}:
              print(f"release.yml must default to contents: read, got {wf.get('permissions')}")
              sys.exit(1)
          release_text = open(".github/workflows/release.yml").read()
          if "goreleaser release --clean --skip=publish,validate" not in release_text:
              print("release.yml must build the release through GoReleaser without publishing")
              sys.exit(1)
          if "dist/homebrew/Formula/kmx.rb" not in release_text:
              print("release.yml must attach the rendered Homebrew formula as a release asset")
              sys.exit(1)
          for asset in ("kmx-windows-amd64.exe", "kmx-windows-arm64.exe"):
              if asset not in release_text:
                  print(f"release.yml must stage and publish {asset}")
                  sys.exit(1)
          windows_release = wf["jobs"].get("release-windows-amd64", {})
          windows_body = "\n".join(str(step.get("run", "")) for step in windows_release.get("steps", []))
          windows_downloads = [step for step in windows_release.get("steps", [])
                               if str(step.get("uses", "")).startswith("actions/download-artifact@")]
          windows_trust_uploads = [step for step in windows_release.get("steps", [])
                                   if str(step.get("uses", "")).startswith("actions/upload-artifact@")]
          if (windows_release.get("needs") != "release" or windows_release.get("runs-on") != "windows-latest"
                  or any(str(step.get("uses", "")).startswith("actions/setup-go@") for step in windows_release.get("steps", []))
                  or any("continue-on-error" in step for step in windows_release.get("steps", []))
                  or len(windows_downloads) != 1
                  or windows_downloads[0].get("with", {}).get("name") != "kmx-" + "$" + "{{ needs.release.outputs.version }}"
                  or windows_downloads[0].get("with", {}).get("path") != "$" + "{{ runner.temp }}/checked-release"
                  or len(windows_trust_uploads) != 1
                  or windows_trust_uploads[0].get("if") != "steps.authenticode.outputs.recorded == 'true'"
                   or "windows-cli-day-zero.ps1" not in windows_body
                   or "Get-AuthenticodeSignature" not in windows_body
                   or "Zone.Identifier" not in windows_body
                   or "SmartScreen: not evaluated" not in windows_body
                   or "@('Valid', 'NotSigned')" not in windows_body):
              print("release.yml must natively qualify the exact staged Windows amd64 binary without setup-go or protection bypass")
              sys.exit(1)
          # Stable production URLs let Homebrew infer the version and strict
          # audit rejects restating it. Prerelease formulas retain an explicit
          # version because their URL inference is not reliable.
          if release_text.count('''perl -i -ne 'print unless /^  version "/' dist/homebrew/Formula/kmx.rb''') != 1:
              print("release.yml must strip the redundant `version` line from the one checked GoReleaser build")
              sys.exit(1)
          if 'grep -qx "  version \\"${VERSION#v}\\"" dist/homebrew/Formula/kmx.rb' not in release_text:
              print("release.yml must retain and verify GoReleaser's explicit version for prerelease formulas")
              sys.exit(1)
          if "gh release create" not in release_text:
              print("release.yml must publish the already-checked artifact set in one draft-to-public release operation")
              sys.exit(1)
          uploads = [step["with"] for step in wf["jobs"]["release"]["steps"]
                     if step.get("uses", "").startswith("actions/upload-artifact@")]
          asset_path = "$" + "{{ runner.temp }}/release-assets/"
          if len(uploads) != 1 or asset_path not in uploads[0].get("path", "").splitlines():
              print("release.yml must upload the same checked assets for dry runs and native qualification")
              sys.exit(1)
          publish = wf["jobs"].get("publish", {})
          if (set(wf["jobs"]) != {"release", "release-contracts", "plugin-install", "release-windows-amd64", "publish"}
                  or "needs" in wf["jobs"]["release"] or "if" in wf["jobs"]["release"]):
              print("release.yml must build immediately without cluster runtime qualification")
              sys.exit(1)
          if (set(publish.get("needs", [])) != {"release", "plugin-install", "release-contracts", "release-windows-amd64"}
                  or publish.get("if") != "needs.release.outputs.dry_run == 'false'"):
              print("release.yml must wait for native install, Windows day-zero and hermetic contracts and publish only outside dry runs")
              sys.exit(1)
          if 'scripts/homebrew-formula.py "$VERSION" dist/checksums.txt --require-windows' not in release_text:
              print("release.yml must reject an incomplete or unexpected checksum manifest before publication")
              sys.exit(1)
          if re.search(r"goreleaser release(?! --clean --skip=publish,validate)", release_text):
              print("release.yml must not rebuild artifacts during publication")
              sys.exit(1)
          goreleaser_text = open(".goreleaser.yaml").read()
          goreleaser_cfg = yaml.safe_load(goreleaser_text)
          brew = goreleaser_cfg.get("brews", [{}])[0]
          if brew.get("skip_upload") is not True:
              print(".goreleaser.yaml must set brews[0].skip_upload: true — this job never pushes to the tap")
              sys.exit(1)
          if brew.get("repository", {}).get("name") != "homebrew-tap":
              print(".goreleaser.yaml must render the formula for kaimahi-agents/homebrew-tap")
              sys.exit(1)
          if "token" in brew.get("repository", {}):
              print(".goreleaser.yaml's brews.repository must not name a token — that would be a credential to push with")
              sys.exit(1)
          if 'if [ "$EVENT_NAME" = push ] && [ "$REF_TYPE" = tag ]; then' not in release_text:
              print("release.yml must publish only for tag pushes; manual dispatch is always a dry run")
              sys.exit(1)
          decision = next(step for step in wf["jobs"]["release"]["steps"] if step.get("id") == "what")
          if (decision["env"].get("RUN_ID") != "$" + "{{ github.run_id }}"
                  or decision["env"].get("RUN_ATTEMPT") != "$" + "{{ github.run_attempt }}"):
              print("synthetic release versions must bind the workflow run ID and attempt")
              sys.exit(1)
          decide = decision["run"]
          cases = [
              ({"EVENT_NAME": "push", "REF_TYPE": "tag", "REF_NAME": "v0.3.0", "INPUT_VERSION": "", "SHA": "a" * 40},
               {"version": "v0.3.0", "dry_run": "false", "prerelease": "false", "synthetic": "false"}),
              ({"EVENT_NAME": "push", "REF_TYPE": "tag", "REF_NAME": "v0.3.0-rc.1", "INPUT_VERSION": "", "SHA": "d" * 40},
               {"version": "v0.3.0-rc.1", "dry_run": "false", "prerelease": "true", "synthetic": "false"}),
              ({"EVENT_NAME": "workflow_dispatch", "REF_TYPE": "branch", "REF_NAME": "main", "INPUT_VERSION": "v0.3.0", "SHA": "b" * 40},
               {"version": "v0.3.0", "dry_run": "true", "prerelease": "false", "synthetic": "false"}),
              ({"EVENT_NAME": "workflow_dispatch", "REF_TYPE": "tag", "REF_NAME": "v0.3.0", "INPUT_VERSION": "", "SHA": "c" * 40},
               {"version": "v0.0.0-dryrun.cccccccccccc.101.1", "dry_run": "true", "prerelease": "true", "synthetic": "true"}),
              ({"EVENT_NAME": "workflow_dispatch", "REF_TYPE": "branch", "REF_NAME": "main", "INPUT_VERSION": "", "SHA": "c" * 40, "RUN_ID": "102"},
               {"version": "v0.0.0-dryrun.cccccccccccc.102.1", "dry_run": "true", "prerelease": "true", "synthetic": "true"}),
              ({"EVENT_NAME": "workflow_dispatch", "REF_TYPE": "branch", "REF_NAME": "main", "INPUT_VERSION": "", "SHA": "c" * 40, "RUN_ID": "102", "RUN_ATTEMPT": "2"},
               {"version": "v0.0.0-dryrun.cccccccccccc.102.2", "dry_run": "true", "prerelease": "true", "synthetic": "true"}),
          ]
