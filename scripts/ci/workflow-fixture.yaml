# A blueprint for CI, aimed at the synthetic hosted upstream.
#
# Keyless: mcp-echo is scripts/ci/mcp-echo-server.py behind the same
# gateway as a real hosted seam, and its policy declarations are COPIED
# from the committed table by scripts/ci/synthetic-upstream.sh, so this
# fixture cannot drift away from what ships.
#
# It exists to exercise the parts of `kmx workflow` that no unit test can
# reach: that the standing bounds a blueprint declares are ENFORCED and
# not merely written, that the driver files the approval request for the
# exact call named on the command line, and that it refuses to ride a
# grant somebody gave earlier.
#
# TWO OF ITS THREE STEPS ARE CONDITIONAL, and that is the point.
# This fixture used to have no `when:` guard anywhere while the carried
# release blueprint had four, so eight green assertions here coexisted
# with a `kmx workflow run` that could not start ANY blueprint with a
# conditional step. `hotfix_branches` reproduces the exact shape that
# broke — a step guarded by `when:` on the very parameter that is
# `required_for` it — and `survey` keeps the agent turn out of the run,
# so CI can drive the REAL run path (not --dry-run) with no model.
#
# The credential is its own (`workflow-ci`) rather than `hello-github`,
# because the synthetic upstream puts hello-github's constraints in the
# BASE table and the plane refuses an overlay fragment that redefines a
# credential the committed table already constrains — which is itself a
# rule worth not tripping over in CI.
blueprint: v1
name: ci-fixture
summary: The CI fixture workflow — a conditional read, one consequential call and a conditional one, against the synthetic hosted upstream.

credential: workflow-ci
agent: hello-world

parameters:
  repo:
    type: github_repo
    required: true
    help: the repository this workflow may read, as owner/name
    pattern: '^[A-Za-z0-9][A-Za-z0-9-]{0,38}/[A-Za-z0-9._-]{1,100}$'
  version:
    type: string
    required_for: [cut]
    help: the release being cut
    pattern: '^[A-Za-z0-9][A-Za-z0-9._+-]{0,99}$'
  base:
    type: string
    default: main
    help: the branch it is cut from
    pattern: '^[A-Za-z0-9._/-]{1,200}$'
  survey:
    type: string
    required_for: [look]
    help: >-
      ask the agent to survey the pull requests first. Omitted, the read step is
      not in the run at all — which is how CI drives this workflow end to end
      with no agent turn and no model credential.
    pattern: '^[A-Za-z0-9._/-]{1,200}$'
  hotfix_branches:
    type: string_list
    required_for: [cut-extra]
    help: >-
      extra branches to cut, comma-separated. The step that needs them is guarded
      by `when: hotfix_branches`, so leaving them out must leave the step OUT of
      the run rather than refuse to start it — the circular demand the first
      driver shipped with.

seams:
  mcp-echo:
    requires:
      list_pull_requests: [owner, repo, state, base]
      create_branch:      [owner, repo, branch, from_branch]
    # Nothing is allowlisted. The read is admitted by its BOUND and the
    # write by a human, which is the posture argument-level policy takes:
    # where a constraint exists it binds, so it is a bound and not another
    # way in.
    allow: []
    bound:
      list_pull_requests:
        - {field: owner, op: eq, value: "${repo.owner}"}
        - {field: repo,  op: eq, value: "${repo.name}"}

steps:
  - name: look
    kind: read
    when: survey
    prompt: Call list_pull_requests with owner ${repo.owner}, repo ${repo.name}, state closed, base ${base}.
  - name: cut
    kind: consequential
    call:
      upstream: mcp-echo
      tool: create_branch
      args:
        owner: "${repo.owner}"
        repo: "${repo.name}"
        branch: "release/${version}"
        from_branch: "${base}"
    prompt: Call create_branch with owner ${repo.owner}, repo ${repo.name}, branch release/${version}, from_branch ${base}.
  - name: cut-extra
    kind: consequential
    when: hotfix_branches
    for_each: hotfix_branches
    call:
      upstream: mcp-echo
      tool: create_branch
      args:
        owner: "${repo.owner}"
        repo: "${repo.name}"
        branch: "${item}"
        from_branch: "${base}"
    prompt: Call create_branch with owner ${repo.owner}, repo ${repo.name}, branch ${item}, from_branch ${base}.
