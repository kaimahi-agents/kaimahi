# In-cluster Ollama model server. kagent needs an LLM endpoint; Ollama keeps
# the hello-world demo keyless and free (no API key, no Secret, no billing).
# The model itself is pulled at deploy time (see Makefile `model` target) so
# the image stays small and the model choice stays a one-line change.
apiVersion: v1
kind: Namespace
metadata:
  name: ollama
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: ollama
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ollama
          image: ollama/ollama:0.11.8
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          env:
            # Non-root: keep everything Ollama writes (models, its keypair)
            # on the mounted volume instead of /root.
            - name: HOME
              value: /data
            - name: OLLAMA_MODELS
              value: /data/models
          ports:
            - containerPort: 11434
              name: http
          resources:
            # Requests stay small so the demo also schedules on a 2-CPU CI
            # runner (kagent's own pods need ~600m); no CPU limit, so
            # inference can still burst to whatever the node has.
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              memory: 6Gi
          readinessProbe:
            httpGet:
              path: /
              port: http
          volumeMounts:
            - name: models
              mountPath: /data
      volumes:
        # emptyDir: models re-pull on pod restart. Fine for a demo cluster;
        # a PVC would outlive the pod but this demo keeps moving parts minimal.
        - name: models
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: ollama
spec:
  selector:
    app: ollama
  ports:
    - port: 11434
      targetPort: http
