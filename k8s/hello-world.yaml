# A hello-world agent as code.
#
# This file IS the agent topology artifact — the model it thinks with
# (ModelConfig) and the agent itself (Agent) in one declarative document.
# `kubectl apply -f` this and the kagent controller provisions the agent;
# later phases extend the same document model with tools (MCP servers) and
# other agents (A2A), so the topology stays reviewable YAML end to end.
apiVersion: kagent.dev/v1alpha2
kind: ModelConfig
metadata:
  name: hello-world-model
  namespace: kagent
spec:
  provider: Ollama
  model: qwen2.5:3b
  ollama:
    host: http://ollama.ollama.svc.cluster.local:11434
---
apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: hello-world
  namespace: kagent
spec:
  description: Minimal hello-world agent — greets people and explains itself.
  type: Declarative
  declarative:
    # The agent pod runs model output; it is the LEAST trusted workload here
    # and was, until now, the least constrained. kagent exposes the fields
    # (spec.declarative.deployment, v1alpha2) — we simply were not setting
    # them. Same posture as k8s/plane/proxy.yaml.
    # A read-only root filesystem needs somewhere to write: the runtime uses
    # /tmp, mounted here as an emptyDir rather than left writable everywhere.
    deployment:
      podSecurityContext:
        runAsNonRoot: true
        # Kubernetes will not start a runAsNonRoot container whose user it
        # cannot prove is non-root, and an image's declared USER is only
        # proof when it is numeric — kagent's agent image has declared it by
        # name at some versions and numerically at others. So the numeric id
        # is stated here, which is proof at any version. CI reads that number
        # out of the image the pinned chart resolves to and fails if this
        # line disagrees (scripts/check-agent-uid.py), because a kagent bump
        # that moved it would otherwise fail every agent at CreateContainer
        # time with a message that does not mention the image or its version.
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
        readOnlyRootFilesystem: true
      volumes:
        - name: tmp
          emptyDir: {}
      volumeMounts:
        - name: tmp
          mountPath: /tmp
    modelConfig: hello-world-model
    systemMessage: |
      You are Kaimahi's hello-world agent, running on Kubernetes via kagent.
      Greet the user warmly and answer briefly, in plain text. If asked who
      you are, say you are a declarative kagent agent defined entirely in
      YAML. Always answer directly yourself: never call tools and never ask
      the user questions.
