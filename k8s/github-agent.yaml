# The GitHub demo agent: reads issues and pull requests on a repository
# through GitHub's hosted MCP server — the first tool upstream the
# gateway reaches over the internet — and never holds the GitHub token.
#
# `make govern-github` gives its credential exactly two READ tools
# (list_issues, list_pull_requests). A write tool (issue_write) is named
# in the SELECTION below but is NOT allowlisted: calling it is the action
# a human approves, denied → filed → granted with bounds. The token
# in plane custody is read-only too, so even a granted write stops at
# GitHub: two independent layers.
#
# It runs the GOVERNED Copilot preset — relaying a tool payload the
# size of a GitHub listing is beyond qwen2.5:3b, and one demo then
# exercises spend governance and tool governance together. CI never runs
# this agent: CI is keyless and holds no GitHub or Copilot token, ever;
# it proves the same path against a synthetic hosted upstream.
apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: hello-github
  namespace: kagent
spec:
  description: Kaimahi's GitHub demo agent — reads what is open on a repository through the governed gateway.
  type: Declarative
  declarative:
    modelConfig: governed-copilot
    # The agent pod runs model output; it is the LEAST trusted workload here
    # and was, until now, the least constrained. kagent exposes the fields
    # (spec.declarative.deployment, v1alpha2) — we simply were not setting
    # them. Same posture as k8s/plane/proxy.yaml and k8s/erp-mcp.yaml.
    # A read-only root filesystem needs somewhere to write: the runtime uses
    # /tmp, mounted here as an emptyDir rather than left writable everywhere.
    deployment:
      podSecurityContext:
        runAsNonRoot: true
        # kagent's agent image declares its user by NAME (`python`), and
        # Kubernetes refuses to start a runAsNonRoot container it cannot
        # prove is non-root: "image has non-numeric user (python)". So the
        # numeric id has to be stated here. 1001 is what that image runs
        # as at 0.9.12. CI reads that number out of the image the pinned
        # chart resolves to and fails if this line disagrees
        # (scripts/check-agent-uid.py), because a kagent bump that moved it
        # would otherwise fail every agent at CreateContainer time with a
        # message that does not mention the image or its version.
        runAsUser: 1001
        seccompProfile:
          type: RuntimeDefault
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
        readOnlyRootFilesystem: true
      volumes:
        - name: tmp
          emptyDir: {}
      volumeMounts:
        - name: tmp
          mountPath: /tmp
      resources:
        requests:
          cpu: 50m
          memory: 320Mi
        limits:
          memory: 1Gi
    systemMessage: |
      You are Kaimahi's GitHub demo agent, running on Kubernetes via kagent.
      Your GitHub tools reach GitHub through Kaimahi's governance gateway.

      When the user asks what is open on a repository, call list_issues
      and list_pull_requests with the owner and repo the user names (use
      state "open", perPage 10). Answer ONLY from the tool output: list
      each open item as "#<number> <title>", issues first, then pull
      requests, and say how many of each there are. Never invent numbers
      or titles; if a tool returns nothing, say so.

      If the user asks you to create, edit, close or comment on anything,
      call the tool for it once (issue_write). If a tool call is DENIED,
      say so plainly, quote the denial message verbatim, and stop. A
      denial is the system working: a human has to approve the action.
      Never try a different tool to get around it, and never claim you
      changed something you did not change.

      Answer briefly in plain text. Never ask the user questions.
    tools:
      - type: McpServer
        mcpServer:
          apiGroup: kagent.dev
          kind: RemoteMCPServer
          name: kaimahi-github
          # toolNames is the agent's SELECTION, not a grant: kagent wires
          # (discovered ∩ toolNames) and discovery runs through the
          # gateway, so issue_write is listed here without conferring
          # anything — while the credential cannot call it, the gateway
          # does not project it and the agent has no such tool. Naming it
          # is what lets an APPROVAL take effect without editing the
          # agent. The authority is the plane's allowlist
          # (make tool-allowlist CRED_TOOLS=hello-github), never this file.
          toolNames:
            - list_issues
            - list_pull_requests
            - issue_write
