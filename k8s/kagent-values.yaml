# Helm values for the kagent chart: the hello-world install and its tools.
#
# Three jobs only:
#  1. Point kagent's default model provider at the in-cluster Ollama service
#     (keyless — no API-key Secret anywhere in this phase).
#  2. Turn off the chart's sample agents and unused optional tool servers so
#     the demo cluster contains exactly the agents we define.
#  3. Re-enable kagent's own bundled MCP tool server (kagent-tools),
#     locked down as far as its knobs go — k8s tools only, read-only RBAC
#     with no Secrets access, writes disabled at the app layer too. The
#     chart itself publishes it as the `kagent-tool-server` RemoteMCPServer.
#     These tools remain direct kagent calls. The model plane adds no
#     tool permits, tool audit, or tool egress enforcement.
controller:
  # Pinned off, though it is also the chart's default. When true, kagent
  # rewrites every RemoteMCPServer URL and its own tool-discovery dial from
  # https back to http — for clusters where a sidecar proxy originates TLS
  # instead. Do not silently downgrade an operator's HTTPS tool endpoint
  # while its RemoteMCPServer still carries an inert `tls:` block.
  mcpEgressPlaintext: false

providers:
  default: ollama
  ollama:
    provider: Ollama
    model: qwen2.5:3b
    config:
      host: http://ollama.ollama.svc.cluster.local:11434

k8s-agent:
  enabled: false
kgateway-agent:
  enabled: false
istio-agent:
  enabled: false
promql-agent:
  enabled: false
observability-agent:
  enabled: false
argo-rollouts-agent:
  enabled: false
helm-agent:
  enabled: false
cilium-policy-agent:
  enabled: false
cilium-manager-agent:
  enabled: false
cilium-debug-agent:
  enabled: false

kagent-tools:
  enabled: true
  tools:
    # k8s provider only — no helm/istio/cilium/argo/prometheus tool surface.
    enabledTools:
      - k8s
    # Belt and braces with rbac.readOnly: refuse write operations in the
    # application layer as well as at the API server.
    args:
      - --read-only
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi
  rbac:
    # Read-only ClusterRole (get/list/watch) instead of the default
    # cluster-admin; allowSecrets stays false, so the tool server cannot
    # read Secrets even though the agent can ask it about the cluster.
    readOnly: true
grafana-mcp:
  enabled: false
querydoc:
  enabled: false
