# The Slack MCP server, deployed BY kagent, running IN cluster.
#
# Kaimahi writes no connector code (prime directive). This is an existing,
# third-party MCP server deployed through kagent's own MCPServer CRD:
#
#   ghcr.io/korotovsky/slack-mcp-server — MIT, 1.8k stars, actively
#   maintained (v1.3.0, 2026-05-14). Pinned BY DIGEST, not by tag: this
#   image holds a Slack workspace token, so the bytes that run must be
#   the bytes that were reviewed. The npm reference server
#   @modelcontextprotocol/server-slack was rejected — npm marks it
#   "no longer supported" with no publish since 2025-04-25.
#   Provenance and the survey: docs/slack.md.
#
# CUSTODY. The bot token reaches this pod and nowhere else:
#   - it is NEVER in this file. kagent renders `secretRefs` as
#     `envFrom.secretRef` (verified against the live 0.9.12 CRD), so the
#     Secret's keys become this container's env — while `spec.deployment.env`
#     below is plaintext YAML and therefore carries only non-secret knobs.
#   - the Secrets are captured stdin-only by scripts/slack-secret.sh.
#   - this server lives in the PLANE's namespace, not the agent's: the
#     kagent namespace holds only the agent's opaque kmh_ token.
#
# EGRESS. This is the FIRST pod in this repo with deliberate internet
# egress (api.slack.com). k8s/plane/network-policy.yaml bounds it to DNS
# and TCP 443 to non-private addresses, and admits only the proxy inbound
# — an IP/port rule, not a URL allowlist; see docs/egress.md.
#
# --no-cache is deliberate: the server's optional user/channel caches
# would pull a directory of the whole workspace into this pod. Tools are
# addressed by channel ID instead.
apiVersion: kagent.dev/v1alpha1
kind: MCPServer
metadata:
  name: kaimahi-slack-mcp
  namespace: kaimahi
spec:
  transportType: http
  httpTransport:
    path: /mcp
    targetPort: 13080
  deployment:
    image: ghcr.io/korotovsky/slack-mcp-server@sha256:35cbc988d9282409e27b755957e48a6096fcf037dee72118e97177fe38b1a1b3
    cmd: mcp-server
    args: ["-transport", "http", "-no-cache"]
    port: 13080
    env:
      # Non-secret only. The token, the post-tool channel restriction and
      # the gateway key all arrive via secretRefs.
      SLACK_MCP_HOST: "0.0.0.0"
      SLACK_MCP_PORT: "13080"
      SLACK_MCP_LOG_LEVEL: "info"
    secretRefs:
      # SLACK_MCP_XOXB_TOKEN + SLACK_MCP_ADD_MESSAGE_TOOL (the channel-ID
      # restriction on posting — a workspace-identifying value that must
      # not sit in a public repo, so it rides the Secret too).
      - name: kaimahi-slack-bot
      # SLACK_MCP_API_KEY: the gateway injects this upstream credential
      # from plane custody. Declared for the day the server honours it —
      # v1.3.0 does NOT enforce it on the http transport (measured; see
      # the runbook). It is not load-bearing today.
      - name: kaimahi-slack-mcp-key
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        memory: 256Mi
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: [ALL]
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 65532
    podSecurityContext:
      seccompProfile:
        type: RuntimeDefault
