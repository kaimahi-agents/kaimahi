# The release agent — the first thing Kaimahi is used FOR rather than
# demonstrated with. It helps cut a real release of a real project:
# it reads what merged since the last release and DRAFTS the notes, then
# proposes and performs the steps a human approves.
#
# What it is allowed to be good at is judgement. Collating a release note
# out of forty merged pull-request titles — deciding what a user of the
# product would care about, what is one line and what is none, what a
# terse title actually means — is the part a script does badly and the
# only part that earns an LLM its place here. Everything else it does is
# telling other systems to act.
#
# What it never does, and cannot:
#   - carry bytes. Build artifacts do not pass through the gateway (the
#     request body cap is 4 MiB, and an MCP gateway moving binaries would
#     be the wrong tool at any size). It DISPATCHES the workflow and the
#     pipeline that build and publish; they move the bytes.
#   - decide to ship. Every consequential call is denied by default, files
#     an approval request carrying the exact call, and proceeds only under
#     a grant welded to that call. Approving "cut release/v1.2.3"
#     cannot be spent on v1.2.4.
#   - reach a second repository. The token in plane custody is scoped to
#     one; the read tools carry a standing constraint naming it
#     (make release-bind); the upstream table names one server per seam.
#
# It runs the GOVERNED Copilot preset: summarising forty pull
# requests is beyond qwen2.5:3b, and one agent then exercises spend
# governance and tool governance together. CI never runs this agent — CI
# is keyless and holds no GitHub, Azure or Copilot token, ever; it proves
# the same decisions against the synthetic hosted upstream.
apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: release-agent
  namespace: kagent
spec:
  description: Kaimahi's release agent — drafts the notes, proposes the release, and never decides to ship.
  type: Declarative
  declarative:
    modelConfig: governed-copilot
    deployment:
      resources:
        requests:
          cpu: 50m
          memory: 320Mi
        limits:
          memory: 1Gi
      # This was the only committed agent without a security context, and it
      # is the one holding the write-scoped GitHub credential and the Azure
      # DevOps seam — so it was the least constrained pod with the most
      # authority behind it. Same block as the other five agents, which run
      # the same image.
      #
      # runAsUser is not decoration: kagent's image declares its user by NAME
      # (`python`), and Kubernetes refuses to start a runAsNonRoot container
      # whose user it cannot prove is non-root — "image has non-numeric user
      # (python)", at CreateContainer time, with no mention of the image or
      # its version. 1001 is what that image runs as at 0.9.12; CI reads that
      # number out of the image the pinned chart resolves to and fails if
      # this line disagrees (scripts/check-agent-uid.py).
      #
      # A read-only root filesystem needs somewhere to write, so /tmp is an
      # emptyDir. The agent only makes MCP calls; the release artifacts are
      # moved by the driver on the operator's machine, not by this pod.
      podSecurityContext:
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile:
          type: RuntimeDefault
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
        readOnlyRootFilesystem: true
      volumes:
        - name: tmp
          emptyDir: {}
      volumeMounts:
        - name: tmp
          mountPath: /tmp
    systemMessage: |
      You help cut software releases. Your tools reach GitHub and Azure
      DevOps through Kaimahi's gateway.

      ONE STEP PER TURN. Do what this turn asks. Don't run ahead.

      ONLY SAY WHAT A TOOL TOLD YOU. Every number, title, tag, branch,
      build id and status has to come from a tool response in this
      conversation. If you didn't read it from a tool, you don't know it.

      NEVER CLAIM A STEP YOU DIDN'T FINISH. If a call fails, is denied, or
      returns something odd: say so, quote it exactly, stop. Don't reach
      for a different tool to get around it. "I couldn't, and here's what
      it said" is a good answer. Claiming something you didn't do is the
      worst thing you can do here, because someone will act on it.

      A DENIAL IS THE SYSTEM WORKING. Consequential calls stay denied
      until a human approves that exact call. Quote the denial, say which
      call was refused and with what arguments, stop.

      WHAT YOU DO:

      1. What shipped last — get_latest_release, list_tags.

      2. What merged since — list_pull_requests, state closed, the base
         branch you're given, sort updated, direction desc. Closed isn't
         merged: only count ones with merged_at set, after the last
         release. Ask for the fields you need and no more; the listing
         doesn't fit in your context with bodies in it.
         Prefer list_pull_requests over search tools — it takes owner and
         repo as real arguments, so the gateway can see which repository
         you're reading.

      3. Draft the notes. This is the part that's yours. Short bullets
         about what changed for someone using the product, not commit
         subjects. Group related work. Skip dependency bumps and CI-only
         changes unless a user would notice. If a PR title says nothing
         useful, list it separately with its number rather than inventing
         a meaning. When asked for a release BODY, read the previous
         release's notes first and match that style — output only the
         notes, no preamble and no explanation of how you got there.

      4. Cut the branch — create_branch with the owner, repo, branch and
         from_branch you're given.

      5. Start the builds — actions_run_trigger (method run_workflow) for
         GitHub, pipelines_write (action run_pipeline) for Azure DevOps.
         Report the ids they return.

      6. Report progress — actions_list / actions_get for GitHub runs,
         pipelines_build (action get_status) for Azure DevOps. Quote the
         status. If something failed, read pipelines_build_log and say
         what the log says. Don't guess at a cause.

      Steps 4 and 5 are denied until approved. That's expected.

      Answer briefly, plain text, no preamble. Don't ask questions — if
      something's missing, say what.
    tools:
      - type: McpServer
        mcpServer:
          apiGroup: kagent.dev
          kind: RemoteMCPServer
          name: kaimahi-release-github
          # toolNames is the agent's SELECTION, not a grant: kagent wires
          # (discovered ∩ toolNames) and discovery runs through the
          # gateway, so create_branch and actions_run_trigger are listed
          # here without conferring anything — the credential cannot call
          # them, the gateway does not project them, and the agent has no
          # such tool. Naming them is what lets an APPROVAL take effect
          # without editing the agent. The authority is the plane's
          # allowlist (make release-allow), never this file.
          #
          # Nothing destructive is named here, and nothing destructive is
          # offered by the server either: the upstream's extra_headers
          # exclude them.
          toolNames:
            - get_latest_release
            - list_tags
            - list_releases
            - get_release_by_tag
            - list_pull_requests
            - list_commits
            - actions_list
            - actions_get
            - create_branch
            - actions_run_trigger
      - type: McpServer
        mcpServer:
          apiGroup: kagent.dev
          kind: RemoteMCPServer
          name: kaimahi-release-ado
          toolNames:
            - core_list_projects
            - pipelines_definition
            - pipelines_build
            - pipelines_build_log
            - pipelines_write
