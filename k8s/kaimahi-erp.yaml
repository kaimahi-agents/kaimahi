# The ERP seam: a Kaimahi-owned RemoteMCPServer whose URL is the enforcing
# MCP gateway's FOURTH upstream — the demo's fixture ERP (k8s/erp-mcp.yaml).
# Same shape as k8s/kaimahi-tools.yaml, k8s/kaimahi-slack.yaml and
# k8s/kaimahi-github.yaml, one upstream over.
#
# Custody: headersFrom resolves the agent's credential from a Secret
# holding ONLY the Kaimahi-issued kmh_ opaque token (`make govern-ap` mints
# it; the plane stores its sha256). There is no ERP credential to hold —
# the server is keyless and its NetworkPolicy admits the proxy alone — so
# what this token buys is not access to a key but a POSITION in the
# plane's policy: an allowlist, a standing constraint, and an audit row
# with a name on it.
#
# Because kagent's controller discovers tools THROUGH the gateway with
# this credential, status.discoveredTools is the allowlist projection: the
# ERP offers nine tools; the agent sees the six reads plus the one tool it
# carries a standing constraint for. dispute_open and vendor_notify are
# neither allowlisted nor constrained, so they are not projected — naming
# them in the agent below is what lets an APPROVAL make them usable
# without editing the agent.
apiVersion: kagent.dev/v1alpha2
kind: RemoteMCPServer
metadata:
  name: kaimahi-erp
  namespace: kagent
spec:
  description: Kaimahi-governed ERP — the accounts-payable demo's fixture system of record, behind the enforcing MCP gateway
  protocol: STREAMABLE_HTTP
  url: http://kaimahi-mcp-gateway.kaimahi:8081/upstream/erp/mcp
  timeout: 30s
  sseReadTimeout: 5m0s
  terminateOnClose: true
  headersFrom:
    - name: Authorization
      valueFrom:
        type: Secret
        name: kaimahi-ap-token
        key: api-key
