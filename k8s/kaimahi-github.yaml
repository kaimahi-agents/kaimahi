# The GitHub seam: a Kaimahi-owned RemoteMCPServer whose URL is the
# enforcing MCP gateway's THIRD upstream — GitHub's hosted MCP server,
# the first upstream the gateway reaches over the internet (through the
# plane's hardened dialer, docs/hosted-upstreams.md). Same shape as
# k8s/kaimahi-tools.yaml and k8s/kaimahi-slack.yaml, one upstream over.
#
# Custody: headersFrom resolves the agent's credential from a Secret
# holding ONLY the Kaimahi-issued kmh_ opaque token (`make govern-github`
# mints it; the plane stores its sha256). The GitHub token exists only in
# the plane namespace (Secret kaimahi-github-pat, scripts/github-secret.sh)
# and is injected by the gateway — never here, never on the agent.
#
# Because kagent's controller discovers tools THROUGH the gateway with
# this credential, status.discoveredTools is the allowlist projection:
# the hosted server offers dozens of tools; the agent sees only what its
# credential may call right now — two read tools, no write.
apiVersion: kagent.dev/v1alpha2
kind: RemoteMCPServer
metadata:
  name: kaimahi-github
  namespace: kagent
spec:
  description: Kaimahi-governed GitHub — GitHub's hosted MCP server behind the enforcing MCP gateway
  protocol: STREAMABLE_HTTP
  url: http://kaimahi-mcp-gateway.kaimahi:8081/upstream/github/mcp
  # A hosted server answers slower than an in-cluster one, and the dialer
  # re-resolves and re-handshakes on every call by design.
  timeout: 60s
  sseReadTimeout: 5m0s
  terminateOnClose: true
  headersFrom:
    - name: Authorization
      valueFrom:
        type: Secret
        name: kaimahi-github-token
        key: api-key
