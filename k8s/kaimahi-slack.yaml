# The Slack seam: a Kaimahi-owned RemoteMCPServer whose URL is the
# enforcing MCP gateway's SECOND upstream — the in-cluster Slack MCP
# server. Same shape as k8s/kaimahi-tools.yaml, one upstream over.
#
# Custody: headersFrom resolves the agent's credential from a Secret
# holding ONLY the Kaimahi-issued kmh_ opaque token (`make govern-slack`
# mints it; the plane stores its sha256). The Slack bot token exists
# only in the plane namespace, on the MCP server pod — never here, never
# on the agent.
#
# Because kagent's controller discovers tools THROUGH the gateway with
# this credential, status.discoveredTools is the allowlist projection:
# the upstream offers 14 Slack tools; the agent sees only what its
# credential may call right now. Posting is deliberately not among them
# until a human approves it.
apiVersion: kagent.dev/v1alpha2
kind: RemoteMCPServer
metadata:
  name: kaimahi-slack
  namespace: kagent
spec:
  description: Kaimahi-governed Slack — the in-cluster Slack MCP server behind the enforcing MCP gateway
  protocol: STREAMABLE_HTTP
  url: https://kaimahi-mcp-gateway.kaimahi:8081/upstream/slack/mcp
  # The gateway serves TLS under the plane's own authority. `kmx plane`
  # mints it and publishes the authority's CERTIFICATE here as Secret
  # kaimahi-plane-ca — public material naming who to trust, never the
  # private key, which stays in the kaimahi namespace and is mounted into
  # no pod. Two different clients read this: kagent's controller, which
  # discovers tools through the gateway, and the agent pod, which calls
  # them; the controller mounts the Secret into the agent itself, so
  # nothing here needs a pod-spec edit.
  #
  # disableVerify is deliberately absent and must stay absent. A client
  # that skips verification pays for the certificate and buys nothing,
  # while looking like it bought something.
  tls:
    caCertSecretRef: kaimahi-plane-ca
    caCertSecretKey: ca.crt
  timeout: 30s
  sseReadTimeout: 5m0s
  terminateOnClose: true
  headersFrom:
    - name: Authorization
      valueFrom:
        type: Secret
        name: kaimahi-slack-token
        key: api-key
