# The fallback route, and nothing applies this file.
#
# The plane's scrape job is a PodMonitor now (podmonitor.yaml next to this
# one), because that is a namespaced object owned by whoever created it. This
# file is what `kmx lift` PRINTS when a cluster's metrics add-on is too old to
# have the PodMonitor CRD: the same job, written the only other way Azure's
# add-on accepts one.
#
# Azure's metrics add-on reads custom scrape jobs from a ConfigMap named
# ama-metrics-prometheus-config in kube-system, under the key
# prometheus-config, and runs them from its replica pod.
#
# CAUTION, and it is why this is a fallback rather than the route: that
# ConfigMap is cluster-wide and singular. If it already exists it holds every
# other custom scrape job on the cluster, and applying this file over it would
# delete them without saying so. `kmx lift` neither writes it nor reads it —
# merging the job below into yours is deliberately left to you, because it is
# your document.
#
# The job discovers PODS, not a Service, and that is the point rather than an
# implementation detail. The operations port is on no Service on purpose, so a
# scraper that needed one would force the port to be exposed and trade a
# security property for a dashboard. Pod discovery reaches the port exactly
# the way the design intends: through the NetworkPolicy allowance next to this
# file, at the pod's own address.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ama-metrics-prometheus-config
  namespace: kube-system
data:
  prometheus-config: |-
    global:
      scrape_interval: 30s
    scrape_configs:
      - job_name: kaimahi-plane
        # Written on the job rather than left to the global block above,
        # because what a merge prints is the job alone: a global setting your
        # ConfigMap may not have is one this job would silently inherit
        # nothing from.
        scrape_interval: 30s
        scheme: http
        metrics_path: /metrics
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - kaimahi
        relabel_configs:
          # The governance plane's pods only. Everything else in the
          # namespace — the ledger, a fixture server — exposes nothing here.
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep
            regex: kaimahi-proxy
          # And only the operations port. Pod discovery yields one target per
          # declared container port, so without this the scraper would also
          # try the model data port and the admin port —
          # none of which serve metrics, and one of which should never be
          # dialled by anything but a port-forward.
          - source_labels: [__meta_kubernetes_pod_container_port_number]
            action: keep
            regex: "9092"
          # Keep the replica identifiable. The plane runs two, and the series
          # that says a seam has stopped accepting work is per-replica: one
          # degraded replica and one healthy one must not average out to
          # something that looks fine.
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
