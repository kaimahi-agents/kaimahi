# The release agent's Azure DevOps seam — Microsoft's HOSTED Azure
# DevOps MCP server (https://mcp.dev.azure.com/) behind the enforcing MCP
# gateway, on the `ado` upstream.
#
# This is the first upstream in this repo authenticated by Microsoft Entra
# rather than by a long-lived key. The server accepts nothing else: its
# own protected-resource metadata names login.microsoftonline.com and the
# scope https://mcp.dev.azure.com/.default. What makes it reachable from
# here anyway is that Entra's answer is an ordinary bearer token in the
# Authorization header, which is exactly what the gateway already injects
# from custody (kmx credential capture ado, Secret kaimahi-ado-token).
#
# The consequence, written down where it will be met: that token lives
# about an hour. The seam does not break when it dies — the server
# answers 401, the gateway audits it, and nothing is half-done — but a
# release session starts by refreshing it.
#
# The upstream entry sets X-MCP-Toolsets: pipelines, so the server never
# offers the work-item, wiki, repo or test-plan tools. Narrowing at the
# server is the outer of the two rings; the per-credential allowlist is
# the inner one.
apiVersion: kagent.dev/v1alpha2
kind: RemoteMCPServer
metadata:
  name: kaimahi-release-ado
  namespace: kagent
spec:
  description: Kaimahi-governed Azure DevOps — Microsoft's hosted ADO MCP server behind the enforcing MCP gateway
  protocol: STREAMABLE_HTTP
  url: https://kaimahi-mcp-gateway.kaimahi:8081/upstream/ado/mcp
  # The gateway serves TLS under the plane's own authority. `kmx plane`
  # mints it and publishes the authority's CERTIFICATE here as Secret
  # kaimahi-plane-ca — public material naming who to trust, never the
  # private key, which stays in the kaimahi namespace and is mounted into
  # no pod. Two different clients read this: kagent's controller, which
  # discovers tools through the gateway, and the agent pod, which calls
  # them; the controller mounts the Secret into the agent itself, so
  # nothing here needs a pod-spec edit.
  #
  # disableVerify is deliberately absent and must stay absent. A client
  # that skips verification pays for the certificate and buys nothing,
  # while looking like it bought something.
  tls:
    caCertSecretRef: kaimahi-plane-ca
    caCertSecretKey: ca.crt
  # 180s to match EGRESS_HEADER_TIMEOUT on the proxy: the dialer will wait
  # that long for a hosted server's first header, and a shorter timeout
  # here would cut off a call the dialer is still legitimately waiting on.
  # A hosted server also re-resolves and re-handshakes on every call.
  timeout: 180s
  sseReadTimeout: 5m0s
  terminateOnClose: true
  headersFrom:
    - name: Authorization
      valueFrom:
        type: Secret
        name: kaimahi-release-token
        key: api-key
