# The release agent's GitHub seam — GitHub's hosted MCP server behind
# the enforcing MCP gateway, on the `github-release` upstream.
#
# Deliberately a SECOND seam rather than a wider version of the read-only
# GitHub one. `kaimahi-github`
# (k8s/kaimahi-github.yaml) reaches the same server with a READ-ONLY token
# and a read-only allowlist, and it keeps exactly the blast radius it was
# reviewed with. This one reaches it with a token that can change a real
# repository, so it gets its own upstream entry, its own credential and
# its own allowlist.
#
# Custody: headersFrom resolves the agent's credential from a Secret
# holding ONLY the Kaimahi-issued kmh_ opaque token (`make govern-release`
# mints it; the plane stores its sha256). The GitHub token exists only in
# the plane namespace (Secret kaimahi-release-pat,
# kmx credential capture github-release) and is injected by the gateway — never here,
# never on the agent.
#
# The upstream entry also narrows the SERVER: extra_headers set
# X-MCP-Tools and X-MCP-Exclude-Tools, so the dozens of
# write tools this server offers (delete_repository, push_files,
# merge_pull_request, create_or_update_file …) are never offered to us at
# all. status.discoveredTools is therefore already narrow before the
# gateway's allowlist projects it further.
apiVersion: kagent.dev/v1alpha2
kind: RemoteMCPServer
metadata:
  name: kaimahi-release-github
  namespace: kagent
spec:
  description: Kaimahi-governed GitHub for releases — the hosted GitHub MCP server behind the enforcing MCP gateway
  protocol: STREAMABLE_HTTP
  url: https://kaimahi-mcp-gateway.kaimahi:8081/upstream/github-release/mcp
  # The gateway serves TLS under the plane's own authority. `kmx plane`
  # mints it and publishes the authority's CERTIFICATE here as Secret
  # kaimahi-plane-ca — public material naming who to trust, never the
  # private key, which stays in the kaimahi namespace and is mounted into
  # no pod. Two different clients read this: kagent's controller, which
  # discovers tools through the gateway, and the agent pod, which calls
  # them; the controller mounts the Secret into the agent itself, so
  # nothing here needs a pod-spec edit.
  #
  # disableVerify is deliberately absent and must stay absent. A client
  # that skips verification pays for the certificate and buys nothing,
  # while looking like it bought something.
  tls:
    caCertSecretRef: kaimahi-plane-ca
    caCertSecretKey: ca.crt
  # 180s to match EGRESS_HEADER_TIMEOUT on the proxy: the dialer will wait
  # that long for a hosted server's first header, and a shorter timeout
  # here would cut off a call the dialer is still legitimately waiting on.
  # A hosted server also re-resolves and re-handshakes on every call.
  timeout: 180s
  sseReadTimeout: 5m0s
  terminateOnClose: true
  headersFrom:
    - name: Authorization
      valueFrom:
        type: Secret
        name: kaimahi-release-token
        key: api-key
