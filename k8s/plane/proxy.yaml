# The Kaimahi proxy: kagent's governed ModelConfigs point their
# openAI.baseUrl at THIS Service. Real upstream credentials exist only as
# Secrets mounted into this pod; agents carry Kaimahi-issued opaque
# tokens. The admin port (9091) is deliberately NOT exposed by the
# Service — reaching it takes kubectl port-forward to the pod, i.e.
# cluster credentials, and then the admin bearer token. The operations
# port (9092: Prometheus metrics, readiness, liveness) is on no Service
# either; kubelet reaches it for the probes, and a scraper only through
# the explicit NetworkPolicy allowance in network-policy.yaml.
#
# TWO replicas, and the process holds no governance state —
# every budget, grant use, dedupe and decision is exact in Postgres
# under the credential's row lock, so the replicas agree by
# construction and a Service round-robin is safe. What stays per
# replica is stated in docs/operations.md: the inbound token bucket (a
# flood guard, so the effective ceiling is replicas × the configured
# rate), the bounded inbound and notifier queues, and the fail-closed
# breakers. Postgres stays ONE replica (postgres.yaml) — this is a
# stateless plane, not a highly available database.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kaimahi-proxy
  namespace: kaimahi
spec:
  replicas: 2
  # Never below the replica count during a rollout: the new pod must be
  # Ready (Postgres reachable) before an old one goes, so `make plane`
  # and a rebuilt image never leave the seams unanswered.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: kaimahi-proxy
  template:
    metadata:
      labels:
        app: kaimahi-proxy
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      # Spread the two replicas across nodes when there are nodes to
      # spread across; preferred, not required, so a one-node kind
      # cluster (CI) still schedules both.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: kaimahi-proxy
      # The process drains for up to 20 s (main.go); give the kubelet
      # room beyond that before it kills.
      terminationGracePeriodSeconds: 30
      containers:
        - name: proxy
          # Built from plane/Dockerfile and side-loaded into kind by
          # `make plane-image` (never pulled). The tag moves with the
          # phase so a stale side-loaded image can never satisfy a newer
          # manifest silently (imagePullPolicy: Never reuses same-tag
          # images without complaint).
          #
          # `Never` is deliberate and stays the committed default: a
          # side-loaded LOCAL tag must never quietly fall back to PULLING
          # a squattable public name. It is also what makes this file
          # unusable as-is off kind — so the image reference and the pull
          # policy are made environment-dependent rather than edited
          # here: for a registry-backed cluster
          # (AKS, private ACR) scripts/plane-deploy.sh renders both from
          # PLANE_IMAGE / PLANE_PULL_POLICY at deploy time, and the kind
          # path applies this document exactly as committed.
          image: kaimahi-proxy:p15
          imagePullPolicy: Never
          env:
            - name: PGHOST
              value: kaimahi-postgres
            - name: PGDATABASE
              value: kaimahi
            - name: PGUSER
              value: kaimahi
            # How long a hosted upstream may take to START answering.
            # The dialer's default is 60s, which is generous for a tool
            # call and for a short completion. Drafting release notes
            # over a large pull-request listing is neither: a reasoning
            # model can take longer than a minute to its first token, and
            # the 60s bound turned a legitimate call into a 502
            # (docs/release-agent.md). This raises PATIENCE only —
            # every other bound the hardened dialer enforces, and every
            # address it refuses, is unchanged.
            - name: EGRESS_HEADER_TIMEOUT
              value: "180s"
            # Secrets arrive as mounted files only (PGPASSWORD_FILE,
            # ADMIN_TOKEN_FILE defaults) — no secret-valued env vars.
          ports:
            - name: data
              containerPort: 8080
            - name: mcp
              containerPort: 8081
            - name: inbound
              containerPort: 8082
            - name: admin
              containerPort: 9091
            - name: ops
              containerPort: 9092
          volumeMounts:
            - name: upstreams
              mountPath: /etc/kaimahi/upstreams.json
              subPath: upstreams.json
              readOnly: true
            # The operator overlay — one JSON fragment per upstream
            # somebody onboarded, tool servers with `kmx tools add` and
            # model endpoints with `kmx models add`, merged over the
            # committed table above at boot. A whole-directory mount,
            # not subPath: the ConfigMap grows a key per onboarded
            # upstream and subPath would pin this pod to the keys that
            # existed when it started.
            - name: upstreams-overlay
              mountPath: /etc/kaimahi/upstreams.d
              readOnly: true
            - name: pg-secret
              mountPath: /etc/kaimahi/pg
              readOnly: true
            - name: admin-secret
              mountPath: /etc/kaimahi/admin
              readOnly: true
            - name: copilot-cred
              mountPath: /etc/kaimahi/upstream-creds/copilot
              readOnly: true
            - name: orka-cred
              mountPath: /etc/kaimahi/upstream-creds/orka
              readOnly: true
            - name: slack-mcp-cred
              mountPath: /etc/kaimahi/upstream-creds/slack
              readOnly: true
            - name: inbound-signing
              mountPath: /etc/kaimahi/inbound
              readOnly: true
            - name: slack-channel
              mountPath: /etc/kaimahi/slack
              readOnly: true
            - name: notifier-cred
              mountPath: /etc/kaimahi/notifier
              readOnly: true
            - name: github-cred
              mountPath: /etc/kaimahi/upstream-creds/github
              readOnly: true
            - name: github-release-cred
              mountPath: /etc/kaimahi/upstream-creds/github-release
              readOnly: true
            - name: ado-cred
              mountPath: /etc/kaimahi/upstream-creds/ado
              readOnly: true
            - name: upstream-ca
              mountPath: /etc/kaimahi/upstream-ca
              readOnly: true
            # The certificate the two DATA seams serve with. There is no
            # fallback: a seam that quietly served in the clear would look
            # governed to everything that checks and be readable by anything
            # that captures, so the process refuses to start rather than
            # serve without it. `kmx plane` mints it; the authority's private
            # key stays in its own Secret and is mounted nowhere, so this pod
            # can sign handshakes and cannot issue anything.
            - name: seam-tls
              mountPath: /etc/kaimahi/seam-tls
              readOnly: true
          # Two probes that mean different things (plane/internal/ops):
          #   readiness — "route to me": needs Postgres. A Postgres
          #     outage takes every replica out of the Services and
          #     nothing else; they return when it does.
          #   liveness — "restart me": a LOCAL fault only (a data
          #     listener not answering on loopback, a connection pool
          #     checked out with no progress). Never Postgres, never an
          #     upstream — so an outage elsewhere never restarts the
          #     proxy. CI restarts Postgres and asserts the restart
          #     count does not move.
          readinessProbe:
            httpGet:
              path: /readyz
              port: ops
            initialDelaySeconds: 2
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /livez
              port: ops
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            # Two of these fit next to everything else on the 2-CPU CI
            # runner (the node sits at its request ceiling — ci.yml);
            # the rolling update's surge pod is a third for a few
            # seconds. Requests are scheduling promises, not caps.
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
      volumes:
        - name: upstreams
          configMap:
            name: kaimahi-upstreams
        # Optional, and on most clusters absent — an empty overlay
        # is every cluster where nobody has onboarded their own MCP
        # server. `kmx tools add` creates and grows it; this repo's six
        # tool upstreams stay in the committed ConfigMap above, untouched, so
        # the next `kmx plane` cannot discard an operator's entry.
        - name: upstreams-overlay
          configMap:
            name: kaimahi-upstreams-extra
            optional: true
        - name: pg-secret
          secret:
            secretName: kaimahi-pg
        - name: admin-secret
          secret:
            secretName: kaimahi-admin
            items:
              - key: token
                path: token
        - name: copilot-cred
          secret:
            secretName: kaimahi-copilot-token
            # The Copilot upstream is optional: without this Secret the
            # governed ollama path still works and copilot requests fail
            # closed (503 upstream credential unavailable).
            optional: true
        # The ServiceAccount token the seam presents to Orka's OpenAI-
        # compatible endpoint, written by `kmx migrate` (docs/migrate.md).
        # The application it migrates never holds this: it holds a kmh_
        # credential for this plane, and custody of what opens Orka stays
        # here.
        - name: orka-cred
          secret:
            secretName: kaimahi-orka-token
            # Optional, the same contract the other keyed upstreams have:
            # with no Secret the orka upstreams fail closed (503 upstream
            # credential unavailable) and nothing else is affected.
            optional: true
        # The Slack MCP server's OWN bearer credential — the gateway
        # injects it upstream (plane custody, like the Copilot key). The
        # Slack workspace token belongs to the MCP server pod alone: the
        # only key of kaimahi-slack-bot this pod projects is the channel
        # restriction below, never SLACK_MCP_XOXB_TOKEN.
        - name: slack-mcp-cred
          secret:
            secretName: kaimahi-slack-mcp-key
            # Optional, same contract: with no Secret the slack upstream
            # fails closed (503) and every other path is unaffected.
            optional: true
        # Signing secrets for HMAC-authenticated inbound hooks, one
        # key per hook name (scripts/inbound-secret.sh). Plane custody
        # only — the caller holds its own copy, nothing agent-side does.
        # Optional: a signed hook whose secret is absent fails closed
        # (503 "hook signing secret unavailable"); bearer hooks and every
        # other listener are unaffected.
        - name: inbound-signing
          secret:
            secretName: kaimahi-inbound-signing
            optional: true
        # The channel the Slack Events hook may be triggered from —
        # ONE key of the Slack bot Secret (the same value that restricts
        # the MCP server's posting), projected by name so the workspace
        # token in that Secret never reaches this pod. Optional: without
        # it the slack-events hook fails closed (503 "hook channel
        # allowlist unavailable"); nothing else is affected.
        #
        # Next to it, the APPROVERS — the Slack user ids who may
        # approve or deny a request by mentioning the bot — from their
        # own Secret (scripts/slack-approvers.sh), so the id list never
        # rides the bot Secret into the MCP server's environment. A
        # projected volume puts both files in one directory. Optional:
        # without it a command fails closed (503 "hook approver list
        # unavailable") and a question is answered as before.
        - name: slack-channel
          projected:
            sources:
              - secret:
                  name: kaimahi-slack-bot
                  optional: true
                  items:
                    - key: SLACK_MCP_ADD_MESSAGE_TOOL
                      path: channel
              - secret:
                  name: kaimahi-slack-approvers
                  optional: true
                  items:
                    - key: approvers
                      path: approvers
        # The plane's OWN gateway credential, for telling the
        # channel a request is waiting and replying to commands — a kmh_
        # token issued to credential "kaimahi-plane" by `make notify-slack`
        # and allowlisted to the posting tool only. Plane custody like the
        # rest; read per post. Optional: without it nothing is posted and
        # `make approvals` is still the queue.
        - name: notifier-cred
          secret:
            secretName: kaimahi-notifier-token
            optional: true
        # The GitHub hosted MCP server's credential — a fine-grained,
        # read-only, one-repository token (`kmx credential capture github`) —
        # plane custody like the Copilot key: the gateway injects it, the
        # agent never sees it. Optional, same contract: without it the
        # github upstream fails closed (503) and nothing else is affected.
        - name: github-cred
          secret:
            secretName: kaimahi-github-pat
            optional: true
        # The release agent's GitHub credential — a fine-grained,
        # one-repository token that, unlike the read-only one above, can WRITE
        # (Contents: write, the smallest scope that can create a branch;
        # see docs/release-agent.md on why it necessarily also permits
        # deleting one). Separate Secret, separate upstream entry and
        # separate allowlist, so the read-only GitHub seam keeps exactly the
        # blast radius it was reviewed with. Optional, same contract.
        - name: github-release-cred
          secret:
            secretName: kaimahi-release-pat
            optional: true
        # The Azure DevOps credential — a Microsoft Entra ACCESS
        # TOKEN, not a PAT: the hosted ADO MCP server authenticates with
        # Entra only (its own metadata says so). An access token lives
        # about an hour, which is why `kmx credential capture ado` both
        # stores it and reports when it dies. Optional, same contract: without
        # it the ado upstream fails closed (503) and nothing else is
        # affected.
        - name: ado-cred
          secret:
            secretName: kaimahi-ado-token
            optional: true
        # Trust anchors for hosted upstreams that name a ca_file in
        # the table (one PEM per file). Nothing committed uses one — the
        # GitHub server is verified against the system roots — so the
        # mount is empty unless an operator (or CI, for its synthetic
        # stand-in with a throwaway certificate) creates the ConfigMap.
        # A ca_file the table names but the mount lacks refuses the whole
        # config at boot (plane/internal/egress), never one call later.
        - name: upstream-ca
          configMap:
            name: kaimahi-upstream-ca
            optional: true
        # Deliberately NOT optional, like the Postgres password and the
        # admin token above it and unlike every UPSTREAM credential, which
        # can be absent because the path it feeds fails closed on its own.
        # This one feeds the transport, and an absent transport secret has
        # no closed state to fall into — it would simply be plaintext.
        #
        # Two different failures, worth telling apart when one happens. If
        # the Secret is absent the kubelet cannot build the mount and the
        # container never starts, so nothing in the log says anything: the
        # pod sits in ContainerCreating and its events name the Secret. If
        # the mount exists but a file is missing or unreadable, the process
        # starts, refuses, and says which path.
        - name: seam-tls
          secret:
            secretName: kaimahi-plane-seam-tls
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
              - key: ca.crt
                path: ca.crt
---
# A voluntary disruption (a node drain, a cluster upgrade) may take
# one replica at a time, never both. Direct deletes are not evictions
# and bypass this — which is what the CI replica-kill test relies on.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: kaimahi-proxy
  namespace: kaimahi
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: kaimahi-proxy
---
apiVersion: v1
kind: Service
metadata:
  name: kaimahi-proxy
  namespace: kaimahi
spec:
  selector:
    app: kaimahi-proxy
  ports:
    - name: data
      port: 8080
      targetPort: data
---
# The MCP gateway's own address: the URL the Kaimahi-owned
# RemoteMCPServer (k8s/kaimahi-tools.yaml) points kagent at. Same pod as
# the proxy (the gateway is a second data listener in the kaimahi-proxy
# process — zero extra CPU requests on the full CI node); a separate
# Service keeps the tool seam addressable on its own name, and neither
# Service exposes the admin port.
apiVersion: v1
kind: Service
metadata:
  name: kaimahi-mcp-gateway
  namespace: kaimahi
spec:
  selector:
    app: kaimahi-proxy
  ports:
    - name: mcp
      port: 8081
      targetPort: mcp
---
# The inbound bridge's own address: where external events are
# delivered. Same pod (a fourth listener in the kaimahi-proxy process —
# zero extra CPU requests), its own Service so the ingress seam is
# addressable on its own name and can be exposed on its own terms. It is
# a ClusterIP: on kind the demo reaches it via port-forward; exposing it
# beyond the cluster is an opt-in step, `make inbound-expose` on
# TARGET=aks (k8s/inbound-edge.yaml), never a side effect of `make plane`.
# The admin port stays off it.
apiVersion: v1
kind: Service
metadata:
  name: kaimahi-inbound
  namespace: kaimahi
spec:
  selector:
    app: kaimahi-proxy
  ports:
    - name: inbound
      port: 8082
      targetPort: inbound
