# The model proxy forwards exactly one configured path per upstream.
# Credentials stay in plane custody; agents carry only opaque kmh_ tokens.
# Hosted entries require internet: true and the hardened HTTPS dialer.
# Network allowances remain opt-in, outside k8s/plane/.
#
# Free is explicit, never inferred from missing prices. Orka and Copilot
# are metered: a cents budget refuses an unpriced pair; use token budgets
# unless the operator has configured actual prices.
#
# The two Orka entries share one endpoint. client_path is what clients
# send; path is what Orka accepts. The plane translates Responses requests
# to chat completions and meters the upstream's reported usage.
# orka disables Orka's server-side tools; orka-coordinator deliberately
# measures the default coordinator behavior. Both retain model custody.
# Every issued credential can reach these entries; budgets bound spend.
apiVersion: v1
kind: ConfigMap
metadata:
  name: kaimahi-upstreams
  namespace: kaimahi
data:
  upstreams.json: |
    {
      "upstreams": {
        "ollama": {
          "base_url": "http://ollama.ollama.svc.cluster.local:11434",
          "path": "v1/chat/completions",
          "classification": "free"
        },
        "copilot": {
          "base_url": "https://api.githubcopilot.com",
          "path": "chat/completions",
          "classification": "metered",
          "internet": true,
          "credential_file": "/etc/kaimahi/upstream-creds/copilot/api-key",
          "extra_headers": {
            "Copilot-Integration-Id": "vscode-chat",
            "Editor-Version": "vscode/1.103.0"
          }
        },
        "orka": {
          "base_url": "http://orka-api.orka-system.svc.cluster.local:8080/openai",
          "path": "v1/chat/completions",
          "client_path": "v1/responses",
          "classification": "metered",
          "credential_file": "/etc/kaimahi/upstream-creds/orka/token",
          "extra_headers": {
            "X-Orka-Tools": "disabled"
          }
        },
        "orka-coordinator": {
          "base_url": "http://orka-api.orka-system.svc.cluster.local:8080/openai",
          "path": "v1/chat/completions",
          "client_path": "v1/responses",
          "classification": "metered",
          "credential_file": "/etc/kaimahi/upstream-creds/orka/token"
        }
      }
    }
