# Postgres 16: the plane's durable store — credentials (hashes
# only), budgets, and the append-only spend ledger. The password comes
# from the kaimahi-pg Secret (created by scripts/plane-secrets.sh —
# stdin/file-only, never YAML) via POSTGRES_PASSWORD_FILE, so no secret
# value appears in this manifest or in `kubectl describe` env listings.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kaimahi-postgres-data
  namespace: kaimahi
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kaimahi-postgres
  namespace: kaimahi
spec:
  replicas: 1
  strategy:
    type: Recreate # one PVC, one writer
  selector:
    matchLabels:
      app: kaimahi-postgres
  template:
    metadata:
      labels:
        app: kaimahi-postgres
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 70 # postgres uid in the alpine image
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_DB
              value: kaimahi
            - name: POSTGRES_USER
              value: kaimahi
            - name: POSTGRES_PASSWORD_FILE
              value: /etc/kaimahi-pg/password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: pg-secret
              mountPath: /etc/kaimahi-pg
              readOnly: true
          readinessProbe:
            exec:
              command: [pg_isready, -U, kaimahi, -d, kaimahi]
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            # Sized for the 2-CPU CI runner, where the node sits near its
            # CPU-request ceiling and an agent preset switch surges a
            # second 50m pod. Requests are scheduling promises, not caps
            # — with no CPU limit the demo's tiny query load can still
            # burst.
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: kaimahi-postgres-data
        - name: pg-secret
          secret:
            secretName: kaimahi-pg
---
apiVersion: v1
kind: Service
metadata:
  name: kaimahi-postgres
  namespace: kaimahi
spec:
  selector:
    app: kaimahi-postgres
  ports:
    - port: 5432
      targetPort: 5432
