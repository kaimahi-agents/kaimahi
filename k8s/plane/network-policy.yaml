# The model plane's network boundary ships with the plane on every target.
# Policies are additive: default-deny both ways, then exact workload paths.
# Enforcement is not a given; scripts/netpol-probe.sh proves blocked paths
# against a reachable control. IPv6 needs matching dual-stack rules.
#
# Admin 9091 has no pod ingress. kubectl port-forward is node-originated
# and still requires cluster credentials, then the admin bearer.
# Hosted model egress is opt-in: k8s/egress-copilot.yaml and
# k8s/egress-hosted.yaml both allow only public TCP 443. Neither ships here.
# The kagent and ollama namespaces are outside this plane's boundary.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: kaimahi
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
# Authenticated model calls from kagent, and nothing on admin/ops.
# Other application namespaces require their own additive allowance.
# Egress selects the actual pods/target ports, not pre-NAT Service ports.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kaimahi-proxy
  namespace: kaimahi
spec:
  podSelector:
    matchLabels:
      app: kaimahi-proxy
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kagent
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: kaimahi-postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ollama
          podSelector:
            matchLabels:
              app: ollama
      ports:
        - protocol: TCP
          port: 11434
    # Orka's model endpoint, using the same selectors as its Service.
    # With no Orka installed this selects no pod and permits nothing.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: orka-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: orka
              control-plane: controller-manager
      ports:
        - protocol: TCP
          port: 8080
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# Ops has no Service and no authentication. The scraper selectors are
# the access control; kubelet probes are node-originated and need no rule.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kaimahi-proxy-metrics
  namespace: kaimahi
spec:
  podSelector:
    matchLabels:
      app: kaimahi-proxy
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 9092
---
# The ledger accepts only the proxy, and needs no egress, including DNS.
# The probe execs into this real pod to prove the negative.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kaimahi-postgres
  namespace: kaimahi
spec:
  podSelector:
    matchLabels:
      app: kaimahi-postgres
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: kaimahi-proxy
      ports:
        - protocol: TCP
          port: 5432
