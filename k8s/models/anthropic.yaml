# Hosted-model preset: Anthropic (first-party API).
#
# Create the key Secret first — stdin-only, never on an argv or in YAML:
#   make model-secret NAME=anthropic-api-key
# then switch the agent to this preset:
#   make use PRESET=anthropic
apiVersion: kagent.dev/v1alpha2
kind: ModelConfig
metadata:
  name: anthropic
  namespace: kagent
spec:
  provider: Anthropic
  # Any current Claude model ID works; claude-opus-5 is the current default
  # recommendation. Spend on this endpoint is UNGOVERNED: it does not go
  # through the Kaimahi proxy, so nothing meters it.
  model: claude-opus-5
  apiKeySecret: anthropic-api-key
  apiKeySecretKey: api-key
  anthropic: {}
