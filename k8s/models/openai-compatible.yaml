# Hosted-model preset: any OpenAI-compatible endpoint (template).
#
# Copy or edit this for LiteLLM gateways, vLLM, llama.cpp servers, or any
# other endpoint speaking the OpenAI chat-completions protocol. This is also
# the seam where Kaimahi's governance proxy mounts (baseUrl -> proxy).
#
# Edit before use: baseUrl and model.
#
#   make model-secret NAME=openai-compatible-api-key
#   make use PRESET=openai-compatible
apiVersion: kagent.dev/v1alpha2
kind: ModelConfig
metadata:
  name: openai-compatible
  namespace: kagent
spec:
  provider: OpenAI
  model: gpt-4o-mini
  apiKeySecret: openai-compatible-api-key
  apiKeySecretKey: api-key
  openAI:
    baseUrl: https://llm.example.com/v1
