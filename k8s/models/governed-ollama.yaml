# GOVERNED preset: the in-cluster Ollama free tier, routed through the
# Kaimahi model proxy. The baseUrl is the proxy, not the model server —
# every call is authenticated, budget-checked, and ledgered.
#
# Custody: apiKeySecret holds a Kaimahi-ISSUED opaque token (minted by
# `make govern`), not a real upstream key. Ollama needs no key at all and
# never receives one; the token exists so the proxy can attribute and
# enforce. Keys never reach the agent — that is the point.
#
#   make plane && make govern     # deploy the plane, issue the token,
#                                 # switch hello-world to this preset
apiVersion: kagent.dev/v1alpha2
kind: ModelConfig
metadata:
  name: governed-ollama
  namespace: kagent
spec:
  provider: OpenAI
  model: qwen2.5:3b
  apiKeySecret: kaimahi-governed-token
  apiKeySecretKey: api-key
  openAI:
    baseUrl: http://kaimahi-proxy.kaimahi.svc.cluster.local:8080/upstream/ollama/v1
