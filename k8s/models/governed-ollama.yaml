# GOVERNED preset: the in-cluster Ollama free tier, routed through the
# Kaimahi model proxy. The baseUrl is the proxy, not the model server —
# every call is authenticated, budget-checked, and ledgered.
#
# Custody: apiKeySecret holds a Kaimahi-ISSUED opaque token (minted by
# `make govern`), not a real upstream key. Ollama needs no key at all and
# never receives one; the token exists so the proxy can attribute and
# enforce. Keys never reach the agent — that is the point.
#
#   make plane && make govern     # deploy the plane, issue the token,
#                                 # switch hello-world to this preset
apiVersion: kagent.dev/v1alpha2
kind: ModelConfig
metadata:
  name: governed-ollama
  namespace: kagent
spec:
  provider: OpenAI
  model: qwen2.5:3b
  apiKeySecret: kaimahi-governed-token
  apiKeySecretKey: api-key
  # The proxy serves TLS under the plane's own authority. `kmx plane` mints
  # it and publishes the authority's CERTIFICATE into this namespace as
  # Secret kaimahi-plane-ca; the controller mounts it into the agent pod,
  # so nothing here needs a pod-spec edit. The private key stays in the
  # kaimahi namespace and is mounted into no pod at all.
  #
  # This block is what makes the https baseUrl below mean something. A
  # ModelConfig is admitted with a TLS block beside an http:// baseUrl and
  # with an https:// baseUrl and no TLS block, and neither is refused — so
  # the two have to be changed together by whoever changes either.
  #
  # disableVerify is deliberately absent and must stay absent.
  tls:
    caCertSecretRef: kaimahi-plane-ca
    caCertSecretKey: ca.crt
  openAI:
    baseUrl: https://kaimahi-proxy.kaimahi.svc.cluster.local:8080/upstream/ollama/v1
