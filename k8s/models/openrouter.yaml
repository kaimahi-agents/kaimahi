# Hosted-model preset: OpenRouter (multi-provider gateway).
#
# kagent 0.9.12 has no OpenRouter provider; OpenRouter is OpenAI-compatible,
# so this rides `provider: OpenAI` with a baseUrl override. Model IDs are
# OpenRouter-namespaced (vendor/model).
#
#   make model-secret NAME=openrouter-api-key
#   make use PRESET=openrouter
apiVersion: kagent.dev/v1alpha2
kind: ModelConfig
metadata:
  name: openrouter
  namespace: kagent
spec:
  provider: OpenAI
  model: openai/gpt-4o-mini
  apiKeySecret: openrouter-api-key
  apiKeySecretKey: api-key
  openAI:
    baseUrl: https://openrouter.ai/api/v1
