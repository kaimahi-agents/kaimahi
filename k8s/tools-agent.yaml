# The hello-world topology grown a connector — as code.
#
# A second declarative Agent that thinks with the same keyless in-cluster
# model as the hello-world agent but can additionally call an MCP tool. The
# tool server is not
# ours: kagent's own bundled kagent-tools server (enabled in
# k8s/kagent-values.yaml, locked to read-only k8s tools) is published by the
# kagent chart as the `kagent-tool-server` RemoteMCPServer, and this Agent
# wires to it via spec.declarative.tools — kagent's native MCP mechanism.
# Kaimahi ships no MCP gateway. This is direct kagent tool authoring.
#
# k8s/hello-world.yaml is deliberately never mutated: its
# agent stays tool-free, and this file is the diff that "allows connectors".
#
# WARNING: these tools are UNGOVERNED. The single-tool allowlist below and the
# tool server's read-only lockdown are the only tool limits. The model
# plane does not add tool permits or tool auditing.
apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: hello-tools
  namespace: kagent
spec:
  description: Hello-world agent with one MCP tool — reads live cluster state.
  type: Declarative
  declarative:
    # Reuses the hello-world ModelConfig (keyless in-cluster Ollama, qwen2.5:3b).
    modelConfig: hello-world-model
    # CI runners are 2-CPU and total node requests already run
    # ~95% with the default agent request of 100m — halve it so the tool
    # path still schedules there.
    # The agent pod runs model output; it is the LEAST trusted workload here
    # and was, until now, the least constrained. kagent exposes the fields
    # (spec.declarative.deployment, v1alpha2) — we simply were not setting
    # them. Same posture as k8s/plane/proxy.yaml.
    # A read-only root filesystem needs somewhere to write: the runtime uses
    # /tmp, mounted here as an emptyDir rather than left writable everywhere.
    deployment:
      podSecurityContext:
        runAsNonRoot: true
        # kagent's agent image declares its user by NAME (`python`), and
        # Kubernetes refuses to start a runAsNonRoot container it cannot
        # prove is non-root: "image has non-numeric user (python)". So the
        # numeric id has to be stated here. 1001 is what that image runs
        # as at 0.9.12. CI reads that number out of the image the pinned
        # chart resolves to and fails if this line disagrees
        # (scripts/check-agent-uid.py), because a kagent bump that moved it
        # would otherwise fail every agent at CreateContainer time with a
        # message that does not mention the image or its version.
        runAsUser: 1001
        seccompProfile:
          type: RuntimeDefault
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
        readOnlyRootFilesystem: true
      volumes:
        - name: tmp
          emptyDir: {}
      volumeMounts:
        - name: tmp
          mountPath: /tmp
      resources:
        requests:
          cpu: 50m
          memory: 320Mi
        limits:
          memory: 1Gi
    systemMessage: |
      You are Kaimahi's tools demo agent, running on Kubernetes via kagent.
      You have one tool: k8s_get_resources, which lists live Kubernetes
      resources. Whenever the user asks about the cluster (pods, services,
      configmaps, namespaces...), you MUST call k8s_get_resources and answer
      only from its output — never from memory, and never invent resource
      names. The tool returns a table whose first column is NAME: copy every
      value in that column into your answer verbatim, one per line, exactly
      as spelled. If the table has data rows, never say nothing was found.
      Answer briefly in plain text. Never ask the user questions.
    tools:
      - type: McpServer
        mcpServer:
          apiGroup: kagent.dev
          kind: RemoteMCPServer
          name: kagent-tool-server
          # Allowlist a single read-only tool. The server offers eight
          # k8s_* read tools; one keeps the small local model reliable and
          # the ungoverned surface minimal until governed tool permits exist.
          toolNames:
            - k8s_get_resources
