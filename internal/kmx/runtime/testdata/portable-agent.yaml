apiVersion: kmx.kaimahi.dev/v1alpha1
kind: PortableAgent
metadata:
  name: hello
spec:
  instructions: You are a helpful, careful agent. Answer briefly.
  model:
    name: gpt-4o-mini
extensions:
  orka:
    apiVersion: core.orka.ai/v1alpha1
    namespace: orka-system
    provider:
      type: openai
      defaultModel: gpt-4o-mini
      secretRef:
        name: hello-key
        key: api-key
      rateLimit:
        requestsPerMinute: 60
    agent:
      tools:
        - name: web-search
      skills:
        - name: triage
      rateLimit:
        requestsPerMinute: 30
  kagent:
    apiVersion: kagent.dev/v1alpha3
    namespace: kagent-system
    harnessRef:
      name: kagent
    modelConfigRef:
      name: local-ollama
    promptTemplate: Answer plainly and cite sources.
    tools:
      mcp:
        - server:
            kind: RemoteMCPServer
            name: filesystem
          tools:
            - read-file
          requireApproval: false
      agents:
        - name: researcher
          description: Delegate deep research subtasks to a specialized agent.
          templateRef:
            name: research-template
          isolation: Shared
    skills:
      - name: triage
        source:
          oci: ghcr.io/kaimahi/skills/triage@sha256:a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1
    plugins:
      - source:
          git:
            url: https://github.com/kaimahi-agents/plugins
            commit: b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2
        skills:
          - audit-log
