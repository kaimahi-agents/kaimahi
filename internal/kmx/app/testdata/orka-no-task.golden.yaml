# Local schema validation does not evaluate CEL or server admission.
# Use the explicit namespace that the Orka controller watches.
# Do not bulk-apply this bundle. The Secret skeleton is a named prerequisite,
# not a credential: provision its referenced key separately; never write this skeleton.
# Create Provider only, wait for current-generation Ready; then create Agent
# and wait for current-generation Ready; only then create the optional Task.
# Schema support for rate limits is not proof of runtime enforcement.
---
apiVersion: v1
kind: Secret
metadata:
    name: support-bot-key
    namespace: orka-system
---
apiVersion: core.orka.ai/v1alpha1
kind: Provider
metadata:
    name: support-bot
    namespace: orka-system
spec:
    defaultModel: gpt-4o-mini
    rateLimit:
        tokensPerMinute: 100000
    secretRef:
        key: api-key
        name: support-bot-key
    type: openai
---
apiVersion: core.orka.ai/v1alpha1
kind: Agent
metadata:
    annotations:
        kaimahi.dev/description: Customer support triage agent
    name: support-bot
    namespace: orka-system
spec:
    providerRef:
        name: support-bot
        namespace: orka-system
    rateLimit:
        requestsPerMinute: 60
    skills:
        - name: triage
        - name: summarize
    systemPrompt:
        inline: You are support-bot. Answer briefly and in plain text, and say plainly when you do not know something.
    tools:
        - name: web-search
        - name: ticket-lookup
