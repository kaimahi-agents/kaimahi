apiVersion: kmx.kaimahi.dev/v1alpha1
kind: PortableAgent
metadata:
    name: sample
spec:
    instructions: Answer briefly and say plainly when you do not know something.
    description: Golden sample agent
    model:
        name: gpt-4o-mini
extensions:
    orka:
        apiVersion: core.orka.ai/v1alpha1
        provider:
            rateLimit:
                requestsPerMinute: 120
                tokensPerMinute: 240000
        agent:
            tools:
                - name: search
                - name: read
            skills:
                - name: summarize
            rateLimit:
                requestsPerMinute: 30
                tokensPerMinute: 60000
