apiVersion: kmx.kaimahi.dev/v1alpha1
kind: Tool
metadata:
  name: web-search
spec:
  description: Search the web and return the top results
  parameters:
    type: object
    required:
      - query
    properties:
      query:
        type: string
  http:
    method: POST
    url: https://search.example.com/query
    timeout: 30s
    credentials:
      secret:
        name: search-credentials
        key: api-key
