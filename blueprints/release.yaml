# The release agent's workflow, declared as a blueprint: one file, one driver.
#
# This file is the SHAPE of the workflow. It carries no repository, no
# organization, no project and no token — those are `parameters`, supplied
# with --set at apply time, which is what keeps somebody's real project out
# of a public repository's tree and keeps kmx's rule that it accepts no
# credential material true of a file format as well as of a flag.
#
# What it replaced, and this is the point of a blueprint: the same intent
# used to live in five places at once —
#
#   k8s/release-agent.yaml       the drill in `systemMessage`, and `toolNames`
#   k8s/plane/upstreams.yaml     policy_fields, extra_headers, the seams
#   make release-allow           the credential's allowlist
#   a release-specific binder   the old standing-constraint implementation
#   a release-specific driver   the old orchestration implementation
#
# Three of those five are here. The two that are NOT, deliberately:
#
#   - the upstream ENTRIES. `github-release` and `ado` are hosted, keyed
#     seams, and plane/internal/config/overlay.go refuses an overlay entry
#     that sets credential_file, credential_header, internet, ca_file or
#     extra_headers — together they are an exfiltration primitive. So a
#     hosted seam is reviewed in the committed table and NAMED here. What
#     this file does instead is `requires`: it states the policy_fields it
#     depends on, and kmx refuses to apply anything if the running table
#     disagrees.
#   - the agent's systemMessage. kagent owns the Agent CRD; a blueprint
#     that rewrote an agent's brief would be a second authority over what
#     the agent is. The step prompts below are what each turn is asked,
#     and they are this file's.
#
# Apply the governance:
#
#   kmx workflow govern release --set repo=owner/name
#   kmx workflow govern release --set repo=owner/name \
#       --set ado_org=<org> --set ado_project=<project> --set ado_pipelines=41,42
#
# Run it:
#
#   kmx workflow run release --set repo=owner/name --set version=v1.2.3 \
#       --set gh_workflows=build-app-win.yml,build-app-mac.yml \
#       --set ado_org=<org> --set ado_project=<project> --set ado_pipelines=41,42
#
# Start with --dry-run: it reads, drafts the notes, and stops before the
# first consequential call.
# Refresh the short-lived credentials without running a step with:
#
#   kmx workflow refresh release
blueprint: v1
name: release
summary: Cut a GitHub release from Azure DevOps and GitHub Actions builds — the agent drafts and proposes, a human approves, CI moves the bytes.

credential: release-agent
agent: release-agent

parameters:
  repo:
    type: github_repo
    required: true
    help: the GitHub repository, as owner/name. The token in plane custody reaches exactly one, and the standing constraint below names it.
    pattern: '^[A-Za-z0-9][A-Za-z0-9-]{0,38}/[A-Za-z0-9._-]{1,100}$'
  version:
    type: string
    # Every step that reads ${release_branch} needs it, because that
    # parameter defaults from this one. Without the full list, `--step
    # build-github` would bind cleanly and then fail on an unresolved
    # reference after preflight — a refusal in the wrong place.
    required_for: [compose, cut, build-github, watch-github, publish]
    help: the release being cut, e.g. v1.2.3
    pattern: '^[A-Za-z0-9][A-Za-z0-9._+-]{0,99}$'
  base:
    type: string
    default: main
    help: the branch the release is cut from
    pattern: '^[A-Za-z0-9._/-]{1,200}$'
  release_branch:
    type: string
    default: release/${version}
    help: the branch to create
    pattern: '^[A-Za-z0-9._/-]{1,200}$'
  gh_workflows:
    type: string_list
    help: GitHub Actions workflow files to dispatch, comma-separated
  ado_org:
    type: string
    help: the Azure DevOps organization. The hosted server is reached at its org-less URL, so every call names it — and it is an Azure identifier, passed in and never committed.
    pattern: '^[A-Za-z0-9][A-Za-z0-9-]{0,62}$'
  ado_project:
    type: string
    help: the Azure DevOps project the pipelines live in
    pattern: '^[A-Za-z0-9][A-Za-z0-9 ._-]{0,63}$'
  ado_pipelines:
    type: int_list
    needs: [ado_org, ado_project]
    help: pipeline definition ids to queue, comma-separated. These are BOUNDED, not approved — see the `bound` block below.
  ado_builds:
    type: int_list
    needs: [ado_org, ado_project]
    required_for: [publish]
    help: >-
      the BUILD ids whose artifacts the release gets. These are produced by
      the build step, so they are not known when the run starts — which is
      exactly why they are a parameter and not something read out of an
      agent's reply. Pass them on the resumed run (--step publish); the
      driver files the approval from what you type, never from what the
      model said.
  notes_file:
    type: string
    required_for: [publish]
    help: >-
      a durable local file containing the release notes. Publish runs may be
      resumed in a new process, so they never depend on a temporary capture
      from an earlier compose step.
  ado_artifacts:
    type: string_list
    help: artifact names to attach (omit for all)
  asset_globs:
    type: string_list
    help: which files inside the artifacts count as release assets
  prerelease:
    type: string
    default: "1"
    help: whether the published GitHub release is marked as a prerelease (1 or 0)
    pattern: '^[01]$'

seams:
  # GitHub's hosted MCP server. Committed as `github-release` in
  # k8s/plane/upstreams.yaml, where its X-MCP-Tools allowlist and
  # X-MCP-Exclude-Tools live — the strongest of the four layers, because it
  # does not depend on Kaimahi's own bookkeeping.
  github-release:
    requires:
      get_latest_release:  [owner, repo]
      get_release_by_tag:  [owner, repo, tag]
      list_releases:       [owner, repo]
      list_tags:           [owner, repo]
      list_pull_requests:  [owner, repo, state, base]
      list_commits:        [owner, repo, sha]
      actions_list:        [method, owner, repo, resource_id]
      actions_get:         [method, owner, repo, resource_id]
      create_branch:       [owner, repo, branch, from_branch]
      actions_run_trigger: [method, owner, repo, workflow_id, ref]
      # Not a tool this server offers: the driver's own publish action,
      # declared so that its approval is bound and legible the same way
      # every tool call's is. The gateway will never see a call by this
      # name, and no allowlist admits it.
      release_publish:     [owner, repo, tag]
    # The reads, and only the reads. create_branch, actions_run_trigger
    # and release_publish are absent and must stay absent: they are the
    # calls a human approves, one at a time.
    allow:
      - get_latest_release
      - get_release_by_tag
      - list_releases
      - list_tags
      - list_pull_requests
      - list_commits
      - actions_list
      - actions_get
    # One repository, at the plane. A read naming another is denied and
    # files a request, exactly as an unlisted tool does. Only the reads: a
    # standing constraint ADMITS, and admitting a branch creation without a
    # human would be the opposite of the design.
    bound:
      list_pull_requests:
        - {field: owner, op: eq, value: "${repo.owner}"}
        - {field: repo,  op: eq, value: "${repo.name}"}
      list_commits:
        - {field: owner, op: eq, value: "${repo.owner}"}
        - {field: repo,  op: eq, value: "${repo.name}"}
      list_tags:
        - {field: owner, op: eq, value: "${repo.owner}"}
        - {field: repo,  op: eq, value: "${repo.name}"}
      list_releases:
        - {field: owner, op: eq, value: "${repo.owner}"}
        - {field: repo,  op: eq, value: "${repo.name}"}
      get_latest_release:
        - {field: owner, op: eq, value: "${repo.owner}"}
        - {field: repo,  op: eq, value: "${repo.name}"}
      get_release_by_tag:
        - {field: owner, op: eq, value: "${repo.owner}"}
        - {field: repo,  op: eq, value: "${repo.name}"}
      actions_list:
        - {field: owner, op: eq, value: "${repo.owner}"}
        - {field: repo,  op: eq, value: "${repo.name}"}
      actions_get:
        - {field: owner, op: eq, value: "${repo.owner}"}
        - {field: repo,  op: eq, value: "${repo.name}"}

  # Microsoft's hosted Azure DevOps MCP server. Committed as `ado`, with
  # X-MCP-Toolsets: pipelines.
  ado:
    requires:
      core_list_projects:   [orgName]
      pipelines_definition: [action, orgName, project]
      pipelines_build:      [action, orgName, project, buildId]
      pipelines_build_log:  [action, orgName, project, buildId]
      pipelines_write:      [action, orgName, project, pipelineId, previewRun]
    allow:
      - core_list_projects
      - pipelines_definition
      - pipelines_build
      - pipelines_build_log
    # BUILDS ARE BOUNDED, NOT APPROVED (docs/release-agent.md). A build is
    # repeatable, reversible and cheap, so approving each one spends a
    # person's attention on the safest step — and it creates a race the
    # process cannot win: the Entra token lives about an hour, and the gap
    # between filing a request, a human approving it and the agent calling
    # is exactly that long. On the first real release run the token expired in
    # that window and stranded three approvals that had already been given.
    #
    # The caveat, since a constraint ADMITS: this bounds WHICH pipeline
    # runs, not WHAT it builds. The ref a run builds lives at
    # resources.repositories.<name>.refName, and Kaimahi's policy
    # vocabulary is top-level argument names only.
    bound:
      pipelines_write:
        - {field: action,     op: eq, value: run_pipeline,   when: ado_pipelines}
        - {field: orgName,    op: eq, value: "${ado_org}",     when: ado_pipelines}
        - {field: project,    op: eq, value: "${ado_project}", when: ado_pipelines}
        - {field: pipelineId, op: in, values: "${ado_pipelines}", when: ado_pipelines}
    # The Entra access token lives about an hour and a release session is
    # longer. It expired twice on the first real release run, and both times the
    # symptom was the agent reporting "there is no pipelines_build tool in
    # my toolset" — the seam had gone Accepted=False and kagent dropped its
    # tools. Cause and symptom nowhere near each other.
    refresh:
      command: [az, account, get-access-token, --scope, "https://mcp.dev.azure.com/.default", --query, accessToken, -o, tsv]
      secret: kaimahi-ado-token
      key: token
      requires: az
      seam: kaimahi-release-ado
      why: the Azure DevOps access token lives about an hour; this re-mints it into plane custody before every step that touches it

steps:
  - name: propose
    kind: read
    prompt: >-
      For the GitHub repository with owner ${repo.owner} and repo ${repo.name}, do three things in order.
      First, call get_latest_release and list_tags, and report the previous release tag and its date.
      Second, call list_pull_requests with state closed, base ${base}, sort updated, direction desc, perPage 50,
      and fields set to exactly number, title and merged_at -- do NOT ask for the body field, the listing does not
      fit in your context with it. A closed pull request is not necessarily merged, so count only those whose
      merged_at field is set and is later than the previous release; if every one of the 50 merged after it,
      say so and ask for the next page rather than guessing.
      Third, draft release notes for ${version} as short user-facing bullets grouped by theme, working from the
      titles alone, and list separately any pull request whose title says nothing a user could act on, with its
      number and title -- do not invent a meaning for it.
      Do not create anything. Report only what the tools told you.

  # A separate turn from `propose`, because of a bug the first version
  # shipped: the proposal's whole reply became the release body, so the first
  # real release got 80 lines of the agent's working notes. The proposal is for
  # a person to read before approving; the body is a different artifact and
  # has to be asked for separately.
  - name: compose
    kind: propose
    capture: notes
    prompt: >-
      Write the release notes body for ${version} of the GitHub repository owner ${repo.owner} repo ${repo.name}.
      First call get_latest_release and get_release_by_tag to read the PREVIOUS release's notes, and match
      its house style exactly -- its structure, heading style, tone and length.
      Base the content on the pull requests you already listed in this conversation; if you do not have them,
      call list_pull_requests with state closed, base ${base}, sort updated, direction desc, perPage 50, fields
      number, title and merged_at, and use only those merged after the previous release.
      Output ONLY the release notes markdown, ready to paste. No preamble, no explanation of what you did,
      no methodology, no counts of pull requests examined, no section about what you could not classify, and
      no sentence proposing or justifying the version number -- that decision was already made and a release
      body is not where it is argued.
      End with a line of the form: **Full Changelog**: https://github.com/${repo.owner}/${repo.name}/compare/PREVIOUS_TAG...${version}
      using the previous release tag you read.

  - name: cut
    kind: consequential
    call:
      upstream: github-release
      tool: create_branch
      args:
        owner: "${repo.owner}"
        repo: "${repo.name}"
        branch: "${release_branch}"
        from_branch: "${base}"
    prompt: >-
      Call create_branch with owner ${repo.owner}, repo ${repo.name}, branch ${release_branch},
      from_branch ${base}. Make exactly that one call and report what the tool returned.

  - name: build-github
    kind: consequential
    when: gh_workflows
    for_each: gh_workflows
    call:
      upstream: github-release
      tool: actions_run_trigger
      args:
        method: run_workflow
        owner: "${repo.owner}"
        repo: "${repo.name}"
        workflow_id: "${item}"
        ref: "${release_branch}"
    prompt: >-
      Call actions_run_trigger with method run_workflow, owner ${repo.owner}, repo ${repo.name},
      workflow_id ${item}, ref ${release_branch}. Make exactly that one call and report what the tool returned.

  - name: build-ado
    kind: bounded
    when: ado_pipelines
    for_each: ado_pipelines
    call:
      upstream: ado
      tool: pipelines_write
      args:
        action: run_pipeline
        orgName: "${ado_org}"
        project: "${ado_project}"
        pipelineId: "${item}"
      # The gateway canonicalises what it receives and the digest is over
      # that, so 41 and "41" are different calls.
      types:
        pipelineId: int
    prompt: >-
      Call pipelines_write with action run_pipeline, orgName ${ado_org}, project ${ado_project},
      pipelineId ${item}. Make exactly that one call and report what the tool returned.

  - name: watch-github
    kind: poll
    when: gh_workflows
    prompt: >-
      Report the current state of the GitHub release builds, from the tools only.
      Call actions_list with method list_workflow_runs, owner ${repo.owner}, repo ${repo.name}, and report the
      runs on branch ${release_branch} with their status and conclusion.
      End your answer with exactly one line reading STATE: RUNNING if anything is still in progress, or
      STATE: DONE if everything finished successfully, or STATE: FAILED if anything failed.
    poll:
      interval_seconds: 60
      timeout_seconds: 3600
      done: "STATE: DONE"
      failed: "STATE: FAILED"
      running: "STATE: RUNNING"
      on_failure: >-
        A build failed. Call actions_get with method get_workflow_run for the failing run on
        owner ${repo.owner} repo ${repo.name}. Say what failed and quote what it says. Do not guess at a cause.

  - name: watch-ado
    kind: poll
    when: ado_pipelines
    prompt: >-
      Report the current state of the Azure DevOps release builds, from the tools only.
      Call pipelines_build with action list, orgName ${ado_org}, project ${ado_project}, and report the most
      recent builds with their status and result.
      End your answer with exactly one line reading STATE: RUNNING if anything is still in progress, or
      STATE: DONE if everything finished successfully, or STATE: FAILED if anything failed.
    poll:
      interval_seconds: 60
      timeout_seconds: 3600
      done: "STATE: DONE"
      failed: "STATE: FAILED"
      running: "STATE: RUNNING"
      on_failure: >-
        A build failed. Call pipelines_build with action get_status and then pipelines_build_log for the failing
        build in orgName ${ado_org} project ${ado_project}. Say what failed and quote what the log says.
        Do not guess at a cause.

  # The DECISION is governed like every other consequential step: a request
  # naming the release, a human, a grant welded to it. The TRANSFER is not
  # — and that is stated rather than glossed. release-publish.sh moves the
  # artifacts with the operator's own `az` and `gh` (1.28 GB across five
  # assets on the last real release), because the gateway is deliberately
  # not in that path: the request-body cap is 4 MiB and an MCP gateway
  # moving binaries would be the wrong tool at any size.
  - name: publish
    kind: consequential
    when: ado_builds
    call:
      upstream: github-release
      tool: release_publish
      args:
        owner: "${repo.owner}"
        repo: "${repo.name}"
        tag: "${version}"
      ungoverned: >-
        the DECISION is governed and the TRANSFER is not. This step's action is
        scripts/release-publish.sh running on the operator's machine under their own
        `az` and `gh` — the artifacts never pass through Kaimahi's gateway, are not
        metered, and appear in no tool audit. What the plane records is that a human
        approved publishing this tag on this repository.
    exec:
      script: release-publish.sh
      requires: [az, gh, curl, python3, unzip]
      # Run before the approval, so whoever decides sees what lands on a
      # public release rather than a count they take on trust.
      preview: ["--list"]
      env:
        GITHUB_REPO: "${repo.owner}/${repo.name}"
        VERSION: "${version}"
        NOTES_FILE: "${notes_file}"
        RELEASE_TARGET: "${release_branch}"
        ADO_ORG: "${ado_org}"
        ADO_PROJECT: "${ado_project}"
        ADO_BUILDS: "${ado_builds}"
        ADO_ARTIFACTS: "${ado_artifacts}"
        ASSET_GLOBS: "${asset_globs}"
        PRERELEASE: "${prerelease}"
