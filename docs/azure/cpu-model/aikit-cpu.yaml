# Checkout-only dev template; create the reviewed namespace separately.
apiVersion: v1
kind: ConfigMap
metadata:
  name: aikit-cpu
  namespace: kmx-inference
data:
  config.yaml: |
    - name: qwen-3.5-2b
      backend: llama-cpp
      parameters:
        model: Qwen3.5-2B-Q4_K_M.gguf
        temperature: 0
        seed: 42
        top_p: 1
        top_k: 1
        min_p: 0
        presence_penalty: 0
        repeat_penalty: 1
        max_tokens: 64
      context_size: 4096
      threads: 3
      gpu_layers: 0
      mmap: true
      reasoning_effort: none
      template:
        use_tokenizer_template: true
      options:
        - "use_jinja:true"
      function:
        grammar:
          disable: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aikit-cpu
  namespace: kmx-inference
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: aikit-cpu
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aikit-cpu
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/os: linux
        kubernetes.io/arch: amd64
      containers:
        - name: model
          image: ghcr.io/kaito-project/aikit/qwen3.5:2b@sha256:d838c5eebf533b5b73f67cc7f4984921f87d64d28e4a52d482740b667f46b8b4
          imagePullPolicy: IfNotPresent
          args: ["--config-file=/etc/aikit/config.yaml"]
          env:
            - name: LOCALAI_FORCE_META_BACKEND_CAPABILITY
              value: cpu
          resources:
            requests:
              cpu: "1"
              memory: 3Gi
              ephemeral-storage: 1Gi
            limits:
              cpu: "3"
              memory: 4Gi
              ephemeral-storage: 4Gi
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 120
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /etc/aikit
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: aikit-cpu
---
apiVersion: v1
kind: Service
metadata:
  name: aikit-cpu
  namespace: kmx-inference
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: aikit-cpu
  ports:
    - name: http
      port: 8080
      targetPort: http
